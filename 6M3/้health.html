                options: [
                    { text: "ทักษะการปฏิเสธ (Refusal Skills) และการคิดวิเคราะห์ผลกระทบระยะยาว", isCorrect: true, rationale: "ทักษะการปฏิเสธช่วยให้วัยรุ่นแสดงจุดยืนปฏิเสธสิ่งเสพติดได้อย่างหนักแน่นควบคู่กับการคิดเชิงวิเคราะห์" },
                    { text: "ทักษะการต่อสู้ป้องกันตัวระยะประชิด", isCorrect: false, rationale: "เพื่อนชวนไม่ใช่การถูกทำร้ายร่างกาย จึงไม่ต้องใช้ทักษะต่อสู้" },
                    { text: "ทักษะการเจรจาต่อรองเพื่อสูบบุหรี่ไฟฟ้าในปริมาณที่น้อยลง", isCorrect: false, rationale: "การเจรจาต่อรองเพื่อทดลองไม่ใช่การปฏิเสธพฤติกรรมเสี่ยงที่ถูกต้อง" },
                    { text: "ทักษะการหาผลกำไรจากการขายบุหรี่ไฟฟ้า", isCorrect: false, rationale: "ผิดกฎหมายและขัดกับหลักสุขศึกษา" }
                ],
                hint: "ทักษะชีวิตในการพูดปฏิเสธเพื่อนเมื่อเผชิญแรงกดดันกลุ่ม"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answeredCurrent = false;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionProgressEl = document.getElementById('question-progress');
        const questionTagEl = document.getElementById('question-tag');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackBoxEl = document.getElementById('feedback-box');
        const feedbackTitleEl = document.getElementById('feedback-title');
        const feedbackRationaleEl = document.getElementById('feedback-rationale');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentScoreEl = document.getElementById('current-score');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreEl = document.getElementById('final-score');

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            questionProgressEl.textContent = `ข้อที่ ${currentQuestionIndex + 1} จาก ${quizData.length}`;
            questionTagEl.textContent = q.tag;
            questionTextEl.innerHTML = q.question;
            
            optionsContainerEl.innerHTML = '';
            feedbackBoxEl.classList.add('hidden');
            
            answeredCurrent = userAnswers[currentQuestionIndex] !== null;

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition flex items-center justify-between font-medium text-slate-700 bg-white hover:bg-indigo-50/50 border-slate-200`;
                btn.innerHTML = `<span>${String.fromCharCode(65 + index)}. ${option.text}</span>`;
                
                if (answeredCurrent) {
                    btn.disabled = true;
                    const savedAns = userAnswers[currentQuestionIndex];
                    if (index === savedAns.selectedIndex) {
                        if (option.isCorrect) {
                            btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between";
                        } else {
                            btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-50 text-rose-900 font-medium flex items-center justify-between";
                        }
                    } else if (option.isCorrect) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between";
                    }
                } else {
                    btn.onclick = () => selectOption(index);
                }
                
                optionsContainerEl.appendChild(btn);
            });

            if (answeredCurrent) {
                showFeedback(userAnswers[currentQuestionIndex].selectedIndex);
            }

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = !answeredCurrent;
            nextBtn.textContent = currentQuestionIndex === quizData.length - 1 ? 'ดูผลคะแนน' : 'ข้อถัดไป';
        }

        function selectOption(selectedIndex) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = quizData[currentQuestionIndex];
            const selectedOpt = q.options[selectedIndex];
            
            userAnswers[currentQuestionIndex] = {
                selectedIndex: selectedIndex,
                isCorrect: selectedOpt.isCorrect
            };

            if (selectedOpt.isCorrect) {
                score++;
                currentScoreEl.textContent = score;
            }

            const buttons = optionsContainerEl.getElementsByTagName('button');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === selectedIndex) {
                    buttons[i].className = selectedOpt.isCorrect 
                        ? "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between"
                        : "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-50 text-rose-900 font-medium flex items-center justify-between";
                } else if (q.options[i].isCorrect) {
                    buttons[i].className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-center justify-between";
                }
            }

            showFeedback(selectedIndex);
            nextBtn.disabled = false;
        }

        function showFeedback(selectedIndex) {
            const q = quizData[currentQuestionIndex];
            const selectedOpt = q.options[selectedIndex];
            
            feedbackBoxEl.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'bg-rose-50', 'border-rose-200');
            
            if (selectedOpt.isCorrect) {
                feedbackBoxEl.classList.add('bg-emerald-50', 'border-emerald-200');
                feedbackTitleEl.className = "font-bold text-base mb-1 text-emerald-800";
                feedbackTitleEl.textContent = "✨ ถูกต้องเยี่ยมมาก!";
            } else {
                feedbackBoxEl.classList.add('bg-rose-50', 'border-rose-200');
                feedbackTitleEl.className = "font-bold text-base mb-1 text-rose-800";
                feedbackTitleEl.textContent = "❌ ยังไม่ถูกต้องครับ";
            }
            feedbackRationaleEl.className = selectedOpt.isCorrect ? "text-emerald-700 leading-relaxed text-sm" : "text-rose-700 leading-relaxed text-sm";
            feedbackRationaleEl.textContent = selectedOpt.rationale;
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            finalScoreEl.textContent = score;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            currentScoreEl.textContent = score;
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
