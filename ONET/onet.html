<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่คำศัพท์ On, In, Under, At</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 25px;
            text-align: center;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #636e72;
            background: #dfe6e9;
            padding: 10px;
            border-radius: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .card {
            aspect-ratio: 1;
            background-color: #0984e3;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card.flipped {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card.matched {
            transform: rotateY(180deg);
            background-color: #00b894 !important;
            cursor: default;
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            padding: 5px;
            text-align: center;
        }

        .card-front {
            background: linear-gradient(135deg, #0984e3, #74b9ff);
            color: white;
            font-size: 24px;
        }

        .card-back {
            background-color: #fff;
            color: #2d3436;
            transform: rotateY(180deg);
            border: 3px solid #dfe6e9;
        }

        .btn-restart {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,184,148,0.3);
        }

        .btn-restart:hover {
            background-color: #00a884;
            transform: translateY(-2px);
        }

        .btn-restart:active {
            transform: translateY(0);
        }

        /* Modal ชนะเกม */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: popUp 0.3s ease;
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: #00b894;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #636e72;
            margin-bottom: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 เกมจับคู่ Prepositions (On, In, Under, At)</h1>
        <p style="color: #636e72; margin-bottom: 15px;">พลิกการ์ดหาคู่คำศัพท์และความหมายให้ถูกต้องทั้งหมด 10 คู่!</p>
        
        <div class="score-board">
            <div>เปิดไปแล้ว: <span id="flips">0</span> ครั้ง</div>
            <div>จับคู่ได้: <span id="matches">0</span> / 10 คู่</div>
        </div>

        <div class="grid" id="cardGrid"></div>

        <button class="btn-restart" onclick="startGame()">เริ่มเกมใหม่</button>
    </div>

    <!-- Modal เมื่อชนะ -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>🎉 ยอดเยี่ยมมาก!</h2>
            <p id="winText">คุณจับคู่คำศัพท์ครบทั้งหมดแล้ว!</p>
            <button class="btn-restart" onclick="startGame()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        // ข้อมูล 10 คู่คำศัพท์ (คำศัพท์ + ประโยคตัวอย่าง/คำแปล)
        const rawPairs = [
            { id: 1, term: "On", desc: "บน (พื้นผิวสัมผัส)" },
            { id: 2, term: "In", desc: "ใน (พื้นที่ปิด)" },
            { id: 3, term: "Under", desc: "ใต้ (ด้านล่าง)" },
            { id: 4, term: "At", desc: "ที่ (จุดเฉพาะเจาะจง)" },
            { id: 5, term: "On the table", desc: "อยู่บนโต๊ะ" },
            { id: 6, term: "In the box", desc: "อยู่ในกล่อง" },
            { id: 7, term: "Under the bed", desc: "อยู่ใต้เตียง" },
            { id: 8, term: "At school", desc: "อยู่ที่โรงเรียน" },
            { id: 9, term: "On the wall", desc: "อยู่บนผนัง" },
            { id: 10, term: "In the room", desc: "อยู่ในห้อง" }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let flipCount = 0;
        let isLockBoard = false;

        const grid = document.getElementById('cardGrid');
        const flipsDisplay = document.getElementById('flips');
        const matchesDisplay = document.getElementById('matches');
        const winModal = document.getElementById('winModal');
        const winText = document.getElementById('winText');

        function startGame() {
            winModal.style.display = 'none';
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            flipCount = 0;
            isLockBoard = false;
            flipsDisplay.textContent = flipCount;
            matchesDisplay.textContent = matchedCount;

            // สร้างการ์ด 20 ใบ (10 คู่)
            cards = [];
            rawPairs.forEach(pair => {
                cards.push({ pairId: pair.id, content: pair.term, type: 'term' });
                cards.push({ pairId: pair.id, content: pair.desc, type: 'desc' });
            });

            // สุ่มตำแหน่งการ์ด
            cards.sort(() => Math.random() - 0.5);

            // สร้าง HTML ของการ์ด
            cards.forEach((cardData, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.index = index;
                card.dataset.pairId = cardData.pairId;

                card.innerHTML = `
                    <div class="card-face card-front">❓</div>
                    <div class="card-face card-back">${cardData.content}</div>
                `;

                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (isLockBoard) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                flipCount++;
                flipsDisplay.textContent = flipCount;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            flippedCards.forEach(card => {
                card.classList.add('matched');
            });
            matchedCount++;
            matchesDisplay.textContent = matchedCount;
            resetTurn();

            if (matchedCount === 10) {
                setTimeout(() => {
                    winText.textContent = `คุณทำภารกิจสำเร็จด้วยการเปิด ${flipCount} ครั้ง!`;
                    winModal.style.display = 'flex';
                }, 400);
            }
        }

        function unflipCards() {
            isLockBoard = true;
            setTimeout(() => {
                flippedCards.forEach(card => {
                    card.classList.remove('flipped');
                });
                resetTurn();
            }, 900);
        }

        function resetTurn() {
            flippedCards = [];
            isLockBoard = false;
        }

        // เริ่มเกมครั้งแรกเมื่อโหลดหน้าเว็บ
        startGame();
    </script>
</body>
</html>
