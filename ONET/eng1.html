<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่คำศัพท์ ป.2 แสนสนุก</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Custom bouncing animation for matched cards */
        @keyframes bounceMatch {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.08); }
        }

        .card-matched {
            animation: bounceMatch 0.4s ease;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 border-4 border-yellow-300">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="text-center md:text-left">
                <span class="bg-yellow-400 text-yellow-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">ระดับชั้น ป.2 🎒</span>
                <h1 class="text-3xl md:text-4xl font-bold text-indigo-700 mt-1 drop-shadow-sm">✨ สนุกกับคำศัพท์ภาษาอังกฤษ ✨</h1>
                <p class="text-gray-600 text-sm mt-1">พลิกการ์ดจับคู่คำศัพท์และรูปภาพให้ถูกต้องครบทุกคู่!</p>
            </div>

            <!-- Stats Dashboard -->
            <div class="flex items-center gap-3 bg-indigo-50 border-2 border-indigo-200 px-5 py-3 rounded-2xl shadow-inner">
                <div class="text-center px-3 border-r border-indigo-200">
                    <span class="block text-xs text-indigo-500 font-bold">เวลา ⏱️</span>
                    <span id="timer" class="text-xl font-bold text-indigo-700">00:00</span>
                </div>
                <div class="text-center px-3 border-r border-indigo-200">
                    <span class="block text-xs text-indigo-500 font-bold">เปิด 👆</span>
                    <span id="flips" class="text-xl font-bold text-indigo-700">0</span>
                </div>
                <div class="text-center px-3">
                    <span class="block text-xs text-indigo-500 font-bold">คู่ ⭐</span>
                    <span id="matches" class="text-xl font-bold text-emerald-600">0/8</span>
                </div>
            </div>
        </div>

        <!-- Game Board Grid (16 cards = 8 pairs) -->
        <div id="game-grid" class="grid grid-cols-4 gap-3 md:gap-4 mb-6">
            <!-- Cards will be injected dynamically via JavaScript -->
        </div>

        <!-- Controls Footer -->
        <div class="flex justify-between items-center">
            <button id="sound-toggle" onclick="toggleSound()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 border-2 border-gray-300 text-sm">
                🔊 เปิด/ปิดเสียง
            </button>
            <button onclick="startGame()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg transform hover:scale-105 active:scale-95 transition flex items-center gap-2 text-lg">
                🔄 เริ่มเกมใหม่
            </button>
        </div>
    </div>

    <!-- Win Modal Popup -->
    <div id="win-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center border-4 border-yellow-400 shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="text-6xl mb-3 animate-bounce">🏆🎉</div>
            <h2 class="text-3xl font-bold text-indigo-700 mb-2">เก่งมากเด็กๆ!</h2>
            <p id="win-message" class="text-gray-600 mb-6 text-lg">คุณทำภารกิจจับคู่คำศัพท์สำเร็จแล้ว!</p>
            <div class="flex justify-center gap-4">
                <button onclick="startGame()" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold px-8 py-3 rounded-2xl shadow-lg text-lg transform hover:scale-105 transition">
                    เล่นอีกครั้ง 🌟
                </button>
            </div>
        </div>
    </div>

    <script>
        // Grade 2 English Vocabulary Data (8 Pairs)
        const vocabData = [
            { id: 1, word: "Cat", meaning: "แมว 🐱" },
            { id: 2, word: "Dog", meaning: "สุนัข 🐶" },
            { id: 3, word: "Apple", meaning: "แอปเปิ้ล 🍎" },
            { id: 4, word: "Sun", meaning: "พระอาทิตย์ ☀️" },
            { id: 5, word: "Book", meaning: "หนังสือ 📖" },
            { id: 6, word: "Fish", meaning: "ปลา 🐟" },
            { id: 7, word: "Car", meaning: "รถยนต์ 🚗" },
            { id: 8, word: "Tree", meaning: "ต้นไม้ 🌳" }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let flipCount = 0;
        let isLocked = false;
        let timerInterval = null;
        let secondsElapsed = 0;
        let gameStarted = false;
        let soundEnabled = true;

        // Professional Web Audio API Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'flip') {
                // Short card flip sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                // Joyful success chime chord
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + i * 0.05);
                    g.gain.setValueAtTime(0.15, now + i * 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35 + i * 0.05);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + i * 0.05);
                    o.stop(now + 0.4 + i * 0.05);
                });
            } else if (type === 'wrong') {
                // Low gentle error buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'win') {
                // Triumphant victory fanfare melody
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + i * 0.12);
                    g.gain.setValueAtTime(0.2, now + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + i * 0.12);
                    o.stop(now + i * 0.12 + 0.35);
                });
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle');
            btn.innerHTML = soundEnabled ? '🔊 เปิด/ปิดเสียง' : '🔇 ปิดเสียงอยู่';
            btn.classList.toggle('bg-gray-200', !soundEnabled);
        }

        function startGame() {
            // Reset state variables
            flippedCards = [];
            matchedPairs = 0;
            flipCount = 0;
            isLocked = false;
            gameStarted = false;
            secondsElapsed = 0;
            
            clearInterval(timerInterval);
            document.getElementById('timer').innerText = "00:00";
            document.getElementById('flips').innerText = "0";
            document.getElementById('matches').innerText = `0/${vocabData.length}`;
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('win-modal').classList.remove('flex');

            // Prepare duplicate cards for matching pairs (Word card and Meaning card)
            cards = [];
            vocabData.forEach(item => {
                cards.push({ id: item.id, content: item.word, type: 'word' });
                cards.push({ id: item.id, content: item.meaning, type: 'meaning' });
            });

            // Shuffle cards randomly
            cards.sort(() => Math.random() - 0.5);

            // Render grid
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'perspective-1000 h-24 md:h-32 cursor-pointer select-none';
                cardElement.innerHTML = `
                    <div class="card-inner relative w-full h-full duration-300 transform-style-3d rounded-2xl shadow-md" data-index="${index}" data-id="${card.id}">
                        <!-- Front Face (Hidden state) -->
                        <div class="card-front absolute inset-0 w-full h-full bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold border-2 border-indigo-300 shadow-inner hover:scale-102 transition">
                            ⭐
                        </div>
                        <!-- Back Face (Revealed state) -->
                        <div class="card-back absolute inset-0 w-full h-full bg-white rounded-2xl flex items-center justify-center text-gray-800 text-sm md:text-xl font-bold rotate-y-180 backface-hidden border-4 border-yellow-300 p-2 text-center shadow-lg">
                            ${card.content}
                        </div>
                    </div>
                `;

                cardElement.addEventListener('click', () => flipCard(cardElement, index));
                grid.appendChild(cardElement);
            });
        }

        function flipCard(cardElement, index) {
            if (isLocked) return;
            const inner = cardElement.querySelector('.card-inner');
            
            // Prevent clicking already matched or flipped cards
            if (inner.classList.contains('flipped') || inner.classList.contains('matched')) return;

            // Start timer on first flip
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                    const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                    document.getElementById('timer').innerText = `${mins}:${secs}`;
                }, 1000);
            }

            playSound('flip');
            inner.classList.add('flipped');
            flippedCards.push({ element: inner, id: inner.dataset.id, index });

            if (flippedCards.length === 2) {
                flipCount++;
                document.getElementById('flips').innerText = flipCount;
                checkForMatch();
            }
        }

        function checkForMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.id === card2.id && card1.index !== card2.index) {
                // Match found!
                playSound('match');
                card1.element.classList.add('matched', 'card-matched');
                card2.element.classList.add('matched', 'card-matched');
                matchedPairs++;
                document.getElementById('matches').innerText = `${matchedPairs}/${vocabData.length}`;
                resetTurn();

                // Check for win condition
                if (matchedPairs === vocabData.length) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        playSound('win');
                        const mins = Math.floor(secondsElapsed / 60);
                        const secs = secondsElapsed % 60;
                        const timeStr = mins > 0 ? `${mins} นาที ${secs} วินาที` : `${secs} วินาที`;
                        document.getElementById('win-message').innerText = `คุณยอดเยี่ยมมาก! จับคู่คำศัพท์ครบทั้งหมดภายในเวลา ${timeStr} และเปิดไป ${flipCount} ครั้ง!`;
                        const modal = document.getElementById('win-modal');
                        modal.classList.remove('hidden');
                        modal.classList.add('flex');
                    }, 500);
                }
            } else {
                // No match
                playSound('wrong');
                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    resetTurn();
                }, 900);
            }
        }

        function resetTurn() {
            flippedCards = [];
            isLocked = false;
        }

        // Initialize game on window load
        window.onload = function() {
            startGame();
        };
    </script>
</body>
</html>
