<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่คำศัพท์ ป.2 สนุกๆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8ede, #fed6e3);
            background: linear-gradient(135deg, #74b9ff, #ffeaa7);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            padding: 25px;
            text-align: center;
            border: 5px solid #fff;
        }

        h1 {
            color: #d63031;
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        .subtitle {
            color: #636e72;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #2d3436;
            background: #f1f2f6;
            padding: 12px;
            border-radius: 15px;
        }

        .scoreboard span {
            color: #0984e3;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
        }

        .card {
            aspect-ratio: 1;
            background-color: transparent;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
        }
