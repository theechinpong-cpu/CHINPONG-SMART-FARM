<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบปลายภาคเรียนที่ 1 วิชาภาษาอังกฤษ ชั้น ป.5 - พระจอมเกล้าติวเตอร์</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header & Summary Section */
        .summary-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--primary);
        }

        .summary-card h1 {
            color: var(--primary);
            font-size: 1.7rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-lang {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-reset {
            background-color: #ef4444;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .summary-content {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 20px;
        }

        .summary-content h3 {
            color: var(--primary-dark);
            margin: 14px 0 6px 0;
        }

        .trick-box {
            background-color: #fffbeb;
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
        }

        .trick-box h4 {
            color: #b45309;
            margin-bottom: 8px;
        }

        /* Main Workspace Layout (70% Quiz : 30% Whiteboard) */
        .workspace {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .quiz-panel {
            flex: 7;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .whiteboard-panel {
            flex: 3;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 15px;
            height: fit-content;
        }

        /* Quiz UI Elements */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .q-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .q-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .q-clue {
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 15px;
            display: inline-block;
        }

        .q-clue span {
            font-weight: bold;
            color: var(--primary);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            text-align: left;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .opt-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: var(--primary);
        }

        .opt-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: 600;
        }

        .opt-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d;
        }

        .opt-btn:disabled {
            cursor: default;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #f8fafc;
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .tutor-tip {
            margin-top: 6px;
            font-weight: 600;
            color: #b45309;
        }

        /* Whiteboard */
        .wb-header {
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wb-canvas {
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            cursor: crosshair;
            width: 100%;
            height: 380px;
            touch-action: none;
        }

        .wb-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .wb-btn {
            padding: 4px 10px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        /* Result Section */
        .result-panel {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .result-panel h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-box {
            display: inline-block;
            background: #eff6ff;
            border: 2px solid var(--primary);
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .analysis-card {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .analysis-card.strength {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .analysis-card.weakness {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .analysis-card h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .strength h3 { color: #15803d; }
        .weakness h3 { color: #b91c1c; }

        .footer-tag {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 992px) {
            .workspace {
                flex-direction: column;
            }
            .whiteboard-panel {
                width: 100%;
                position: static;
            }
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Section 1: สรุปเนื้อหา + เทคนิคกระบวนการคิด (500+ คำ) -->
    <div class="summary-card">
        <h1>
            <span id="txt-title">คลังข้อสอบเข้มข้น ปลายภาคเรียนที่ 1 วิชาภาษาอังกฤษ ชั้น ป.5 (หลักสูตร รร.ดรุณศึกษา - ระดับยาก)</span>
            <div class="header-controls">
                <button class="btn btn-lang" onclick="toggleLanguage()" id="btn-lang-toggle">EN / TH</button>
                <button class="btn btn-reset" onclick="resetAllState()" id="txt-btn-reset">รีเซ็ตข้อสอบ</button>
            </div>
        </h1>

        <div class="summary-content" id="summary-text-block">
            <!-- Content rendered dynamically -->
        </div>

        <div class="trick-box" id="trick-box-block">
            <!-- Tricks rendered dynamically -->
        </div>
    </div>

    <!-- Section 2: พื้นที่สอบ 2 ฝั่ง (ข้อสอบ 70% + ไวท์บอร์ด 30%) -->
    <div class="workspace">
        <div class="quiz-panel">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="quiz-container">
                <!-- 50 Items Rendered Here -->
            </div>
            <button class="btn btn-lang" id="btn-submit-all" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 15px; display: none;" onclick="showFinalResult()">ดูผลคะแนนและบทวิเคราะห์</button>
        </div>

        <div class="whiteboard-panel">
            <div class="wb-header">
                <span id="txt-wb-title">กระดานทดข้อสอบ (Whiteboard)</span>
            </div>
            <canvas id="wb-canvas" class="wb-canvas"></canvas>
            <div class="wb-controls">
                <button class="wb-btn" onclick="setWbColor('#000000')">ดำ</button>
                <button class="wb-btn" onclick="setWbColor('#dc2626')">แดง</button>
                <button class="wb-btn" onclick="setWbColor('#1e3a8a')">น้ำเงิน</button>
                <button class="wb-btn" onclick="clearWhiteboard()" id="txt-wb-clear">ล้างกระดาน</button>
            </div>
        </div>
    </div>

    <!-- Section 3: สรุปผลและการวิเคราะห์จุดเด่น/จุดด้อย -->
    <div class="result-panel" id="result-panel">
        <h2 id="txt-res-title">ผลการประเมินและการวิเคราะห์สมรรถนะ</h2>
        <div class="score-box" id="score-display">0 / 50 คะแนน</div>
        
        <div class="analysis-grid">
            <div class="analysis-card strength">
                <h3 id="txt-str-title">จุดเด่นที่ทำได้ยอดเยี่ยม (Strengths)</h3>
                <ul id="strength-list" style="padding-left: 20px;"></ul>
            </div>
            <div class="analysis-card weakness">
                <h3 id="txt-weak-title">จุดที่ควรทบทวนและพัฒนา (Areas for Improvement)</h3>
                <ul id="weakness-list" style="padding-left: 20px;"></ul>
            </div>
        </div>
    </div>

    <div class="footer-tag" id="footer-text">
        เขียนโดย พระจอมเกล้าติวเตอร์
    </div>
</div>

<script>
// --- Database คลังข้อสอบ 50 ข้อ ปลายภาค ป.5 เทอม 1 ระดับยาก ---
const rawQuizData = [
    // --- สาระที่ 1: Tenses & Grammar Structures (ข้อ 1-15) ---
    {
        id: 1, category: "Grammar & Structure",
        q_th: "My uncle, along with his two sons, ______ the organic vegetable garden every Saturday morning.",
        q_en: "My uncle, along with his two sons, ______ the organic vegetable garden every Saturday morning.",
        clue_th: "สังเกตวลีคั่น 'along with his two sons' ให้ตัดทิ้ง ประธานแท้คือ 'My uncle' (เอกพจน์) + every Saturday morning (Present Simple)",
        clue_en: "Focus on the head subject 'My uncle' (singular) and the routine time marker 'every Saturday morning'.",
        options_th: ["waters", "water", "are watering", "watered"],
        options_en: ["waters", "water", "are watering", "watered"],
        correct: 0,
        exp_th: "ประธานแท้คือ 'My uncle' (เอกพจน์ บุรุษที่ 3) วลี 'along with...' เป็นเพียงส่วนขยายคั่นกลาง เมื่อเป็นกิจวัตรประจำวัน (Present Simple) กริยาจึงต้องเติม -s คือ 'waters'",
        exp_en: "The true subject is 'My uncle' (singular). The intervening phrase 'along with...' does not affect agreement. Present Simple requires 'waters'.",
        tip: "จำสูตร: เจอ 'along with / together with / as well as' ให้ตัดทิ้ง ผันกริยาตามประธานตัวหน้าสุด!"
    },
    {
        id: 2, category: "Grammar & Structure",
        q_th: "Listen! The school orchestra ______ the new national anthem in the auditorium right now.",
        q_en: "Listen! The school orchestra ______ the new national anthem in the auditorium right now.",
        clue_th: "คำบอกเวลาและสัญญาณ 'Listen!' + 'right now' บ่งบอกเหตุการณ์ที่กำลังดำเนินอยู่ (Present Continuous = is/am/are + V.ing)",
        clue_en: "Imperative signal 'Listen!' and 'right now' denote an ongoing action in Present Continuous.",
        options_th: ["is practicing", "practices", "practiced", "are practicing"],
        options_en: ["is practicing", "practices", "practiced", "are practicing"],
        correct: 0,
        exp_th: "'Listen!' และ 'right now' เป็นคำบ่งชี้ Present Continuous Tense ประธาน 'The school orchestra' ถือเป็นคำนามเอกพจน์กลุ่มก้อน (Collective Noun 1 วง) จึงใช้ 'is practicing'",
        exp_en: "Present Continuous (is + V-ing) is used with 'Listen!' and 'right now'. 'The school orchestra' acts as a singular collective noun.",
        tip: "สูตร Present Continuous: มองหา Look! / Listen! / at the moment / right now -> ใช้ is/am/are + V.ing เสมอ!"
    },
    {
        id: 3, category: "Grammar & Structure",
        q_th: "Although David felt dizzy, he ______ to take a nap during the science lesson yesterday.",
        q_en: "Although David felt dizzy, he ______ to take a nap during the science lesson yesterday.",
        clue_th: "เหตุการณ์ในอดีต (yesterday) ในรูปปฏิเสธ Past Simple: did not (didn't) + กริยาช่อง 1 ไม่ผัน (V.1/Bare Infinitive)",
        clue_en: "Negative Past Simple with 'yesterday' requires 'didn't + V.1 (base form)'.",
        options_th: ["didn't want", "didn't wanted", "wasn't want", "doesn't want"],
        options_en: ["didn't want", "didn't wanted", "wasn't want", "doesn't want"],
        correct: 0,
        exp_th: "มีคำบอกเวลาในอดีต 'yesterday' และ 'felt' (V.2) เมื่อทำเป็นประโยคปฏิเสธของ Past Simple ต้องใช้ 'didn't + V.1' เสมอ คือ 'didn't want' (ห้ามเติม -ed หลัง didn't เด็ดขาด)",
        exp_en: "Past Simple negative uses 'did not / didn't + base verb' -> 'didn't want'.",
        tip: "ระวังกับดัก: หลัง did / didn't กริยาต้องคืนรูปเดิมช่อง 1 ห้ามเติม -ed หรือเปลี่ยนรูปซ้ำ!"
    },
    {
        id: 4, category: "Grammar & Structure",
        q_th: "How often ______ your elder sister go to the public library to borrow English storybooks?",
        q_en: "How often ______ your elder sister go to the public library to borrow English storybooks?",
        clue_th: "ประโยคคำถามถามความถี่ (How often) กับประธาน 'your elder sister' (คนเดียว = เอกพจน์) ต้องใช้กริยาช่วย 'does'",
        clue_en: "Question form in Present Simple with singular subject 'your elder sister' uses auxiliary 'does'.",
        options_th: ["does", "do", "is", "did"],
        options_en: ["does", "do", "is", "did"],
        correct: 0,
        exp_th: "ประธาน 'your elder sister' เป็นเอกพจน์บุรุษที่ 3 ในประโยคคำถาม Present Simple ที่มีกริยาแท้ 'go' อยู่แล้ว ต้องใช้กริยาช่วย 'does' มาช่วยสร้างคำถาม",
        exp_en: "'your elder sister' is singular, so the question requires auxiliary 'does' before the base verb 'go'.",
        tip: "สูตรคำถาม: How often + do/does + ประธาน + V.1? (ประธาน 1 คนใช้ does, หลายคนใช้ do)"
    },
    {
        id: 5, category: "Grammar & Structure",
        q_th: "Look at those dark clouds! It ______ rain very heavily in a few minutes.",
        q_en: "Look at those dark clouds! It ______ rain very heavily in a few minutes.",
        clue_th: "การทำนายอนาคตโดยมี 'หลักฐานชัดเจนให้เห็นตรงหน้า' (dark clouds) ต้องใช้ 'be going to'",
        clue_en: "Future prediction based on present visual evidence ('dark clouds') requires 'is going to'.",
        options_th: ["is going to", "will", "goes to", "is"],
        options_en: ["is going to", "will", "goes to", "is"],
        correct: 0,
        exp_th: "เมื่อมีหลักฐานที่มองเห็นชัดเจนในปัจจุบัน (Look at those dark clouds!) หลักภาษาอังกฤษจะใช้โครงสร้าง 'be going to + V.1' แทน will เพื่อบอกเหตุการณ์ที่กำลังจะเกิดขึ้นอย่างแน่นอนในอนาคตอันใกล้",
        exp_en: "Predictions with visible evidence use 'be going to' -> 'is going to rain'.",
        tip: "เทคนิคแยก will vs be going to: มีหลักฐานคาตา (เมฆดำ/คนเดินสะดุด) -> ใช้ be going to!"
    },
    {
        id: 6, category: "Grammar & Structure",
        q_th: "While my mother was baking blueberry muffins, my little brother ______ with his toy train.",
        q_en: "While my mother was baking blueberry muffins, my little brother ______ with his toy train.",
        clue_th: "สองเหตุการณ์กำลังเกิดขึ้นพร้อมๆ กันในอดีต (While + Past Continuous, Past Continuous)",
        clue_en: "Two parallel ongoing past actions linked by 'While' both use Past Continuous (was/were + V.ing).",
        options_th: ["was playing", "played", "is playing", "plays"],
        options_en: ["was playing", "played", "is playing", "plays"],
        correct: 0,
        exp_th: "ประโยคนี้แสดง 2 เหตุการณ์ที่กำลังดำเนินไปพร้อมกันในอดีต (แม่กำลังอบขนม ในขณะที่น้องชายก็กำลังเล่นของเล่น) เชื่อมด้วย While จึงใช้ Past Continuous ทั้งคู่: 'was playing'",
        exp_en: "Parallel past continuous actions use 'was/were + V-ing'. Singular subject 'my little brother' takes 'was playing'.",
        tip: "สูตรคู่ขนาน: While + was/were V.ing, was/were V.ing (ทำคู่กันไปในอดีต)"

    {
        id: 7, category: "Grammar & Structure",

        clue_th: "หน้า 'usually' (Present Simple) / หลัง 'today/but today' (กำลังทำในวันนี้ = Present Continuous)",
        clue_en: "First clause shows routine habit ('usually' -> finishes); second shows temporary action ('today' -> is helping).",
        options_th: ["finishes / is helping", "finish / helps", "is finishing / helps", "finished / helped"],

        tip: "จับคู่ Tense: กิจวัตรประจำ (usually) ใช้ V.1 / วันนี้ทำต่างไป (today) ใช้ is/am/are + V.ing"
    },
    {
        id: 8, category: "Grammar & Structure",
        q_th: "Where ______ you and your classmates go for the science field trip last Friday?",

        clue_en: "Past time marker 'last Friday' requires auxiliary 'did' for wh-questions with base verb 'go'.",
        options_th: ["did", "were", "do", "are"],

// --- Fisher-Yates Shuffle Algorithm ---
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// --- App Initialization & LocalStorage Engine ---
function initQuiz() {
    const savedState = localStorage.getItem('tutor_p5_eng_final_50');
    const savedLang = localStorage.getItem('tutor_p5_eng_lang');
    if (savedLang) currentLang = savedLang;

    renderSummarySection();

    if (savedState) {
        try {
            const parsed = JSON.parse(savedState);
            randomizedQuestions = parsed.questions;
            userAnswers = parsed.answers || {};
        } catch (e) {
            setupFreshQuiz();
        }
    } else {
        setupFreshQuiz();
    }

    renderQuizCards();
    updateProgress();
    checkIfAllAnswered();
    initWhiteboard();
}

function setupFreshQuiz() {
    let shuffledQ = shuffleArray(rawQuizData);
    randomizedQuestions = shuffledQ.map(q => {
        let indices = [0, 1, 2, 3];
        let shuffledIndices = shuffleArray(indices);
        return {
            ...q,
            shuffledIndices: shuffledIndices
        };
    });
    userAnswers = {};
    saveState();
}

function saveState() {
    const stateObj = {
        questions: randomizedQuestions,
        answers: userAnswers
    };
    localStorage.setItem('tutor_p5_eng_final_50', JSON.stringify(stateObj));
    localStorage.setItem('tutor_p5_eng_lang', currentLang);
}

        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        qCard.id = `question-card-${qIdx}`;

        const isAnswered = userAnswers.hasOwnProperty(qIdx);
        const selectedOptIdx = isAnswered ? userAnswers[qIdx] : null;

        const qTitle = currentLang === 'th' ? item.q_th : item.q_en;
        const qClue = currentLang === 'th' ? item.clue_th : item.clue_en;
        const clueLabel = currentLang === 'th' ? '💡 คำใบ้ (Clue): ' : '💡 Clue: ';
        const catLabel = item.category;

        let optionsHtml = '';
        item.shuffledIndices.forEach((origIdx, posIdx) => {
            const optText = currentLang === 'th' ? item.options_th[origIdx] : item.options_en[origIdx];
            let optClass = 'opt-btn';
            
            if (isAnswered) {
                if (origIdx === item.correct) {
                    optClass += ' correct';
                } else if (origIdx === selectedOptIdx) {
                    optClass += ' incorrect';
                }
            }

            optionsHtml += `
                <button class="${optClass}" 
                        onclick="handleSelectOption(${qIdx}, ${origIdx})" 
                        ${isAnswered ? 'disabled' : ''}>
                    ${String.fromCharCode(65 + posIdx)}. ${optText}
                </button>
            `;
        });

        const expText = currentLang === 'th' ? item.exp_th : item.exp_en;
        const tutorNote = currentLang === 'th' ? '✨ เทคนิคลัดพระจอมเกล้าติวเตอร์: ' : '✨ Tutor Secret Technique: ';

        qCard.innerHTML = `
            <div class="q-header">
                <span>ข้อที่ ${qIdx + 1} / 50</span>
                <span>สาระ: ${catLabel}</span>
            </div>
            <div class="q-title">${qIdx + 1}. ${qTitle}</div>
            <div class="q-clue"><span>${clueLabel}</span>${qClue}</div>
            <div class="options-list">${optionsHtml}</div>
            <div class="explanation" id="exp-${qIdx}" style="display: ${isAnswered ? 'block' : 'none'};">
                <div><b>${currentLang === 'th' ? 'คำอธิบายเชิงลึก:' : 'Detailed Explanation:'}</b><br>${expText.replace(/\n/g, '<br>')}</div>
                <div class="tutor-tip">${tutorNote}${item.tip}</div>
            </div>
        `;

        container.appendChild(qCard);
    });
}

function handleSelectOption(qIdx, selectedOrigIdx) {
    if (userAnswers.hasOwnProperty(qIdx)) return;

    userAnswers[qIdx] = selectedOrigIdx;
    saveState();

    const item = randomizedQuestions[qIdx];
    const qCard = document.getElementById(`question-card-${qIdx}`);
    const buttons = qCard.querySelectorAll('.opt-btn');

    item.shuffledIndices.forEach((origIdx, posIdx) => {
        const btn = buttons[posIdx];
        btn.disabled = true;
        if (origIdx === item.correct) {
            btn.classList.add('correct');
        } else if (origIdx === selectedOrigIdx) {
            btn.classList.add('incorrect');
        }
    });

    const expBox = document.getElementById(`exp-${qIdx}`);
    expBox.style.display = 'block';

    updateProgress();
    checkIfAllAnswered();
}

function updateProgress() {
    const answeredCount = Object.keys(userAnswers).length;
    const pct = (answeredCount / randomizedQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${pct}%`;
}

function checkIfAllAnswered() {
    const total = randomizedQuestions.length;
    const answered = Object.keys(userAnswers).length;
    const submitBtn = document.getElementById('btn-submit-all');
    if (answered === total && total > 0) {
        submitBtn.style.display = 'block';
    } else {
        submitBtn.style.display = 'none';
    }
}

function toggleLanguage() {
    currentLang = currentLang === 'th' ? 'en' : 'th';
    localStorage.setItem('tutor_p5_eng_lang', currentLang);
    renderSummarySection();
    renderQuizCards();
    if (Object.keys(userAnswers).length === randomizedQuestions.length) {
        showFinalResult();
    }
}

// --- Assessment & Diagnostic System ---
function showFinalResult() {
    const resultPanel = document.getElementById('result-panel');
    resultPanel.style.display = 'block';

    let totalScore = 0;
    let categoryStats = {
        "Grammar & Structure": { total: 0, correct: 0 },
        "Quantifiers & Comparisons": { total: 0, correct: 0 },
        "Prepositions & Vocabulary": { total: 0, correct: 0 },
        "Situational Dialogue": { total: 0, correct: 0 },
        "Reading & Signs": { total: 0, correct: 0 }
    };

    randomizedQuestions.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const cat = q.category;
        if (categoryStats[cat]) {
            categoryStats[cat].total += 1;
            if (userChoice === q.correct) {
                categoryStats[cat].correct += 1;
                totalScore += 1;
            }
        }
    });

    document.getElementById('score-display').innerText = `${totalScore} / ${randomizedQuestions.length} คะแนน (${Math.round((totalScore / randomizedQuestions.length) * 100)}%)`;

    const strengthList = document.getElementById('strength-list');
    const weaknessList = document.getElementById('weakness-list');
    strengthList.innerHTML = '';
    weaknessList.innerHTML = '';

    for (const [catName, stat] of Object.entries(categoryStats)) {
        const percentage = (stat.correct / stat.total) * 100;
        const li = document.createElement('li');
        li.style.marginBottom = '8px';

        if (percentage >= 70) {
            li.innerHTML = `<b>${catName}:</b> ทำได้ ${stat.correct}/${stat.total} ข้อ (${Math.round(percentage)}%) - มีทักษะและความแม่นยำในระดับยอดเยี่ยม`;
            strengthList.appendChild(li);
        } else {
            let advice = "";
            if (catName === "Grammar & Structure") {
                advice = "ควรเน้นทบทวน Subject-Verb Agreement, Present Simple vs Continuous, และ Past Simple (V.2 / didn't + V.1)";
            } else if (catName === "Quantifiers & Comparisons") {
                advice = "ควรฝึกแยกนามนับได้-นับไม่ได้, some/any, much/many, และกฎการเปลี่ยนรูปคุณศัพท์ขั้นกว่า-ขั้นสุด (better/worse/best)";
            } else if (catName === "Prepositions & Vocabulary") {
                advice = "ควรท่องจำ Preposition of Time (in/on/at), คำบอกตำแหน่ง (between/among), และหมวดคำศัพท์งานบ้าน/อาชีพ/สุขภาพ";
            } else if (catName === "Situational Dialogue") {
                advice = "ควรฝึกบทสนทนาในชีวิตประจำวัน เช่น การสั่งอาหาร, การถาม-บอกทาง, การขอโทษ, และสำนวน Would you mind";
            } else if (catName === "Reading & Signs") {
                advice = "ควรฝึกอ่านฉลากยา, ป้ายประกาศสาธารณะ, ตารางเรียน, และจับใจความสำคัญจากเนื้อเรื่องสั้นๆ";
            }

            li.innerHTML = `<b>${catName}:</b> ได้คะแนน ${stat.correct}/${stat.total} ข้อ (${Math.round(percentage)}%) - <i>คำแนะนำเพิ่มเติม:</i> ${advice}`;
            weaknessList.appendChild(li);
        }
    }

    if (strengthList.children.length === 0) {
        strengthList.innerHTML = "<li>ควรทบทวนบทเรียนและฝึกทำแบบฝึกหัดอย่างสม่ำเสมอเพื่อสร้างความมั่นใจก่อนสอบจริง</li>";
    }
    if (weaknessList.children.length === 0) {
        weaknessList.innerHTML = "<li>ยอดเยี่ยมมาก! คุณมีความรู้ความเข้าใจภาษาอังกฤษรอบด้านครบถ้วน พร้อมสำหรับการสอบปลายภาคระดับคะแนนสูงสุด</li>";
    }

    resultPanel.scrollIntoView({ behavior: 'smooth' });
}

// --- Professional Whiteboard Implementation ---
let wbCanvas, wbCtx;
let isDrawing = false;
let wbColor = '#000000';

function initWhiteboard() {
    wbCanvas = document.getElementById('wb-canvas');
    wbCtx = wbCanvas.getContext('2d');

    function resizeCanvas() {
        const rect = wbCanvas.getBoundingClientRect();
        wbCanvas.width = rect.width;
        wbCanvas.height = rect.height;
        wbCtx.lineCap = 'round';
        wbCtx.lineJoin = 'round';
        wbCtx.lineWidth = 2.5;
        wbCtx.strokeStyle = wbColor;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Mouse Events
    wbCanvas.addEventListener('mousedown', startDrawing);
    wbCanvas.addEventListener('mousemove', draw);
    wbCanvas.addEventListener('mouseup', stopDrawing);
    wbCanvas.addEventListener('mouseout', stopDrawing);

    // Touch Events for Mobile / Tablet
    wbCanvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = wbCanvas.getBoundingClientRect();
        isDrawing = true;
        wbCtx.beginPath();
        wbCtx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    });

    wbCanvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isDrawing) return;
        const touch = e.touches[0];
        const rect = wbCanvas.getBoundingClientRect();
        wbCtx.strokeStyle = wbColor;
        wbCtx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        wbCtx.stroke();
    });

    wbCanvas.addEventListener('touchend', stopDrawing);
}

function startDrawing(e) {
    isDrawing = true;
    wbCtx.beginPath();
    wbCtx.moveTo(e.offsetX, e.offsetY);
}

function draw(e) {
    if (!isDrawing) return;
    wbCtx.strokeStyle = wbColor;
    wbCtx.lineTo(e.offsetX, e.offsetY);
    wbCtx.stroke();
}

function stopDrawing() {
    if (isDrawing) {
        wbCtx.closePath();
        isDrawing = false;
    }
}

function setWbColor(color) {
    wbColor = color;
}

function clearWhiteboard() {
    if (wbCtx && wbCanvas) {
        wbCtx.clearRect(0, 0, 0, wbCanvas.width, wbCanvas.height);
    }
}

// Launch app
window.addEventListener('DOMContentLoaded', initQuiz);
