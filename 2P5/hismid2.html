<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฝึกหัดประวัติศาสตร์ ป.4 ปลายภาคเรียนที่ 1 (ชุดที่ 2 ระดับยาก)</title>

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 90px);
            box-sizing: border-box;
        }
        .left-frame {
            flex: 7;
            overflow-y: auto;
            padding: 20px;
            border-right: 2px solid #ddd;
        }
        .right-frame {
            flex: 3;
            display: flex;
            flex-direction: column;
            background: #fff;
            padding: 15px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
        }
        .question-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .question-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f1f2f6;
            border: 1px solid #dcdde1;
            padding: 12px 15px;
            text-align: left;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .option-btn:hover {
            background: #dfe4ea;
        }
        .option-btn.correct {
            background: var(--success-color) !important;
            color: white;
            border-color: var(--success-color);
        }
        .option-btn.incorrect {
            background: var(--accent-color) !important;
            color: white;
            border-color: var(--accent-color);
        }
        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #e8f4f8;
            border-left: 4px solid var(--secondary-color);
            display: none;
            font-size: 0.95rem;
        }
        .clue-box {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #e67e22;
            cursor: pointer;
            display: inline-block;
        }
        .clue-content {
            display: none;
            background: #fef9e7;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 0.85rem;
        }
        /* Whiteboard styling */
        #whiteboard {
            flex-grow: 1;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            background: #fff;
            cursor: crosshair;
            touch-action: none;
        }
        .wb-tools {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .wb-btn {
            padding: 8px 12px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .wb-btn:hover {
            opacity: 0.9;
        }
        .controls-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            background: white;
            padding: 30px;
            border-radius: 8px;

            max-width: 90%;

                height: auto;

</head>
<body>

<header>
    <h1>แบบทดสอบวิชาประวัติศาสตร์ ป.4 ปลายภาคเรียนที่ 1 (ระดับยาก - 35 ข้อ)</h1>
    <p>พระจอมเกล้าติวเตอร์</p>
</header>

<div class="container">
    <!-- ฝั่งซ้าย: ข้อสอบ (70%) -->
    <div class="left-frame">
        <div class="controls-bar">
            <button class="action-btn" onclick="resetExam()">เริ่มทำใหม่ / สลับข้อสอบ (Reset)</button>
            <button class="action-btn" onclick="submitExam()">ส่งข้อสอบและวิเคราะห์ผล</button>
        </div>
        
        <div id="exam-container">
            <!-- ข้อสอบจะถูก render ด้วย JavaScript -->
        </div>

        <div style="text-align: center; padding: 20px;">
            <button class="action-btn" onclick="submitExam()" style="font-size: 1.2rem; padding: 15px 30px;">ส่งข้อสอบทั้งหมด</button>
        </div>
    </div>

    <!-- ฝั่งขวา: Whiteboard (30%) -->
    <div class="right-frame">
        <h3>กระดานทดเลข / วาดภาพ</h3>
        <div class="wb-tools">
            <button class="wb-btn" onclick="setWbMode('draw')">ปากกา</button>
            <button class="wb-btn" onclick="setWbMode('erase')">ยางลบ</button>
            <button class="wb-btn" onclick="clearWb()" style="background: var(--accent-color);">ล้างกระดาน</button>
        </div>
        <canvas id="whiteboard"></canvas>
    </div>
</div>

<!-- Modal แสดงผลคะแนนและการวิเคราะห์ -->
<div id="result-modal">
    <div class="modal-content">

        <hr>
        <div id="analysis-content"></div>
        <br>
        <button class="action-btn" onclick="closeModal()">ปิดหน้าต่าง</button>
    </div>
</div>

let questions = [];

// ฟังก์ชัน Fisher-Yates Shuffle สำหรับสลับตำแหน่งตัวเลือกและคำถาม
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initExam() {
    // โคลนข้อมูลและสลับข้อสอบ
    questions = JSON.parse(JSON.stringify(rawQuestions));
    
    // สลับตัวเลือกในแต่ละข้อ พร้อมบันทึกตำแหน่งคำตอบที่ถูกต้องใหม่
    questions.forEach(q => {
        let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
        optionsWithIndex = shuffle(optionsWithIndex);
        q.options = optionsWithIndex.map(o => o.text);
        q.answer = optionsWithIndex.findIndex(o => o.originalIndex === q.answer);
    });

    renderExam();
}

function renderExam() {
    const container = document.getElementById('exam-container');
    let html = '';

    questions.forEach((q, index) => {
        html += `
            <div class="question-card" id="q-card-${index}">
                <div class="question-title">ข้อที่ ${index + 1}: ${q.question}</div>
                <div class="options-group" id="options-${index}">
        `;

        q.options.forEach((opt, optIndex) => {
            html += `<button class="option-btn" onclick="selectAnswer(${index}, ${optIndex})">${opt}</button>`;
        });

        html += `
                </div>
                <div class="clue-box" onclick="toggleClue(${index})">💡 เปิดดูคำใบ้</div>
                <div class="clue-content" id="clue-${index}">${q.clue}</div>
                <div class="explanation" id="exp-${index}"><strong>เฉลยและวิธีคิด:</strong> ${q.explanation}</div>
            </div>
        `;
    });

    container.innerHTML = html;
}

let userAnswers = {};

function selectAnswer(qIndex, optIndex) {
    userAnswers[qIndex] = optIndex;
    const optionsGroup = document.getElementById(`options-${qIndex}`);
    const buttons = optionsGroup.getElementsByClassName('option-btn');
    const correctAns = questions[qIndex].answer;
    
    for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === correctAns) {
            buttons[i].classList.add('correct');
        } else if (i === optIndex) {
            buttons[i].classList.add('incorrect');
        }
    }

    // แสดงคำอธิบายเฉลย
    document.getElementById(`exp-${qIndex}`).style.display = 'block';
    
    // บันทึกลง localStorage
    localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
}

function toggleClue(index) {
    const clueEl = document.getElementById(`clue-${index}`);
    clueEl.style.display = clueEl.style.display === 'block' ? 'none' : 'block';
}

function resetExam() {
    userAnswers = {};
    localStorage.removeItem('userAnswers');
    initExam();
}

function submitExam() {
    let score = 0;
    let total = questions.length;
    let weakAreas = [];

    questions.forEach((q, index) => {
        if (userAnswers[index] === q.answer) {
            score++;
        } else {
            weakAreas.push(`ข้อ ${index + 1}`);
        }
    });

    let percentage = ((score / total) * 100).toFixed(2);
    
    let summaryHtml = `<h3>คะแนนรวม: ${score} / ${total} คะแนน (${percentage}%)</h3>`;
    let analysisHtml = `<h4>การวิเคราะห์จุดเด่นและจุดที่ต้องพัฒนา:</h4>`;

    if (percentage >= 80) {
        analysisHtml += `<p>🌟 <strong>จุดเด่น:</strong> มีความเข้าใจในเนื้อหาประวัติศาสตร์ ป.4 เป็นอย่างดีเยี่ยม ทั้งการเทียบศักราช การจำแนกหลักฐาน และขั้นตอนวิธีการทางประวัติศาสตร์</p>`;
    } else if (percentage >= 50) {
        analysisHtml += `<p>👍 <strong>จุดเด่น:</strong> มีความเข้าใจในเนื้อหาพื้นฐานระดับปานกลาง สามารถวิเคราะห์โจทย์เบื้องต้นได้ดี</p>`;
        analysisHtml += `<p>⚠️ <strong>จุดที่ต้องพัฒนา:</strong> ควรทบทวนเพิ่มเติมในส่วนของหัวข้อที่ตอบผิดซ้ำๆ เช่น ${weakAreas.slice(0, 5).join(', ')} โดยเน้นการทบทวนเรื่องการเทียบศักราชและการประเมินคุณค่าหลักฐาน</p>`;
    } else {
        analysisHtml += `<p>⚠️ <strong>จุดที่ต้องพัฒนา:</strong> ยังมีข้อผิดพลาดค่อนข้างมาก แนะนำให้กลับไปทบทวนสรุปเนื้อหาด้านบนอย่างละเอียดอีกครั้ง โดยเฉพาะวิธีการทางประวัติศาสตร์และการแบ่งยุคสมัย</p>`;
    }

    document.getElementById('score-summary').innerHTML = summaryHtml;
    document.getElementById('analysis-content').innerHTML = analysisHtml;
    document.getElementById('result-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('result-modal').style.display = 'none';
}

// Whiteboard Logic
const canvas = document.getElementById('whiteboard');
const ctx = canvas.getContext('2d');
let painting = false;
let wbMode = 'draw';

function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 30;
    canvas.height = 300;
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', () => {
    resizeCanvas();
    initExam();
});

function setWbMode(mode) {
    wbMode = mode;
}

function clearWb() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

canvas.addEventListener('mousedown', startPosition);
canvas.addEventListener('mouseup', endPosition);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('touchstart', (e) => startPosition(e.touches[0]));
canvas.addEventListener('touchend', endPosition);
canvas.addEventListener('touchmove', (e) => draw(e.touches[0]));

function startPosition(e) {
    painting = true;
    draw(e);
}

function endPosition() {
    painting = false;
    ctx.beginPath();
}

function draw(e) {
    if (!painting) return;
    const rect = canvas.getBoundingClientRect();
    let x = (e.clientX || e.pageX) - rect.left;
    let y = (e.clientY || e.pageY) - rect.top;

    ctx.lineWidth = wbMode === 'erase' ? 20 : 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = wbMode === 'erase' ? '#ffffff' : '#2c3e50';

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
}
</script>
