<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พระจอมเกล้าติวเตอร์ - นิทานฝึกอ่านอนุบาลและประถมต้น</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-6">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">พระจอมเกล้าติวเตอร์ - สื่อการสอนภาษาไทย</span>
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mt-2">🌟 คลังนิทานฝึกอ่านแสนสนุก 5 เรื่อง</h1>
            <p class="text-slate-600 mt-1">ฝึกอ่านคำศัพท์ทีละคำให้คล่อง แล้วไปสนุกกับนิทานกันเลย!</p>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex flex-wrap justify-center gap-2 mb-6" id="story-tabs">
            <!-- แท็บจะถูกสร้างด้วย JavaScript -->
        </div>

        <!-- Main Container -->
        <main class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 p-6 md:p-8">
            <div id="app-content">
                <!-- เนื้อหาจะเปลี่ยนไปตาม Tab และโหมด (ฝึกคำศัพท์ / อ่านนิทาน) -->
            </div>
        </main>
    </div>

    <script>
        // ข้อมูลนิทาน 5 เรื่อง พร้อมคำศัพท์ฝึกอ่านแยกรายเรื่อง
        const storiesData = [
            {
                id: 1,
                title: "เรื่องที่ 1: น้องหมูใสกับต้นแอปเปิ้ลใจดี",
                icon: "apple",
                color: "rose",
                vocab: [
                    { word: "น้องหมูใส", hint: "ชื่อตัวละครเอกของเรื่อง เป็นหมูอารมณ์ดี" },
                    { word: "เดินเล่น", hint: "การก้าวเท้าเคลื่อนที่ไปเพื่อความเพลิดเพลิน" },
                    { word: "สวนผลไม้", hint: "พื้นที่ปลูกต้นไม้มีผลกินได้หลากหลายชนิด" },
                    { word: "ต้นแอปเปิ้ล", hint: "ต้นไม้ใหญ่ที่มีผลสีแดงน่ากิน" },
                    { word: "ใจดี", hint: "มีเมตตา ชอบช่วยเหลือผู้อื่น" },
                    { word: "แบ่งปัน", hint: "การให้สิ่งของหรือความสุขแก่ผู้อื่น" },
                    { word: "มีความสุข", hint: "ความรู้สึกอิ่มเอมใจ ยิ้มแย้มแจ่มใส" }
                ],
                storyText: [
                    "ณ สวนผลไม้แสนสวย มีหมูตัวน้อยชื่อ **น้องหมูใส** ชอบเดินเล่นยามเช้า",
                    "วันหนึ่ง น้องหมูใสเดินไปพบกับ **ต้นแอปเปิ้ลใจดี** ที่ออกผลสีแดงเต็มต้น",
                    "ต้นแอปเปิ้ลเห็นน้องหมูใสเดินมาด้วยความเหนื่อย จึงเอ่ยปากชวนว่า 'มากินผลไม้ของเราสิ'",
                    "น้องหมูใสดีใจมาก รีบเก็บผลไม้รสหวานฉ่ำมากินจนอิ่มท้อง",
                    "ก่อนกลับบ้าน น้องหมูใสกล่าวขอบคุณและสัญญาว่าจะนำเมล็ดไปปลูกต่อ",
                    "นิทานเรื่องนี้สอนให้รู้ว่า: **การเป็นผู้ให้และการแบ่งปัน ทำให้ทุกคนมีความสุข**"
                ]
            },
            {
                id: 2,
                title: "เรื่องที่ 2: เจ้าเป็ดน้อยกับสระน้ำมหัศจรรย์",
                icon: "feather",
                color: "amber",
                vocab: [
                    { word: "เป็ดน้อย", hint: "ลูกสัตว์ปีกตัวสีเหลือง ชอบว่ายน้ำ" },
                    { word: "สระน้ำ", hint: "แอ่งน้ำขนาดใหญ่สำหรับลงเล่น" },
                    { word: "ว่ายน้ำ", hint: "การเคลื่อนตัวอยู่ในน้ำโดยใช้ขาตีน้ำ" },
                    { word: "เพื่อนรัก", hint: "คนที่สนิทกันมาก รักใคร่กลมเกลียว" },
                    { word: "สนุกสนาน", hint: "อาการเพลิดเพลิน รื่นเริงบันเทิงใจ" },
                    { word: "ปลอดภัย", hint: "พ้นจากอันตรายและความกลัว" }
                ],
                storyText: [
                    "ริมหมู่บ้านมี **สระน้ำ** ใสสะอาด เป็นที่อาศัยของ **เป็ดน้อย** ขี้สงสัย",
                    "ทุก ๆ วัน เป็ดน้อยจะชวนเพื่อน ๆ มา **ว่ายน้ำ** เล่นกันอย่าง **สนุกสนาน**",
                    "วันหนึ่ง มีลูกกบตัวน้อยกระโดดหลงทางมาที่ริมสระน้ำ ร้องไห้เสียงดังเพราะกลัว",
                    "เป็ดน้อยเห็นเข้าจึงรีบว่ายเข้าไปปลอบโยนและพาเพื่อนกบกระโดดเล่นน้ำด้วยกัน",
                    "น้ำใส ๆ และเพื่อนพ้องทำให้ลูกกบหายกลัวและรู้สึก **ปลอดภัย**",
                    "นิทานเรื่องนี้สอนให้รู้ว่า: **การช่วยเหลือเพื่อนที่เดือดร้อนคือความสุขที่แท้จริง**"
                ]
            },
            {
                id: 3,
                title: "เรื่องที่ 3: กระต่ายน้อยกับแครอทวิเศษ",
                icon: "carrot",
                color: "orange",
                vocab: [
                    { word: "กระต่ายน้อย", hint: "สัตว์ตัวเล็กหูยาว ขนฟูสีขาว" },
                    { word: "หิวโซ", hint: "อาการหิวอาหารมาก ๆ จนไม่มีแรง" },
                    { word: "แปลงผัก", hint: "แปลงดินที่ปลูกพืชผักสวนครัว" },
                    { word: "แครอท", hint: "พืชหัวสีส้ม กรอบอร่อย" },
                    { word: "อัศจรรย์", hint: "แปลกประหลาด น่าทึ่งเหลือเชื่อ" },
                    { word: "ขยันขันแข็ง", hint: "ตั้งใจทำมาหากิน ไม่เกียจคร้าน" }
                ],
                storyText: [
                    "กลางป่าใหญ่ มี **กระต่ายน้อย** ผู้ **ขยันขันแข็ง** อาศัยอยู่กับคุณแม่",
                    "วันหนึ่ง กระต่ายน้อยเดินหาอาหารจนรู้สึก **หิวโซ** ไปทั่วผืนป่า",
                    "ทันใดนั้น เขาก็พบกับ **แปลงผัก** ลึกลับที่มี **แครอท** เปล่งแสงเรืองรอง",
                    "เมื่อกระต่ายน้อยลองดึงแครอทหัวนั้นขึ้นมา ปรากฏว่าเป็นแครอทวิเศษที่กินแล้วมีพลัง",
                    "กระต่ายน้อยไม่เก็บกินคนเดียว เขานำกลับมาแบ่งให้แม่และเพื่อน ๆ ในป่าได้กินด้วยกัน",
                    "นิทานเรื่องนี้สอนให้รู้ว่า: **ความขยันและการแบ่งปันนำพาโชคดีมาสู่ตน**"
                ]
            },
            {
                id: 4,
                title: "เรื่องที่ 4: ดวงดาวน้อยผู้กล้าหาญ",
                icon: "star",
                color: "indigo",
                vocab: [
                    { word: "ดวงดาว", hint: "วัตถุท้องฟ้าที่ส่องแสงระยิบระยับยามค่ำคืน" },
                    { word: "ท้องฟ้า", hint: "บรรยากาศกว้างใหญ่เหนือศีรษะเรา" },
                    { word: "ส่องแสง", hint: "การเปล่งประกายความสว่างออกมา" },
                    { word: "มืดมิด", hint: "สภาพที่ไม่มีแสงสว่างเลย มองไม่เห็นอะไร" },
                    { word: "กล้าหาญ", hint: "มีความพร้อมที่จะเผชิญหน้ากับความกลัว" },
                    { word: "ช่วยเหลือ", hint: "การทำประโยชน์หรือบรรเทาทุกข์ให้ผู้อื่น" }
                ],
                storyText: [
                    "บน **ท้องฟ้า** อันกว้างใหญ่ มี **ดวงดาว** ดวงเล็ก ๆ ดวงหนึ่งที่คิดว่าตัวเองไม่สำคัญ",
                    "คืนหนึ่ง เกิดพายุใหญ่ทำให้ดวงจันทร์และดาวดวงอื่น ๆ หลบหลังเมฆจน **มืดมิด**",
                    "สัตว์น้อยในป่าเดินหลงทางและร้องไห้ด้วยความกลัวความมืด",
                    "ดวงดาวน้อยรู้ว่าตนเองต้อง **กล้าหาญ** มันจึงรวบรวมพลัง **ส่องแสง** ประกายสว่างกล้า",
                    "แสงของดาวน้อยนำทางให้สัตว์ทุกตัวเดินทางกลับบ้านได้อย่างปลอดภัย",
                    "นิทานเรื่องนี้สอนให้รู้ว่า: **ทุกคนมีความสำคัญและมีแสงสว่างในตัวเอง**"
                ]
            },
            {
                id: 5,
                title: "เรื่องที่ 5: นกน้อยสร้างรัง",
                icon: "bird",
                color: "sky",
                vocab: [
                    { word: "นกน้อย", hint: "สัตว์มีปีกตัวเล็ก ขยันบินหาเศษกิ่งไม้" },
                    { word: "กิ่งไม้", hint: "ท่อนไม้ขนาดเล็กที่แตกแขนงจากต้นไม้" },
                    { word: "สร้างรัง", hint: "การถักทอกิ่งไม้ทำเป็นบ้านพักอาศัย" },
                    { word: "อดทน", hint: "ความสามารถในการรอคอยและสู้กับความยากลำบาก" },
                    { word: "สำเร็จ", hint: "ทำได้บรรลุตามเป้าหมายที่ตั้งไว้" },
                    { word: "อบอุ่น", hint: "ความรู้สึกสบายใจ ปลอดภัยจากความหนาว" }
                ],
                storyText: [
                    "เมื่อฤดูฝนใกล้เข้ามา **นกน้อย** จึงเริ่มต้น **สร้างรัง** เพื่อเป็นบ้านหลังใหม่",
                    "นกน้อยบินไปคาบ **กิ่งไม้** ใบหญ้าทีละชิ้นด้วยความ **อดทน** แม้จะเหนื่อยล้า",
                    "เพื่อนสัตว์ตัวอื่น ๆ แวะมาทักทายและช่วยหาวัสดุชิ้นเล็ก ๆ มาสมทบด้วย",
                    "ผ่านไปไม่กี่วัน บ้านหลังน้อยก็สร้างเสร็จสมบูรณ์อย่างงดงามและมั่นคง",
                    "นกน้อยได้นอนหลับพักผ่อนอย่าง **อบอุ่น** ในบ้านที่มาจากน้ำพักน้ำแรงของตน",
                    "นิทานเรื่องนี้สอนให้รู้ว่า: **ความพยายามและความอดทนนำมาซึ่งความสำเร็จ**"
                ]
            }
        ];

        let currentStoryIndex = 0;
        let currentMode = 'vocab'; // 'vocab' หรือ 'story'
        let currentVocabIndex = 0;

        // ฟังก์ชันสังเคราะห์เสียงภาษาไทย
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // หยุดเสียงเก่า
                const cleanText = text.replace(/[*_#]/g, ''); // ตัดสัญลักษณ์ Markdown ออก
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'th-TH';
                utterance.rate = 0.85; // พูดช้าลงเล็กน้อย เหมาะกับเด็กฝึกอ่าน
                window.speechSynthesis.speak(utterance);
            }
        }

        // เรนเดอร์ Tab ด้านบน
        function renderTabs() {
            const tabsContainer = document.getElementById('story-tabs');
            tabsContainer.innerHTML = '';
            storiesData.forEach((story, index) => {
                const isActive = index === currentStoryIndex;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2.5 rounded-2xl font-medium text-sm transition-all duration-200 flex items-center gap-2 ${
                    isActive 
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 scale-105' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`;
                btn.innerHTML = `<span>เรื่องที่ ${index + 1}</span>`;
                btn.onclick = () => {
                    currentStoryIndex = index;
                    currentMode = 'vocab';
                    currentVocabIndex = 0;
                    renderApp();
                };
                tabsContainer.appendChild(btn);
            });
        }

        // เรนเดอร์เนื้อหาหลักใน App
        function renderApp() {
            renderTabs();
            const container = document.getElementById('app-content');
            const story = storiesData[currentStoryIndex];

            if (currentMode === 'vocab') {
                // โหมดฝึกคำศัพท์หน้าละคำ
                const vocabItem = story.vocab[currentVocabIndex];
                const progressPercent = ((currentVocabIndex + 1) / story.vocab.length) * 100;

                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- หัวข้อและปุ่มสลับโหมด -->
                        <div class="flex flex-col md:flex-row justify-between items-center pb-4 border-b border-slate-100 gap-4">
                            <div>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">ขั้นตอนที่ 1: ฝึกอ่านคำศัพท์</span>
                                <h2 class="text-2xl font-bold text-slate-800 mt-1">${story.title}</h2>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="switchMode('story')" class="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-xl font-medium hover:bg-amber-200 transition">
                                    ข้ามไปอ่านนิทานเลย ➔
                                </button>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                            <div class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                        </div>
                        <p class="text-right text-xs text-slate-500 font-medium">คำที่ ${currentVocabIndex + 1} จาก ${story.vocab.length} คำ</p>

                        <!-- คำศัพท์หน้าละคำแบบเด่นชัด -->
                        <div class="bg-gradient-to-br from-indigo-50 to-blue-50 border-2 border-indigo-100 rounded-3xl p-8 md:p-12 text-center shadow-inner">
                            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-500 bg-white px-3 py-1 rounded-full shadow-sm">ฝึกสะกดทีละคำ</span>
                            <div class="my-6">
                                <h3 class="text-5xl md:text-7xl font-extrabold text-indigo-900 tracking-wide mb-4">${vocabItem.word}</h3>
                                <p class="text-slate-600 text-lg max-w-md mx-auto bg-white/80 py-2 px-4 rounded-xl shadow-sm">💡 ความหมาย: ${vocabItem.hint}</p>
                            </div>
                            <button onclick="speakText('${vocabItem.word}')" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg shadow-indigo-200 transition transform hover:scale-105">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                                ฟังเสียงอ่านคำนี้
                            </button>
                        </div>

                        <!-- ปุ่มควบคุมเปลี่ยนคำ -->
                        <div class="flex justify-between items-center pt-4">
                            <button onclick="prevVocab()" class="px-5 py-2.5 rounded-xl border border-slate-200 font-medium text-slate-600 hover:bg-slate-50 transition ${currentVocabIndex === 0 ? 'opacity-40 cursor-not-allowed' : ''}">
                                ← คำก่อนหน้า
                            </button>
                            
                            <button onclick="nextVocab()" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md shadow-indigo-100 transition">
                                ${currentVocabIndex === story.vocab.length - 1 ? '🎉 ฝึกครบแล้ว ไปอ่านนิทานกัน! ➔' : 'คำต่อไป →'}
                            </button>
                        </div>
                    </div>
                `;
            } else {
                // โหมดอ่านนิทานเต็มเรื่อง
                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- หัวข้อและปุ่มย้อนกลับไปหน้าฝึกคำศัพท์ -->
                        <div class="flex flex-col md:flex-row justify-between items-center pb-4 border-b border-slate-100 gap-4">
                            <div>
                                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">ขั้นตอนที่ 2: อ่านนิทานเต็มเรื่อง</span>
                                <h2 class="text-2xl font-bold text-slate-800 mt-1">${story.title}</h2>
                            </div>
                            <button onclick="switchMode('vocab')" class="text-sm bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-medium hover:bg-indigo-100 transition">
                                ↺ กลับไปทบทวนคำศัพท์
                            </button>
                        </div>

                        <!-- กล่องแสดงเนื้อหานิทาน -->
                        <div class="bg-emerald-50/50 border border-emerald-100 rounded-3xl p-6 md:p-8 space-y-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-semibold text-emerald-800">📖 อ่านออกเสียงทีละประโยค:</span>
                                <button onclick="speakFullStory()" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition">
                                    🔊 ฟังเสียงอ่านทั้งเรื่อง
                                </button>
                            </div>

                            <div class="space-y-3">
                                ${story.storyText.map((paragraph, pIdx) => `
                                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                        <p class="text-lg md:text-xl text-slate-700 leading-relaxed">${paragraph.replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-700 font-bold">$1</strong>')}</p>
                                        <button onclick="speakText('${paragraph.replace(/\*\*/g, '')}')" class="shrink-0 bg-slate-100 hover:bg-indigo-50 text-indigo-600 p-2.5 rounded-xl transition" title="ฟังประโยคนี้">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- ปุ่มเปลี่ยนเรื่อง -->
                        <div class="flex justify-between items-center pt-4">
                            <button onclick="prevStory()" class="px-5 py-2.5 rounded-xl border border-slate-200 font-medium text-slate-600 hover:bg-slate-50 transition ${currentStoryIndex === 0 ? 'opacity-40 cursor-not-allowed' : ''}">
                                ← เรื่องก่อนหน้า
                            </button>
                            
                            <button onclick="nextStory()" class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md shadow-emerald-100 transition">
                                ${currentStoryIndex === storiesData.length - 1 ? '🏆 จบนิทานทั้งหมดแล้วยอดเยี่ยมมาก!' : 'เรื่องถัดไป →'}
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // ฟังก์ชันควบคุมการเปลี่ยนคำศัพท์และโหมด
        function nextVocab() {
            const story = storiesData[currentStoryIndex];
            if (currentVocabIndex < story.vocab.length - 1) {
                currentVocabIndex++;
                renderApp();
            } else {
                // ฝึกคำศัพท์ครบแล้ว เปลี่ยนเข้าสู่หน้านิทานอัตโนมัติ
                currentMode = 'story';
                renderApp();
            }
        }

        function prevVocab() {
            if (currentVocabIndex > 0) {
                currentVocabIndex--;
                renderApp();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            renderApp();
        }

        function nextStory() {
            if (currentStoryIndex < storiesData.length - 1) {
                currentStoryIndex++;
                currentMode = 'vocab';
                currentVocabIndex = 0;
                renderApp();
            }
        }

        function prevStory() {
            if (currentStoryIndex > 0) {
                currentStoryIndex--;
                currentMode = 'vocab';
                currentVocabIndex = 0;
                renderApp();
            }
        }

        function speakFullStory() {
            const story = storiesData[currentStoryIndex];
            const fullText = story.storyText.map(t => t.replace(/\*\*/g, '')).join(' ');
            speakText(fullText);
        }

        // เริ่มต้นรันแอปครั้งแรก
        renderApp();
    </script>
</body>
</html>
