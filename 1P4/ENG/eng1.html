        let currentActiveSet = 1;

        function switchSet(setId) {
            currentActiveSet = setId;
            // Update active button styles
            document.querySelectorAll('.set-btn').forEach(btn => {
                btn.className = "set-btn px-4 py-2 rounded-lg font-medium transition bg-slate-200 text-slate-700 hover:bg-slate-300";
            });
            const activeBtn = document.getElementById(`btn-set-${setId}`);
            activeBtn.className = "set-btn px-4 py-2 rounded-lg font-medium transition bg-indigo-600 text-white shadow";
            
            document.getElementById('current-set-title').innerText = `Exam Set ${setId}`;
            document.getElementById('score-badge').classList.add('hidden');
            
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            const questions = examSets[currentActiveSet];

            questions.forEach((item, index) => {
                const qCard = document.createElement('div');
                qCard.className = "p-4 md:p-6 bg-slate-50 rounded-xl border border-slate-200 question-block";
                qCard.dataset.correct = item.answer;

                let optionsHtml = '';
                // Shuffle options for interactivity randomization if desired, or keep stable
                item.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="flex items-center space-x-3 p-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 cursor-pointer transition">
                            <input type="radio" name="q-${index}" value="${opt.replace(/"/g, '&quot;')}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                            <span class="text-slate-700 text-sm md:text-base">${opt}</span>
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <p class="font-semibold text-slate-800 mb-4 text-sm md:text-base">Q${index + 1}. ${item.q}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${optionsHtml}
                    </div>
                    <div class="feedback-container mt-3 text-sm font-medium hidden"></div>
                `;
                container.appendChild(qCard);
            });
        }

        function submitExam() {
            const questionBlocks = document.querySelectorAll('.question-block');
            let score = 0;

            questionBlocks.forEach((block, index) => {
                const correctAnswer = block.dataset.correct;
                const selectedInput = block.querySelector(`input[name="q-${index}"]:checked`);
                const feedbackDiv = block.querySelector('.feedback-container');
                feedbackDiv.classList.remove('hidden');

                // Remove previous styles on options labels
                block.querySelectorAll('label').forEach(lbl => {
                    lbl.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-500', 'bg-rose-50');
                });

                if (selectedInput) {
                    const userVal = selectedInput.value;
                    const selectedLabel = selectedInput.closest('label');
                    if (userVal === correctAnswer) {
                        score++;
                        selectedLabel.classList.add('border-emerald-500', 'bg-emerald-50');
                        feedbackDiv.innerHTML = `<span class="text-emerald-600 font-semibold">✓ Correct!</span>`;
                    } else {
                        selectedLabel.classList.add('border-rose-500', 'bg-rose-50');
                        feedbackDiv.innerHTML = `<span class="text-rose-600 font-semibold">✗ Incorrect. Correct answer: ${correctAnswer}</span>`;
                    }
                } else {
                    feedbackDiv.innerHTML = `<span class="text-amber-600 font-semibold">⚠ Not answered. Correct answer: ${correctAnswer}</span>`;
                }
            });

            document.getElementById('final-score').innerText = score;
            document.getElementById('score-badge').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetExam() {
            renderQuestions();
            document.getElementById('score-badge').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        window.onload = function() {
            renderQuestions();
        };
    </script>
