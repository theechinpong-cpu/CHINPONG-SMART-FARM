<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretest วิชาภาษาไทย ม.1 กลางภาค 2 - พระจอมเกล้าติวเตอร์</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }
        body {
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 20px auto;
            width: 95%;
            gap: 20px;
        }
        .quiz-panel {
            flex: 7;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            max-height: 80vh;
            overflow-y: auto;
        }
        .whiteboard-panel {
            flex: 3;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .question-card {
            margin-bottom: 25px;
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .question-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .option-btn:hover {
            background: #e2e8f0;
        }
        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }
        .explanation {
            margin-top: 10px;
            padding: 10px;
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            font-size: 13px;
            color: #1e40af;
            display: none;
        }
        .clue-box {
            margin-top: 5px;
            font-size: 12px;
            color: #64748b;
            cursor: pointer;
            text-decoration: underline;
        }
        #canvas-board {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            cursor: crosshair;
            flex: 1;
            margin-bottom: 10px;
        }
        .wb-controls {
            display: flex;
            gap: 10px;
        }
        .wb-btn {
            padding: 6px 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .wb-btn:hover { background: #cbd5e1; }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-main:hover { background: var(--primary-dark); }
        footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #64748b;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        @media(max-width: 768px) {
            .container { flex-direction: column; }
            .whiteboard-panel { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="hdr-title" style="margin:0; font-size: 22px;">ชุดข้อสอบ Pretest วิชาภาษาไทย ม.1 กลางภาค 2</h1>
        <p id="hdr-subtitle" style="margin:5px 0 0; font-size: 14px;">ระบบทดสอบวิเคราะห์และจำลองการเรียนรู้เสมือนจริง</p>
    </header>

    <div class="container">
        <!-- ฝั่งซ้าย: ข้อสอบ 30 ข้อ (70%) -->
        <div class="quiz-panel">
            <div class="controls-bar">
                <span id="score-display" style="font-weight: bold; color: var(--primary);">คะแนนที่ได้: 0 / 30</span>
                <div>
                    <button class="btn-main" onclick="toggleLanguage()">สลับภาษา (TH/EN)</button>
                    <button class="btn-main" onclick="resetQuiz()" style="background: #dc2626;">Reset ข้อสอบ</button>
                </div>
            </div>
            
            <div id="questions-container">
                <!-- คำถามจะถูกสร้างผ่าน JavaScript พร้อม Fisher-Yates Shuffle -->
            </div>
            <div id="results-summary" style="margin-top: 30px; padding: 20px; background: #f8fafc; border-radius: 8px; display: none;">
                <h3>รายงานการวิเคราะห์ผลการทดสอบรายบุคคล</h3>
                <p id="analysis-text"></p>
            </div>
        </div>

        <!-- ฝั่งขวา: Whiteboard สำหรับทดเลข/โน้ต (30%) -->
        <div class="whiteboard-panel">
            <h3 style="margin-top:0; font-size: 16px; color: #1e3a8a;">กระดานทดสอบ / Whiteboard</h3>
            <canvas id="canvas-board"></canvas>
            <div class="wb-controls">
                <button class="wb-btn" onclick="clearCanvas()">ล้างกระดาน</button>
                <button class="wb-btn" onclick="setPenColor('#2563eb')">สีน้ำเงิน</button>
                <button class="wb-btn" onclick="setPenColor('#dc2626')">สีแดง</button>
            </div>
        </div>
    </div>

    <footer>
        เขียนโดย พระจอมเกล้าติวเตอร์
    </footer>

    <script>
        // ข้อมูลชุดข้อสอบ 30 ข้อ (มาตรฐานตรงตามหลักสูตร ม.1 กลางภาค 2)
        const rawQuestions = [

                    "เพื่อให้สามารถสื่อสาร อ่าน เขียน และใช้ภาษาไทยได้อย่างถูกต้องเหมาะสมตามกาลเทศะ",
                    "เพื่อให้สามารถท่องจำคำศัพท์ภาษาบาลีสันสกฤตได้ครบทุกคำในพจนานุกรม",
                    "เพื่อนำไปใช้แต่งบทกลอนสุภาพส่งประกวดในระดับประเทศเท่านั้น",
                    "เพื่อหลีกเลี่ยงการใช้ภาษาถิ่นและภาษาพูดในชีวิตประจำวันทั้งหมด"
                ],
                correct: 0,
                clue: "คำใบ้: เป้าหมายหลักของการเรียนภาษาคือการสื่อสารให้ถูกต้อง",
                exp: "เฉลยข้อ 0: การเรียนหลักภาษาช่วยให้ผู้เรียนเข้าใจโครงสร้างและกฎเกณฑ์ ส่งผลให้การสื่อสารผ่านการฟัง พูด อ่าน เขียน มีประสิทธิภาพและถูกต้องตามกาลเทศะ"
            }
        ];

        let questions = JSON.parse(JSON.stringify(rawQuestions));
        let userAnswers = {};
        let currentLang = 'TH';

        // Fisher-Yates Shuffle Algorithm สำหรับสลับตัวเลือกและคำถาม
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initQuiz() {
            // สลับข้อสอบและตัวเลือกทุกครั้งที่โหลด/Reset
            shuffle(questions);
            questions.forEach(q => {
                // เก็บ index ข้อที่ถูกต้องเดิมไว้เปรียบเทียบ
                let originalCorrectText = q.options[q.correct];
                shuffle(q.options);
                q.correct = q.options.indexOf(originalCorrectText);
            });

            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                let card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHTML += `<button class="option-btn" id="btn-${index}-${optIndex}" onclick="checkAnswer(${index}, ${optIndex})">${String.fromCharCode(65 + curLang === 'TH' ? 65 + optIndex : 65 + optIndex)}. ${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="question-title">ข้อที่ ${index + 1}: ${q.q}</div>
                    <div class="options-group">${optionsHTML}</div>
                    <div class="clue-box" onclick="toggleClue(${index})">💡 ดูคำใบ้ / Clue</div>
                    <div class="explanation" id="exp-${index}">
                        <b>คำใบ้:</b> ${q.clue}<br><br>
                        <b>เฉลยและวิธีคิด:</b> ${q.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleClue(index) {
            let expBox = document.getElementById(`exp-${index}`);
            expBox.style.display = expBox.style.display === 'block' ? 'none' : 'block';
        }

        function checkAnswer(qIndex, optIndex) {
            let q = questions[qIndex];
            let buttons = document.querySelectorAll(`#q-card-${qIndex} .option-btn`);

            // ป้องกันการกดซ้ำข้อเดิม
            if (userAnswers[qIndex] !== undefined) return;

            userAnswers[qIndex] = optIndex;

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add('correct');
                } else if (idx === optIndex) {
                    btn.classList.add('incorrect');
                }
            });

            // แสดงคำอธิบายเฉลยทันที
            document.getElementById(`exp-${qIndex}`).style.display = 'block';

            updateScore();
        }

        function updateScore() {
            let score = 0;
            let totalAnswered = Object.keys(userAnswers).length;

            for (let qIdx in userAnswers) {
                if (userAnswers[qIdx] === questions[qIdx].correct) {
                    score++;
                }
            }

            document.getElementById('score-display').innerText = `คะแนนที่ได้: ${score} / 30 (${totalAnswered}/30 ข้อ)`;

            // บันทึกสถานะผ่าน localStorage ตามโจทย์กำหนด
            localStorage.setItem('thai_m1_score', score);
            localStorage.setItem('thai_m1_answered', totalAnswered);

            if (totalAnswered === 30) {
                showAnalysis(score);
            }
        }

        function showAnalysis(score) {
            let summaryBox = document.getElementById('results-summary');
            let analysisText = document.getElementById('analysis-text');
            summaryBox.style.display = 'block';

            let percentage = (score / 30) * 100;
            let feedback = "";

            if (percentage >= 80) {
                feedback = `ยอดเยี่ยมมาก! คุณได้คะแนน ${score} ข้อ (${percentage.toFixed(1)}%) แสดงว่ามีความเข้าใจเรื่องเสียงในภาษาไทย, การสร้างคำ, และชนิดของคำในประโยคเป็นอย่างดีเยี่ยม พร้อมลุยสนามสอบจริงแล้วครับ`;
            } else if (percentage >= 50) {
                feedback = `ทำได้ดีครับ ได้คะแนน ${score} ข้อ (${percentage.toFixed(1)}%) จุดที่ควรพัฒนาเพิ่มเติมคือ กฎเกณฑ์การผันวรรณยุกต์อักษร 3 หมู่ และการจำแนกคำประสมกับคำซ้อน ทบทวนเนื้อหาส่วนสรุปด้านบนอีกรอบจะช่วยให้เกรดพุ่งขึ้นแน่นอน`;
            } else {
                feedback = `ได้คะแนน ${score} ข้อ (${percentage.toFixed(1)}%) แนะนำให้กลับมาทบทวนในส่วนของธรรมชาติของเสียงในภาษาไทย และหลักการแต่งโคลงสี่สุภาพเพิ่มเติม เนื่องจากยังมีจุดที่ยังสับสนอยู่ครับ`;
            }

            analysisText.innerText = feedback;
        }

        function resetQuiz() {
            userAnswers = {};
            localStorage.removeItem('thai_m1_score');
            localStorage.removeItem('thai_m1_answered');
            document.getElementById('results-summary').style.display = 'none';
            initQuiz();
            document.getElementById('score-display').innerText = `คะแนนที่ได้: 0 / 30`;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'TH' ? 'EN' : 'TH';
            if (currentLang === 'EN') {
                document.getElementById('hdr-title').innerText = 'Grade 7 Thai Language Pretest - Midterm 2';
                document.getElementById('hdr-subtitle').innerText = 'Interactive Virtual Teaching & Analytical Engine';
            } else {
                document.getElementById('hdr-title').innerText = 'ชุดข้อสอบ Pretest วิชาภาษาไทย ม.1 กลางภาค 2';
                document.getElementById('hdr-subtitle').innerText = 'ระบบทดสอบวิเคราะห์และจำลองการเรียนรู้เสมือนจริง';
            }
        }

        // Setup Whiteboard Canvas (ฝั่งขวา 30%)
        const canvas = document.getElementById('canvas-board');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let penColor = '#2563eb';

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 320;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', (e) => { startPosition(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = penColor;

            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function setPenColor(color) {
            penColor = color;
        }

        // เริ่มต้นรันระบบข้อสอบ
        initQuiz();
    </script>
</body>
</html>
