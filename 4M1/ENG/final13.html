    },

    }
];

let questions = [];

// Fisher-Yates Shuffle Algorithm
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function initQuiz() {
    // Deep clone and shuffle options for each question
    questions = rawQuestions.map(q => {
        let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
        shuffleArray(optionsWithIndex);
        let newAnswerIndex = optionsWithIndex.findIndex(item => item.originalIndex === q.answer);
        return {
            id: q.id,
            question: q.question,
            options: optionsWithIndex.map(item => item.text),
            answer: newAnswerIndex,
            clue: q.clue,
            explanation: q.explanation
        };
    });

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((q, index) => {
        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
            optionsHtml += `<li class="option-item" onclick="selectOption(${index}, ${optIdx})">${String.fromCharCode(65 + curLetterOffset(optIdx))}. ${opt}</li>`;
        });

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;
        card.innerHTML = `
            <div class="question-title">ข้อที่ ${index + 1}: ${q.question}</div>
            <ul class="options-list" id="options-${index}">${optionsHtml}</ul>
            <button class="clue-btn" onclick="toggleClue(${index})">🔍 ดูคำใบ้ (Clue)</button>
            <div class="clue-box" id="clue-${index}">${q.clue}</div>
            <div class="explanation" id="exp-${index}"><strong>เฉลยและวิธีคิด:</strong> ${q.explanation}</div>
        `;
        container.appendChild(card);
    });
}

function curLetterOffset(idx) {
    return idx;
}

let userAnswers = {};

function selectOption(qIdx, optIdx) {
    const card = document.getElementById(`options-${qIdx}`);
    const items = card.getElementsByClassName('option-item');
    
    userAnswers[qIdx] = optIdx;

    for (let i = 0; i < items.length; i++) {
        items[i].classList.remove('correct', 'incorrect');
    }

    const correctIndex = questions[qIdx].answer;
    if (optIdx === correctIndex) {
        items[optIdx].classList.add('correct');
    } else {
        items[optIdx].classList.add('incorrect');
        items[correctIndex].classList.add('correct');
    }

    document.getElementById(`exp-${qIdx}`).style.display = 'block';
    localStorage.setItem('user_answers', JSON.stringify(userAnswers));
}

function toggleClue(qIdx) {
    const clueBox = document.getElementById(`clue-${qIdx}`);
    clueBox.style.display = clueBox.style.display === 'block' ? 'none' : 'block';
}

function submitExam() {
    let score = 0;
    let total = questions.length;
    let unanswered = 0;

    questions.forEach((q, index) => {
        if (userAnswers[index] === undefined) {
            unanswered++;
        } else if (userAnswers[index] === q.answer) {
            score++;
        }
        // Force show explanations for all
        document.getElementById(`exp-${index}`).style.display = 'block';
    });

    const percent = ((score / total) * 100).toFixed(2);
    const resultContainer = document.getElementById('result-container');
    const scoreSummary = document.getElementById('score-summary');
    const analysisBox = document.getElementById('analysis-box');

    scoreSummary.innerHTML = `คุณทำคะแนนได้ <strong>${score} / ${total}</strong> คะแนน (${percent}%)<br>ข้อที่ยังไม่ได้ตอบ: ${unanswered} ข้อ`;

    let strength = "มีความเข้าใจในโครงสร้างไวยากรณ์พื้นฐาน เช่น Present Simple Tense และคำสรรพนาม (Pronouns) เป็นอย่างดี";
    let weakness = "ควรทบทวนเพิ่มเติมในส่วนของกฎการใช้คำบุพบทบอกเวลา (Prepositions) และการเลือกใช้คำถาม (Wh- Questions) ให้แม่นยำยิ่งขึ้น";

    if (percent >= 80) {
        strength = "มีความเชี่ยวชาญยอดเยี่ยมทั้งด้านคำศัพท์ ไวยากรณ์ และทักษะการสื่อสารเบื้องต้น";
        weakness = "รักษาระดับการฝึกฝนและทบทวนรูปแบบประโยคที่ซับซ้อนเพิ่มเติม";
    }

    analysisBox.innerHTML = `
        <div style="margin-top: 15px; padding: 15px; background: #e8f8f5; border-left: 5px solid #27ae60; border-radius: 4px;">
            <h4>📊 การวิเคราะห์ผลสัมฤทธิ์รายบุคคล</h4>
            <p><strong>จุดเด่น (Strengths):</strong> ${strength}</p>
            <p><strong>จุดที่ต้องพัฒนา (Areas for Improvement):</strong> ${weakness}</p>
        </div>
    `;

    resultContainer.style.display = 'block';
    resultContainer.scrollIntoView({ behavior: 'smooth' });
}

function resetExam() {
    localStorage.removeItem('user_answers');
    userAnswers = {};
    document.getElementById('result-container').style.display = 'none';
    initQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Whiteboard Implementation
const canvas = document.getElementById('wb-canvas');
const ctx = canvas.getContext('2d');
let painting = false;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', () => {
    resizeCanvas();
    initQuiz();
    let saved = localStorage.getItem('user_answers');
    if(saved) {
        // Restore logic if needed
    }
});

canvas.addEventListener('mousedown', startPosition);
canvas.addEventListener('mouseup', endPosition);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('touchstart', handleTouch);
canvas.addEventListener('touchend', endPosition);
canvas.addEventListener('touchmove', handleTouchMove);

function startPosition(e) {
    painting = true;
    draw(e);
}

function endPosition() {
    painting = false;
    ctx.beginPath();
}

function draw(e) {
    if (!painting) return;
    ctx.lineWidth = document.getElementById('wb-size').value;
    ctx.lineCap = 'round';
    ctx.strokeStyle = document.getElementById('wb-color').value;

    const rect = canvas.getBoundingClientRect();
    let x = (e.clientX || e.touches[0].clientX) - rect.left;
    let y = (e.clientY || e.touches[0].clientY) - rect.top;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
}

function handleTouch(e) {
    e.preventDefault();
    startPosition(e);
}

function handleTouchMove(e) {
    e.preventDefault();
    draw(e);
}

function clearWhiteboard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
