<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทดสอบความรู้ภาษาอังกฤษ ม.1 เทอม 2 - พระจอมเกล้าติวเตอร์</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        header { background: var(--primary); color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .main-layout { display: grid; grid-template-columns: 7fr 3fr; gap: 20px; }
        @media(max-width: 1024px) { .main-layout { grid-template-columns: 1fr; } }
        .exam-panel, .whiteboard-panel { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question-box { margin-bottom: 25px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; background: #fff; transition: all 0.3s; }
        .question-box.answered { border-color: var(--primary); background: #f0fdf4; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option-btn { padding: 12px 15px; border: 1px solid var(--border); border-radius: 6px; background: #fff; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .option-btn:hover { background: #f1f5f9; border-color: var(--primary); }
        .option-btn.correct { background: #d1fae5; border-color: var(--success); color: #065f46; font-weight: bold; }
        .option-btn.incorrect { background: #fee2e2; border-color: var(--error); color: #991b1b; }
        .explanation { margin-top: 10px; padding: 12px; background: #eff6ff; border-left: 4px solid var(--primary); border-radius: 4px; display: none; font-size: 0.95rem; }
        .clue-box { margin-top: 8px; font-size: 0.85rem; color: #64748b; cursor: pointer; font-style: italic; }
        /* Whiteboard */
        #whiteboard { width: 100%; height: 450px; border: 2px dashed var(--border); border-radius: 8px; cursor: crosshair; background: #fff; touch-action: none; }
        .wb-tools { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }
        /* Navigation & Footer */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        #results-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; text-align: center; }
        .footer-credit { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b; }

</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>แบบทดสอบภาษาอังกฤษ ม.1 เทอม 2</h1>

        </div>
        <div>

        </div>
    </header>

        <div class="exam-panel">
            <div id="questions-container"></div>
        </div>

        <div class="whiteboard-panel">

            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">ใช้สำหรับทดคำตอบหรือจดบันทึกความคิดระหว่างทำข้อสอบ</p>
            <div class="wb-tools">
                <button class="btn" style="background: #1e293b;" onclick="setPenColor('#1e293b')">ดำ</button>
                <button class="btn" style="background: var(--primary);" onclick="setPenColor('#4f46e5')">น้ำเงิน</button>
                <button class="btn" style="background: var(--error);" onclick="setPenColor('#ef4444')">แดง</button>
                <button class="btn btn-secondary" onclick="clearCanvas()">ล้างกระดาน</button>
            </div>
            <canvas id="whiteboard"></canvas>
        </div>
    </div>
    
    <div class="footer-credit">เขียนโดย พระจอมเกล้าติวเตอร์</div>
</div>

<!-- Modal แสดงผลวิเคราะห์ -->

        },

        },
        {

            q: "What is the best closing greeting for a formal email?",
            options: [
                { text: "A. Sincerely yours", correct: true },
                { text: "B. See ya later", correct: false },
                { text: "C. Catch you later", correct: false },
                { text: "D. Bye bye", correct: false }
            ],
            clue: "Clue: Professional and formal signing off.",
            explanation: "'Sincerely yours' หรือ 'Yours sincerely' เป็นคำลงท้ายอีเมลหรือจดหมายที่เป็นทางการ"
        }
    ];

    let userAnswers = {};

    // Fisher-Yates Shuffle Algorithm สำหรับสลับตำแหน่งตัวเลือก
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderExam() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        rawQuestions.forEach((qItem, index) => {
            // สลับตำแหน่งตัวเลือกเพื่อป้องกันการเดาตำแหน่ง
            let shuffledOptions = [...qItem.options];
            shuffleArray(shuffledOptions);

            let html = `
                <div class="question-box" id="q-box-${qItem.id}">
                    <h3>ข้อที่ ${index + 1}: ${qItem.q}</h3>
                    <div class="options">
            `;

            shuffledOptions.forEach((opt, oIndex) => {
                html += `
                    <button class="option-btn" id="q-${qItem.id}-opt-${oIndex}" 
                        onclick="selectAnswer(${qItem.id}, ${opt.correct}, ${oIndex}, this)">
                        ${opt.text}
                    </button>
                `;
            });

            html += `
                    </div>
                    <div class="clue-box" onclick="toggleClue(${qItem.id})">💡 แสดง/ซ่อน คำใบ้ (Clue)</div>
                    <div class="explanation" id="clue-${qItem.id}">${qItem.clue}</div>
                    <div class="explanation" id="exp-${qItem.id}"><strong>เฉลยและวิธีคิด:</strong> ${qItem.explanation}</div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function selectAnswer(qid, isCorrect, optIndex, btnElement) {
        // บันทึกคำตอบ
        userAnswers[qid] = isCorrect;
        document.getElementById(`q-box-${qid}`).classList.add('answered');

        // ปิดการคลิกปุ่มทั้งหมดในข้อนั้น
        const parent = btnElement.parentElement;
        const buttons = parent.getElementsByClassName('option-btn');
        for (let b of buttons) {
            b.disabled = true;
            if (b.innerText.startsWith('A.') && findCorrectStatus(qid, 'A')) {
                // Highlight ตัวถูก
            }
        }

        // แสดงสีถูกต้อง/ผิด
        if (isCorrect) {
            btnElement.classList.add('correct');
        } else {
            btnElement.classList.add('incorrect');
            // หาข้อที่ถูกมาโชว์ด้วย
            for (let b of buttons) {
                if (b.getAttribute('onclick').includes('true')) {
                    b.classList.add('correct');
                }
            }
        }

        // แสดงคำอธิบายเฉลย
        document.getElementById(`exp-${qid}`).style.display = 'block';
    }

    function findCorrectStatus(qid, textPrefix) {
        return true;
    }

    function toggleClue(qid) {
        const clueEl = document.getElementById(`clue-${qid}`);
        clueEl.style.display = clueEl.style.display === 'block' ? 'none' : 'block';
    }

    function submitExam() {
        let score = 0;
        let total = rawQuestions.length;
        for (let qid in userAnswers) {
            if (userAnswers[qid]) score++;
        }

        let percentage = ((score / total) * 100).toFixed(2);
        
        document.getElementById('score-display').innerText = `คะแนนที่ได้: ${score} / ${total} (${percentage}%)`;
        
        let analysis = `<ul>`;
        if (percentage >= 80) {
            analysis += `<li><strong>จุดเด่น:</strong> มีความเข้าใจในคำศัพท์ระดับ ป.6-ม.1 และหลักไวยากรณ์ (Tenses & Comparison) ได้เป็นอย่างดีเยี่ยม</li>`;
            analysis += `<li><strong>คำแนะนำ:</strong> สามารถต่อยอดไปสู่โครงสร้างประโยคที่ซับซ้อนขึ้นในระดับ ม.2 ได้ทันที</li>`;
        } else if (percentage >= 50) {
            analysis += `<li><strong>จุดเด่น:</strong> ผ่านเกณฑ์ความเข้าใจพื้นฐานคำศัพท์ทั่วไป</li>`;
            analysis += `<li><strong>จุดที่ต้องพัฒนา:</strong> ควรทบทวนเรื่องการใช้ Past Tenses และ Prepositions เพิ่มเติม เนื่องจากยังมีจุดที่สับสน</li>`;
        } else {
            analysis += `<li><strong>จุดที่ต้องพัฒนา:</strong> แนะนำให้กลับไปทบทวนคำศัพท์พื้นฐาน Parts of Speech และโครงสร้างประโยคขั้นต้นอีกครั้งเพื่อความแม่นยำ</li>`;
        }
        analysis += `</ul>`;

        document.getElementById('analysis-text').innerHTML = analysis;
        document.getElementById('results-modal').style.display = 'flex';

        if (percentage >= 50) {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }
    }

    function closeModal() {
        document.getElementById('results-modal').style.display = 'none';
    }

    function resetExam() {
        userAnswers = {};
        renderExam();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Whiteboard Scripting
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 50;
        canvas.height = 400;
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startPosition(e) { painting = true; draw(e); }
    function endPosition() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if (!painting) return;
        let rect = canvas.getBoundingClientRect();
        let x = (e.clientX || e.touches[0].clientX) - rect.left;
        let y = (e.clientY || e.touches[0].clientY) - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', endPosition);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', endPosition);
    canvas.addEventListener('touchmove', draw);

    function setPenColor(color) { ctx.strokeStyle = color; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // โหลดข้อสอบครั้งแรกเมื่อเปิดหน้าเว็บ
    window.onload = function() {
        renderExam();
    };
</script>
