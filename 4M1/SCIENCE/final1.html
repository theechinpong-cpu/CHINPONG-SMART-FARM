    let userAnswers = {}; // { qId: selectedOptionIndex }
    let score = 0;
    let answeredCount = 0;
    let currentFilter = 'all';

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      const filteredQuestions = currentFilter === 'all' 
        ? questionsData 
        : questionsData.filter(q => q.cat === currentFilter);

      filteredQuestions.forEach((q) => {
        const isAnswered = userAnswers[q.id] !== undefined;
        const selectedIndex = userAnswers[q.id];

        const card = document.createElement('div');
        card.className = "bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-md transition";
        card.id = `q-card-${q.id}`;

        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
          let optClasses = "w-full text-left p-4 rounded-xl border text-sm md:text-base font-normal transition duration-150 flex items-start gap-3 ";
          
          if (!isAnswered) {
            optClasses += "bg-slate-700/50 hover:bg-slate-700 border-slate-600/60 text-slate-200 cursor-pointer active:scale-[0.99]";
          } else {
            optClasses += "cursor-not-allowed ";
            if (idx === q.correct) {
              optClasses += "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-semibold";
            } else if (idx === selectedIndex) {
              optClasses += "bg-rose-950/80 border-rose-500 text-rose-200";
            } else {
              optClasses += "bg-slate-800/40 border-slate-700/40 text-slate-500 opacity-60";
            }
          }

          const label = String.fromCharCode(65 + idx); // A, B, C, D
          optionsHtml += `
            <button 
              type="button" 
              class="${optClasses}" 
              onclick="handleSelectOption(${q.id}, ${idx})"
              ${isAnswered ? 'disabled' : ''}
            >
              <span class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-slate-900/60 border border-slate-600/50 text-xs shrink-0 mt-0.5">
                ${label}
              </span>
              <span class="flex-1">${opt}</span>
            </button>
          `;
        });

        let explanationHtml = '';
        if (isAnswered) {
          const isCorrect = selectedIndex === q.correct;
          explanationHtml = `
            <div class="mt-5 p-4 rounded-xl border ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/40' : 'bg-rose-950/40 border-rose-500/40'} text-sm leading-relaxed animate-fadeIn">
              <div class="flex items-center gap-2 font-bold mb-2 ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                <span>${isCorrect ? '✓ ตอบถูกต้อง' : '✗ ตอบผิด'}</span>
              </div>
              <div class="text-slate-300">
                ${q.explanation}
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-3">
            <span class="px-2.5 py-0.5 rounded-md bg-blue-900/50 text-blue-300 border border-blue-700/50 text-xs font-semibold">
              ข้อที่ ${q.id}
            </span>
            <span class="text-xs text-slate-400 font-medium">${q.topic}</span>
          </div>
          <h2 class="text-base md:text-lg font-medium text-slate-100 mb-4 leading-relaxed">
            ${q.q}
          </h2>
          <div class="space-y-2.5">
            ${optionsHtml}
          </div>
          ${explanationHtml}
        `;

        container.appendChild(card);
      });

      // Typeset LaTeX math formulas
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function handleSelectOption(questionId, optionIndex) {
      if (userAnswers[questionId] !== undefined) return; // Prevent changing answer

      const q = questionsData.find(item => item.id === questionId);
      userAnswers[questionId] = optionIndex;
      answeredCount++;

      if (optionIndex === q.correct) {
        score++;
      }

      document.getElementById('score-display').textContent = `${score} / ${answeredCount}`;
      document.getElementById('progress-display').textContent = `${answeredCount} / ${questionsData.length}`;

      renderQuiz();
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "category-btn active px-3 py-1 bg-blue-600 rounded-lg text-white font-medium transition";
        } else {
          btn.className = "category-btn px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 font-medium transition";
        }
      });
      renderQuiz();
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });
  </script>
