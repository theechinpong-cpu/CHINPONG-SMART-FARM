<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พระจอมเกล้าติวเตอร์ - การแพร่และการออสโมซิส (ชุดที่ 4)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0fdf4; }
        .correct-ans { background-color: #bbf7d0 !important; border-color: #16a34a !important; }
        .wrong-ans { background-color: #fecaca !important; border-color: #dc2626 !important; }
    </style>
</head>
<body class="p-4">
    <header class="max-w-6xl mx-auto mb-6 text-center">
        <h1 class="text-3xl font-bold text-green-800">ชุดติวเข้มวิทยาศาสตร์ ม.1: การแพร่และการออสโมซิส (ชุดที่ 4)</h1>
        <p class="text-green-700">ระดับความยาก: ยากมาก (เน้นการวิเคราะห์สถานการณ์และการทดลอง)</p>
    </header>

    <main class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg border p-6">
        <div class="flex flex-col md:flex-row gap-6">
            <div class="flex-1">
                <div class="mb-4">ข้อที่ <span id="q-num">1</span>/30</div>
                <div id="question" class="text-xl font-bold mb-4"></div>
                <div id="options" class="space-y-3"></div>
                <div id="feedback" class="mt-4 p-4 rounded bg-gray-50 border hidden"></div>
                <div class="mt-6 flex justify-between">
                    <button onclick="nav(-1)" class="px-6 py-2 bg-gray-200 rounded">ก่อนหน้า</button>
                    <button onclick="nav(1)" class="px-6 py-2 bg-green-600 text-white rounded">ถัดไป</button>
                </div>
            </div>
            <div class="w-full md:w-80 border-l pl-4">
                <h3 class="font-bold mb-2">กระดานทด</h3>
                <canvas id="wb" class="w-full h-96 border rounded bg-gray-50"></canvas>
            </div>
        </div>
    </main>

    <script>
        const QUESTIONS = [
            { q: "การแพร่แบบใดที่จัดเป็น Passive transport?", options: ["การเคลื่อนที่ของอนุภาคสารจากความเข้มข้นสูงไปต่ำโดยไม่ใช้ ATP", "การเคลื่อนที่ที่ต้องใช้โปรตีนขนส่งร่วมกับ ATP", "การเคลื่อนที่ผ่านเยื่อหุ้มเซลล์แบบย้อนความเข้มข้น", "การเคลื่อนที่โดยใช้ถุงเวสิเคิล"], ans: 0, exp: "Passive transport ไม่ใช้พลังงาน ATP" },
            { q: "เมื่อหยดสีผสมอาหารลงในแก้วน้ำแล้วปล่อยทิ้งไว้จนน้ำเป็นสีเดียวกันทั้งแก้ว สภาวะนี้เรียกว่าอะไร?", options: ["สมดุลของการแพร่", "การออสโมซิส", "การแพร่แบบเร่ง", "สถานะหยุดนิ่ง"], ans: 0, exp: "อนุภาคยังคงเคลื่อนที่อยู่ตลอดเวลาแต่ความเข้มข้นเท่ากันทุกจุด" },
            { q: "ปัจจัยใดไม่ส่งผลต่ออัตราการแพร่ของสาร?", options: ["จำนวนของไมโทคอนเดรียในเซลล์ข้างเคียง", "อุณหภูมิ", "ขนาดของอนุภาค", "ความแตกต่างของความเข้มข้น"], ans: 0, exp: "ไมโทคอนเดรียเกี่ยวข้องกับพลังงาน ไม่ใช่การแพร่แบบ Passive" },
            { q: "เซลล์เม็ดเลือดแดงเมื่ออยู่ในน้ำกลั่นจะแตก เพราะสารละลายนั้นเป็นแบบใด?", options: ["Hypotonic solution", "Hypertonic solution", "Isotonic solution", "Saturated solution"], ans: 0, exp: "น้ำกลั่นเข้มข้นน้อยกว่าภายในเซลล์ น้ำจึงเข้าเซลล์จนแตก" },
            { q: "การทำเค็ม (การแช่อาหารในน้ำเกลือเข้มข้นสูง) ช่วยถนอมอาหารได้เพราะ?", options: ["เซลล์แบคทีเรียเสียน้ำเนื่องจาก Hypertonic solution", "เกลือช่วยสร้างโปรตีนป้องกันเน่า", "เกลือทำให้เซลล์แบคทีเรียแตก", "เกลือยับยั้งการหายใจระดับเซลล์"], ans: 0, exp: "แบคทีเรียสูญเสียน้ำจนไม่สามารถทำกิจกรรมปกติได้" },
            { q: "ข้อใดคือความแตกต่างสำคัญที่สุดระหว่างการแพร่และการออสโมซิส?", options: ["ออสโมซิสต้องผ่านเยื่อเลือกผ่านและเน้นน้ำ", "การแพร่ต้องใช้พลังงาน", "ออสโมซิสเน้นที่อนุภาคของสารละลาย", "การแพร่มีเฉพาะในสิ่งมีชีวิต"], ans: 0, exp: "ออสโมซิสจำกัดอยู่แค่ตัวทำละลายคือน้ำที่ผ่านเยื่อเลือกผ่านเท่านั้น" },
            { q: "การที่ต้นไม้เหี่ยวลงเมื่อใส่ปุ๋ยเคมีมากเกินไป จัดเป็นปรากฏการณ์ใด?", options: ["Plasmolysis (เซลล์เหี่ยวจาก Hypertonic)", "Turgor pressure เพิ่มขึ้น", "Active transport", "Diffusion"], ans: 0, exp: "ดินเข้มข้นกว่าภายในเซลล์ น้ำจึงออกจากเซลล์ทำให้เหี่ยว" },
            { q: "หากเซลล์พืชอยู่ในสารละลาย Isotonic จะเกิดสภาวะใด?", options: ["เซลล์มีสภาพปกติ ไม่มีแรงดันเต่งเพิ่มขึ้น", "เซลล์เหี่ยวทันที", "เซลล์จะเต่งจนผนังเซลล์ขยาย", "เซลล์พืชจะตาย"], ans: 0, exp: "น้ำเข้าและออกเท่ากัน แรงดันเต่งไม่เปลี่ยนแปลงมาก" },
            { q: "ถ้าเปรียบเทียบกลิ่นน้ำหอมในห้อง อัตราการแพร่ของน้ำหอมจะเร็วขึ้นเมื่อใด?", options: ["อุณหภูมิห้องสูงขึ้น", "ความดันอากาศในห้องต่ำลง", "มีความเข้มข้นน้ำหอมน้อยลง", "ขนาดโมเลกุลน้ำหอมใหญ่ขึ้น"], ans: 0, exp: "อุณหภูมิสูงทำให้อนุภาคพลังงานจลน์สูงขึ้น แพร่ได้เร็ว" },
            { q: "ในแง่ของกระบวนการทางชีวภาพ การออสโมซิสมีความสำคัญสูงสุดต่อข้อใด?", options: ["การรักษาสมดุลน้ำในเซลล์", "การสร้างเอนไซม์", "การขนส่งโปรตีน", "การจัดระเบียบดีเอ็นเอ"], ans: 0, exp: "การรักษาสมดุลน้ำเป็นหัวใจของสภาวะธำรงดุล" },
            { q: "การแพร่ของก๊าซออกซิเจนเข้าสู่เซลล์เป็นไปตามกฎใด?", options: ["จากความเข้มข้นสูงเข้าสู่เซลล์ที่มีความเข้มข้นต่ำ", "จากความเข้มข้นต่ำไปสูง", "ผ่านโปรตีนขนส่งที่ต้องใช้ ATP", "ต้องอาศัยแสงแดด"], ans: 0, exp: "ก๊าซออกซิเจนแพร่ผ่านเยื่อหุ้มเซลล์ได้โดยตรง" },
            { q: "สารละลาย Hypertonic คืออะไร?", options: ["สารละลายที่เข้มข้นมากกว่าภายในเซลล์", "สารละลายที่เข้มข้นน้อยกว่าภายในเซลล์", "สารละลายที่เข้มข้นเท่ากัน", "สารละลายที่ไม่ทำปฏิกิริยา"], ans: 0, exp: "Hyper แปลว่าสูง" },
            { q: "ถ้าเยื่อเลือกผ่านเสียหาย กระบวนการใดจะได้รับผลกระทบมากที่สุด?", options: ["การออสโมซิส", "การสะสมสีภายในเซลล์", "การเพิ่มอุณหภูมิห้อง", "การเคลื่อนที่ของแสง"], ans: 0, exp: "ออสโมซิสต้องการเยื่อเลือกผ่านที่สมบูรณ์" },
            { q: "อนุภาคขนาดเล็กจะแพร่ได้เร็วกว่าอนุภาคขนาดใหญ่เพราะ?", options: ["มีมวลน้อยทำให้เคลื่อนที่ได้เร็ว", "มีแรงดึงดูดระหว่างโมเลกุลน้อย", "ไม่ได้รับแรงต้านจากตัวกลาง", "ความแตกต่างของความเข้มข้นส่งผลมากกว่า"], ans: 0, exp: "ความเร่งจากพลังงานจลน์มีมากกว่าในอนุภาคเล็ก" },
            { q: "ปรากฏการณ์ 'ผักกาดหอมสดกรอบ' ในน้ำจืด คือผลของ?", options: ["การออสโมซิสน้ำเข้าเซลล์", "การแพร่ของสีในผัก", "การลดลงของเกลือ", "แรงดันภายนอกช่วยค้ำจุน"], ans: 0, exp: "น้ำจืดเป็น Hypotonic น้ำเข้าเซลล์พืชทำให้เต่ง" },
            { q: "เหตุใดการแช่ผลไม้ในน้ำเชื่อมจัดเป็นการถนอมอาหาร?", options: ["น้ำในผลไม้ออกสู่ภายนอก (Hypertonic)", "น้ำเชื่อมเติมสารอาหารให้ผลไม้", "น้ำเชื่อมเป็นตัวเร่งการแพร่", "น้ำเชื่อมย่อยสลายเซลล์ผลไม้"], ans: 0, exp: "น้ำเชื่อมเป็น Hypertonic ดึงน้ำออกจากเซลล์จุลินทรีย์จนไม่สามารถโตได้" },
            { q: "ถ้าเรานำเซลล์พืชไปอยู่ในสารละลาย Hypotonic แรงดันในเซลล์จะเป็นอย่างไร?", options: ["แรงดันเต่งเพิ่มขึ้น", "แรงดันลดลง", "เซลล์จะแตก", "เกิดการ Plasmolysis"], ans: 0, exp: "พืชมีผนังเซลล์รองรับแรงดันจึงไม่แตก" },
            { q: "ความสมดุลของการแพร่ (Dynamic Equilibrium) มีความหมายว่า?", options: ["อนุภาคยังเคลื่อนที่ แต่สุทธิเท่ากับศูนย์", "การเคลื่อนที่หยุดสนิท", "อนุภาคไม่เคลื่อนที่อีกเลย", "สารละลายกลายเป็นของแข็ง"], ans: 0, exp: "แม้สมดุล การเคลื่อนที่สุทธิเป็นศูนย์แต่อัตราไปและกลับยังเท่ากัน" },
            { q: "ข้อใดเกี่ยวข้องกับการออสโมซิส?", options: ["น้ำผ่านเยื่อบางๆ", "สีแพร่ในน้ำ", "กลิ่นน้ำหอมกระจายตัว", "น้ำมันในน้ำ"], ans: 0, exp: "ออสโมซิสเน้นที่การเคลื่อนที่ของน้ำผ่านเยื่อเลือกผ่าน" },
            { q: "การใส่เกลือในน้ำต้มไข่ช่วยให้ไข่สุกเร็วขึ้นเพราะ?", options: ["เปลี่ยนจุดเดือดและไม่มีผลต่อการออสโมซิสของไข่โดยตรง", "ออสโมซิสทำให้ไข่สุกไว", "การแพร่ของเกลือเข้าไข่เร่งความร้อน", "ไม่มีเหตุผลทางวิทยาศาสตร์"], ans: 0, exp: "การแพร่/ออสโมซิสไม่ใช่ปัจจัยหลักในการทำให้สุก แต่เกลือเปลี่ยนจุดเดือดของน้ำ" },
            { q: "การแพร่แบบใดต้องอาศัย 'โปรตีนช่องผ่าน'?", options: ["Facilitated diffusion", "Simple diffusion", "Osmosis", "Active transport"], ans: 0, exp: "Facilitated diffusion คือการแพร่แบบอาศัยตัวช่วย" },
            { q: "ถ้าเซลล์สูญเสีย Plasmolysis สภาวะนั้นคือ?", options: ["เซลล์พืชสูญเสียน้ำจนเยื่อหุ้มเซลล์แยกจากผนัง", "เซลล์พืชเต่งมาก", "เซลล์สัตว์แตก", "สมดุลเท่ากัน"], ans: 0, exp: "Plasmolysis คืออาการเหี่ยวของพืช" },
            { q: "ขนาดของช่องว่างในเยื่อเลือกผ่านมีผลอย่างไรต่อการแพร่?", options: ["กำหนดว่าสารใดผ่านได้", "ไม่มีผลเลย", "เพิ่มความเร็วการออสโมซิส", "ลดอุณหภูมิของสาร"], ans: 0, exp: "ขนาดโมเลกุลสารที่มากกว่าช่องว่างจะผ่านไม่ได้" },
            { q: "การแพร่จะหยุดเมื่อใด?", options: ["เมื่อความเข้มข้นเท่ากัน", "เมื่ออุณหภูมิเป็น 0", "เมื่อมีสิ่งกีดขวาง", "ไม่มีวันหยุด"], ans: 0, exp: "ความเข้มข้นเท่ากันคือสภาวะสมดุล" },
            { q: "สัตว์ทะเลมีกลไกอย่างไรในการรักษาสมดุลน้ำในน้ำเค็ม?", options: ["มีการจัดการออสโมซิสอย่างสม่ำเสมอ", "ไม่ต้องดื่มน้ำ", "ไม่ดูดซึมน้ำ", "ปล่อยให้น้ำออกจนเหี่ยว"], ans: 0, exp: "ต้องกำจัดเกลือและรักษาน้ำไว้" },
            { q: "ข้อใดเป็นตัวอย่างของการแพร่?", options: ["ก๊าซคาร์บอนไดออกไซด์ในปอด", "การดูดน้ำของรากพืช", "การเคลื่อนที่ของอะมีบา", "การกรองเลือดของไต"], ans: 0, exp: "ก๊าซแพร่ผ่านเยื่อหุ้มเซลล์ได้ดี" },
            { q: "ถ้าความเข้มข้นสารภายนอกมากกว่าภายในเซลล์ น้ำจะเคลื่อนที่อย่างไร?", options: ["ออกจากเซลล์", "เข้าสู่เซลล์", "ไม่เคลื่อนที่", "เคลื่อนที่สลับไปมาโดยไม่มีทิศทาง"], ans: 0, exp: "น้ำเคลื่อนที่ไปหาที่ที่สารละลายเข้มข้นกว่า" },
            { q: "ทำไมสารสีเข้มถึงแพร่ช้ากว่าสารสีจางในความเข้มข้นเท่ากัน?", options: ["อนุภาคสารสีเข้มมักมีขนาดใหญ่กว่า", "ไม่มีผลต่างกัน", "สารสีเข้มมีความหนาแน่นต่ำ", "เพราะแสงส่องผ่านไม่ได้"], ans: 0, exp: "ขนาดอนุภาคสัมพันธ์กับความเข้มข้นและชนิดสาร" },
            { q: "การแพร่แบบธรรมดาอาศัยสิ่งใด?", options: ["พลังงานจลน์ของโมเลกุลเอง", "การใช้ ATP", "การสั่งการของนิวเคลียส", "แรงดันจากไมโทคอนเดรีย"], ans: 0, exp: "พลังงานจลน์ทำให้โมเลกุลเคลื่อนที่" },
            { q: "ถ้าอุณหภูมิลดลง อัตราการแพร่จะเป็นอย่างไร?", options: ["ช้าลง", "เร็วขึ้น", "คงที่", "หยุดสนิท"], ans: 0, exp: "พลังงานจลน์ลดลง การเคลื่อนที่ของอนุภาคจึงช้าลง" }
        ];
        let idx = 0;
        function nav(d) {
            idx = Math.max(0, Math.min(29, idx + d));
            render();
        }

        function render() {
            document.getElementById('q-num').innerText = idx + 1;
            document.getElementById('question').innerText = QUESTIONS[idx].q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            QUESTIONS[idx].options.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = "w-full text-left p-3 border rounded hover:bg-green-50 transition-all";
                b.innerText = o;
                b.onclick = () => {
                    const isCorrect = i === QUESTIONS[idx].ans;
                    b.className += isCorrect ? " correct-ans" : " wrong-ans";
                    document.getElementById('feedback').classList.remove('hidden');
                    document.getElementById('feedback').innerText = "เฉลย: " + QUESTIONS[idx].exp;
                    Array.from(optDiv.children).forEach(btn => btn.disabled = true);
                };
                optDiv.appendChild(b);
            });
        }

        const canvas = document.getElementById('wb');
        const ctx = canvas.getContext('2d');
        let painting = false;
        canvas.onmousedown = () => painting = true;
        canvas.onmouseup = () => painting = false;
        canvas.onmousemove = (e) => {
            if(!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        };
        window.onload = render;
    </script>
</body>
</html>
