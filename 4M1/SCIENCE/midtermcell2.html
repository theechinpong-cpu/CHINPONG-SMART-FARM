<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พระจอมเกล้าติวเตอร์ - เจาะลึกโครงสร้างเซลล์ (ชุดที่ 2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .correct-ans { background-color: #dcfce7 !important; border: 1px solid #22c55e !important; }
        .wrong-ans { background-color: #fee2e2 !important; border: 1px solid #ef4444 !important; }
    </style>
</head>
<body class="p-2 md:p-6">
    <header class="max-w-7xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold text-blue-800 mb-2">ชุดติวเข้มวิทยาศาสตร์ ม.1: โครงสร้างเซลล์ (ชุดที่ 2)</h1>
        <p class="text-gray-600">วิเคราะห์เชิงลึกระดับยาก อิงมาตรฐาน สสวท. - เน้นกลไกและการวิเคราะห์</p>
    </header>

    <main class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <section class="flex flex-col md:flex-row h-auto md:h-[850px]">
            <div id="quiz-frame" class="w-full md:w-[70%] p-8 overflow-y-auto border-r border-gray-200">
                <div id="q-area">
                    <div class="text-lg font-bold mb-4">ข้อที่ <span id="qn">1</span>/30</div>
                    <div id="q-text" class="text-xl font-semibold mb-6"></div>
                    <div id="options-list" class="space-y-3"></div>
                    <div id="feedback" class="mt-6 p-4 rounded-lg hidden"></div>
                    <div class="mt-8 flex justify-between">
                        <button id="prev-btn" onclick="nav(-1)" class="px-6 py-2 bg-gray-200 rounded-lg">ก่อนหน้า</button>
                        <button id="next-btn" onclick="nav(1)" class="px-6 py-2 bg-blue-600 text-white rounded-lg">ถัดไป</button>
                    </div>
                </div>
            </div>
            <div class="w-full md:w-[30%] bg-gray-50 p-4">
                <h3 class="font-bold text-gray-700 mb-2">กระดานทด (Whiteboard)</h3>
                <canvas id="wb" class="w-full h-[600px] bg-white border border-gray-200 rounded-lg"></canvas>
            </div>
        </section>
    </main>

    <script>
        const QUESTIONS_SET_2 = [
            { q: "ถ้าเปรียบเซลล์เป็นอาณาจักร ออร์แกเนลล์ใดทำหน้าที่เปรียบได้กับ 'หน่วยกำจัดขยะและรีไซเคิล' ของอาณาจักร?", options: ["ไมโทคอนเดรีย", "ไลโซโซม", "กอลจิคอมเพล็กซ์", "ร่างแหเอนโดพลาซึม"], ans: 1, exp: "ไลโซโซมทำหน้าที่ย่อยสลายออร์แกเนลล์ที่เสื่อมสภาพ" },
            { q: "ความแตกต่างที่สำคัญที่สุดในการสังเคราะห์โปรตีนระหว่าง RER และ ไรโบโซมอิสระ คืออะไร?", options: ["ชนิดของโปรตีนที่สร้าง", "จุดหมายปลายทางของโปรตีน", "ปริมาณ ATP ที่ใช้", "จำนวนกรดอะมิโน"], ans: 1, exp: "RER สร้างโปรตีนเพื่อส่งออกนอกเซลล์ หรือสร้างเป็นส่วนประกอบของเยื่อหุ้ม" },
            { q: "หากเซลล์พืชขาดน้ำจนแวคิวโอลแฟบ จะส่งผลอย่างไรต่อผนังเซลล์?", options: ["ผนังเซลล์จะหนาขึ้น", "เกิดสภาวะพลาสโมไลซิส (Plasmolysis)", "คลอโรพลาสต์จะเพิ่มจำนวน", "เซลล์จะแบ่งตัวเร็วขึ้น"], ans: 1, exp: "การสูญเสียแรงดันเต่งทำให้เยื่อหุ้มเซลล์แยกตัวออกจากผนังเซลล์" },
            // ... (30 questions logic here)
        ];

        let idx = 0;
        function nav(d) {
            idx = Math.max(0, Math.min(29, idx + d));
            render();
        }
        function render() {
            document.getElementById('qn').innerText = idx + 1;
            document.getElementById('q-text').innerText = QUESTIONS_SET_2[idx].q;
            const opt = document.getElementById('options-list');
            opt.innerHTML = '';
            QUESTIONS_SET_2[idx].options.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = "w-full p-4 border rounded-lg hover:bg-blue-50";
                b.innerText = o;
                b.onclick = () => {
                    b.className += (i === QUESTIONS_SET_2[idx].ans ? " correct-ans" : " wrong-ans");
                    document.getElementById('feedback').classList.remove('hidden');
                    document.getElementById('feedback').innerText = QUESTIONS_SET_2[idx].exp;
                };
                opt.appendChild(b);
            });
        }
        window.onload = render;
    </script>
</body>
</html>
