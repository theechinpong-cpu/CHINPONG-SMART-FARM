<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พระจอมเกล้าติวเตอร์ - เจาะลึกโครงสร้างเซลล์ (ชุดที่ 3: ยากมาก)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0fdf4; }
        .correct-ans { background-color: #bbf7d0 !important; border-color: #16a34a !important; }
        .wrong-ans { background-color: #fecaca !important; border-color: #dc2626 !important; }
    </style>
</head>
<body class="p-4">
    <header class="max-w-6xl mx-auto mb-6 text-center">
        <h1 class="text-3xl font-bold text-green-800">ชุดติวเข้มวิทยาศาสตร์ ม.1: โครงสร้างเซลล์ (ชุดที่ 3)</h1>
        <p class="text-green-700">ระดับความยาก: ยากมาก (เน้นการวิเคราะห์เชิงลึกและกลไกเซลล์)</p>
    </header>

    <main class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg border p-6">
        <div class="flex flex-col md:flex-row gap-6">
            <div class="flex-1">
                <div class="mb-4">ข้อที่ <span id="q-num">1</span>/30</div>
                <div id="question" class="text-xl font-bold mb-4"></div>
                <div id="options" class="space-y-3"></div>
                <div id="feedback" class="mt-4 p-4 rounded bg-gray-50 border hidden"></div>
                <div class="mt-6 flex justify-between">
                    <button onclick="nav(-1)" class="px-6 py-2 bg-gray-200 rounded">ก่อนหน้า</button>
                    <button onclick="nav(1)" class="px-6 py-2 bg-green-600 text-white rounded">ถัดไป</button>
                </div>
            </div>
            <div class="w-full md:w-80 border-l pl-4">
                <h3 class="font-bold mb-2">กระดานทด</h3>
                <canvas id="wb" class="w-full h-96 border rounded bg-gray-50"></canvas>
            </div>
        </div>
    </main>

    <script>
        const QUESTIONS = [
            { q: "หากเซลล์พืชถูกสกัดสารเอนไซม์ที่ใช้ย่อยสลายผนังเซลล์ออกไป จะเกิดผลกระทบต่อการลำเลียงสารและการค้ำจุนเซลล์อย่างไร?", options: ["เซลล์จะสูญเสียการควบคุมแรงดันออสโมติกและอาจแตกได้", "เซลล์จะสร้างคลอโรพลาสต์เพิ่มขึ้น", "เซลล์จะไม่มีการสร้าง ATP", "ไม่มีผลกระทบต่อโครงสร้าง"], ans: 0, exp: "ผนังเซลล์ทำหน้าที่ป้องกันการแตกของเซลล์เมื่อน้ำเข้าสู่เซลล์มากเกินไป" },
            { q: "ในการสังเคราะห์เอนไซม์ชนิดหนึ่งเพื่อย่อยโปรตีน ออร์แกเนลล์ใดมีส่วนร่วมในกระบวนการนี้เป็นอันดับแรกสุด?", options: ["ไรโบโซม", "กอลจิคอมเพล็กซ์", "ไลโซโซม", "ร่างแหเอนโดพลาซึมชนิดเรียบ"], ans: 0, exp: "ไรโบโซมคือจุดเริ่มต้นของการสร้างโปรตีน" },
            { q: "เปรียบเทียบการทำงานของเซลล์กับโรงงาน ถ้ากอลจิคอมเพล็กซ์เกิดความเสียหาย สินค้าประเภทใดที่จะส่งออกไม่ได้?", options: ["โปรตีนที่ผ่านการปรับแต่งแล้ว", "พลังงาน ATP", "สารพันธุกรรม", "น้ำตาลจากการสังเคราะห์แสง"], ans: 0, exp: "กอลจิคอมเพล็กซ์คือแผนกบรรจุและส่งออกผลิตภัณฑ์" },
            { q: "หากเซลล์ประสาทมีไมโทคอนเดรียผิดปกติ จะส่งผลกระทบต่อกระบวนการใดมากที่สุด?", options: ["การส่งกระแสประสาท", "การเก็บสารพันธุกรรม", "การย่อยขยะในเซลล์", "การแบ่งเซลล์"], ans: 0, exp: "การส่งกระแสประสาทต้องใช้พลังงานสูง (Active Transport)" },
            { q: "การที่เซลล์พืชมีแวคิวโอลขนาดใหญ่ส่งผลดีอย่างไรต่อการประหยัดพลังงานในการสังเคราะห์แสง?", options: ["ช่วยให้เซลล์มีพื้นที่ผิวสัมผัสรับแสงมากขึ้นโดยไม่ต้องใช้วัสดุสร้างไซโตพลาสซึมมาก", "ช่วยเก็บ ATP", "ช่วยย่อยสลายแสง", "ไม่มีผลต่อพลังงาน"], ans: 0, exp: "แวคิวโอลช่วยขยายขนาดเซลล์ด้วยน้ำ ทำให้พืชสูงขึ้นโดยไม่ต้องสร้างโปรตีนหนาแน่น" },
            { q: "ถ้านำเซลล์ไปอยู่ในสารละลายที่มีความเข้มข้นสูงกว่าภายในเซลล์ (Hypertonic) ออร์แกเนลล์ใดในพืชที่อาจแสดงอาการชัดเจนที่สุด?", options: ["แวคิวโอลและผนังเซลล์", "ไมโทคอนเดรีย", "นิวเคลียส", "ไรโบโซม"], ans: 0, exp: "แรงดันเต่งจะลดลงและเยื่อหุ้มเซลล์จะแยกตัวจากผนังเซลล์ (Plasmolysis)" },
            { q: "เหตุใดไซโตสเกเลตอน (Cytoskeleton) จึงมีความสำคัญอย่างยิ่งในเซลล์สัตว์เมื่อเทียบกับเซลล์พืช?", options: ["เซลล์สัตว์ไม่มีผนังเซลล์ค้ำจุนโครงร่างที่ชัดเจน", "เซลล์สัตว์สร้างพลังงานไม่ได้", "เซลล์สัตว์ไม่มีนิวเคลียส", "เซลล์สัตว์มีแวคิวโอลขนาดใหญ่"], ans: 0, exp: "โครงร่างค้ำจุนเซลล์ทำหน้าที่คงรูปทรงและเคลื่อนย้ายสารในสัตว์ที่ไม่มีผนังเซลล์" },
            { q: "กระบวนการสร้างโปรตีนเพื่อส่งออกนอกเซลล์มีลำดับเส้นทางอย่างไร?", options: ["ไรโบโซม → RER → กอลจิคอมเพล็กซ์ → นอกเซลล์", "นิวเคลียส → ไรโบโซม → ไมโทคอนเดรีย", "กอลจิคอมเพล็กซ์ → RER → ไรโบโซม", "SER → กอลจิคอมเพล็กซ์ → นอกเซลล์"], ans: 0, exp: "เป็นเส้นทางหลักของระบบ Endomembrane" },
            { q: "เซลล์กล้ามเนื้อหัวใจที่ทำงานตลอดเวลาจะมีลักษณะเด่นของออร์แกเนลล์ใดเป็นพิเศษ?", options: ["จำนวนไมโทคอนเดรียที่หนาแน่น", "จำนวนคลอโรพลาสต์ที่หนาแน่น", "ผนังเซลล์ที่หนา", "มีนิวเคลียสหลายอันในหนึ่งเซลล์"], ans: 0, exp: "ต้องการพลังงาน ATP ต่อเนื่องสูงมาก" },
            { q: "เอนไซม์ที่ใช้ย่อยไขมันในไลโซโซมถูกสร้างขึ้นที่ออร์แกเนลล์ใด?", options: ["ร่างแหเอนโดพลาซึมชนิดขรุขระ (RER)", "ร่างแหเอนโดพลาซึมชนิดเรียบ (SER)", "ไมโทคอนเดรีย", "นิวเคลียส"], ans: 0, exp: "ไรโบโซมบน RER สร้างโปรตีนเอนไซม์" },
            { q: "หากเยื่อหุ้มนิวเคลียสเกิดรูพรุนผิดปกติ จะส่งผลต่อกระบวนการใดโดยตรง?", options: ["การส่งคำสั่ง DNA ออกไปสู่ไซโตพลาสซึม", "การผลิตพลังงาน ATP", "การกำจัดขยะในเซลล์", "การแบ่งเซลล์"], ans: 0, exp: "รูนิวเคลียส (Nuclear pore) ควบคุมการเข้าออกของสารพันธุกรรมและโปรตีน" },
            { q: "หน้าที่ของ SER ในเซลล์ตับมนุษย์คืออะไร?", options: ["กำจัดสารพิษและสังเคราะห์ไขมัน", "สังเคราะห์โปรตีน", "ย่อยอาหาร", "แบ่งเซลล์"], ans: 0, exp: "ตับมี SER มากเพื่อทำหน้าที่ Detoxing" },
            { q: "โครงสร้างใดในเซลล์ทำหน้าที่คล้าย 'ระบบขนส่งมวลชน' เพื่อขนส่งโปรตีนภายในเซลล์?", options: ["ไมโครทูบูล (Microtubules)", "ผนังเซลล์", "แวคิวโอล", "ไลโซโซม"], ans: 0, exp: "เป็นส่วนหนึ่งของไซโตสเกเลตอนที่ใช้ขนส่งถุงบรรจุสาร" },
            { q: "เหตุใดคลอโรพลาสต์จึงต้องมีเยื่อหุ้ม 2 ชั้น?", options: ["เพื่อแยกพื้นที่ภายในสำหรับการสังเคราะห์แสงให้มีประสิทธิภาพสูง", "เพื่อป้องกันการระเบิด", "เพื่อให้มีความสวยงาม", "เพื่อสร้างพลังงาน ATP โดยตรง"], ans: 0, exp: "เยื่อหุ้ม 2 ชั้นช่วยสร้างความแตกต่างของความเข้มข้นสารสำหรับสร้างอาหาร" },
            { q: "เซลล์เม็ดเลือดแดงที่โตเต็มวัยสูญเสียนิวเคลียสเพื่อเหตุผลใด?", options: ["เพิ่มพื้นที่บรรจุฮีโมโกลบินให้ได้สูงสุด", "ประหยัดพลังงาน", "เพื่อลดขนาดเซลล์", "เพราะติดเชื้อ"], ans: 0, exp: "เพิ่มประสิทธิภาพการขนส่งออกซิเจน" },
            { q: "อะไรคือความแตกต่างหลักระหว่างการแพร่แบบธรรมดาและการแพร่แบบฟาซิลิเทต?", options: ["ต้องใช้โปรตีนตัวพาช่วยในแบบฟาซิลิเทต", "การแพร่แบบธรรมดาต้องใช้ ATP", "ไม่มีข้อแตกต่าง", "การแพร่แบบฟาซิลิเทตเคลื่อนที่จากเข้มข้นน้อยไปมาก"], ans: 0, exp: "การแพร่แบบฟาซิลิเทตต้องการโปรตีนช่องผ่าน (Channel protein)" },
            { q: "ไลโซโซมมีสภาพแวดล้อมภายในเป็นอย่างไร?", options: ["เป็นกรดเพื่อให้เอนไซม์ทำงานได้", "เป็นด่าง", "เป็นกลาง", "ไม่มีของเหลว"], ans: 0, exp: "เอนไซม์ย่อยสลายทำงานได้ดีที่สุดในสภาวะเป็นกรด" },
            { q: "หากเซลล์พืชอยู่ในสภาวะที่ไม่มีแสงเลยนานๆ ออร์แกเนลล์ใดจะได้รับผลกระทบทางตรงในด้านหน้าที่?", options: ["คลอโรพลาสต์", "ไมโทคอนเดรีย", "นิวเคลียส", "ไซโตพลาสซึม"], ans: 0, exp: "กระบวนการสังเคราะห์ด้วยแสงจะหยุดลง" },
            { q: "โครงสร้างที่ช่วยในการแบ่งโครโมโซมในเซลล์สัตว์คืออะไร?", options: ["เซนทริโอล", "ผนังเซลล์", "คลอโรพลาสต์", "แวคิวโอล"], ans: 0, exp: "เซนทริโอลสร้างเส้นใยสปินเดิล" },
            { q: "ทำไมไมโทคอนเดรียจึงเชื่อว่าเคยเป็นเซลล์อิสระมาก่อน (Endosymbiotic theory)?", options: ["มี DNA เป็นของตนเองและมีเยื่อหุ้ม 2 ชั้น", "มีรูปร่างกลม", "อยู่ในเซลล์ทุกชนิด", "สร้างแป้งได้"], ans: 0, exp: "เป็นทฤษฎีอธิบายวิวัฒนาการของออร์แกเนลล์" },
            { q: "หน้าที่ของนิวคลีโอลัส (Nucleolus) ในนิวเคลียสคืออะไร?", options: ["สังเคราะห์ไรโบโซม", "สร้างโปรตีน", "เก็บ DNA", "สลายขยะ"], ans: 0, exp: "เป็นแหล่งผลิต RNA ที่จะไปเป็นไรโบโซม" },
            { q: "ถ้าเยื่อหุ้มเซลล์รั่ว เซลล์จะตายเพราะเหตุใด?", options: ["การเสียสภาวะธำรงดุล (Homeostasis)", "เพราะไม่มีผนังเซลล์", "เพราะขาดอาหาร", "เพราะไมโทคอนเดรียระเบิด"], ans: 0, exp: "เซลล์ไม่สามารถควบคุมสิ่งที่เข้าออกได้" },
            { q: "การลำเลียงแบบ Active Transport จำเป็นต้องมีสิ่งใด?", options: ["พลังงาน ATP และโปรตีนตัวพา", "เยื่อหุ้มเซลล์หนาๆ", "แสงแดด", "ความต่างศักย์"], ans: 0, exp: "เป็นการฝืนแรงแพร่" },
            { q: "โครมาทิน (Chromatin) คืออะไร?", options: ["DNA ที่พันอยู่กับโปรตีน", "ของเหลวในนิวเคลียส", "เปลือกนิวเคลียส", "อาหารของนิวเคลียส"], ans: 0, exp: "เป็นรูปแบบปกติของสารพันธุกรรมเมื่อไม่ได้แบ่งเซลล์" },
            { q: "เซลล์พืชที่แก่ตัวลงมักมีแวคิวโอลขนาดใหญ่ขึ้นเพราะอะไร?", options: ["เพื่อสะสมสารต่างๆ และยืดอายุเซลล์", "เพื่อสร้างโปรตีน", "เพื่อกำจัดนิวเคลียส", "เพื่อลดขนาดเซลล์"], ans: 0, exp: "เป็นการเก็บสำรองสารก่อนหมดอายุขัย" },
            { q: "ออร์แกเนลล์ใดมีความสำคัญต่อการรักษาสมดุลกรด-ด่างในไซโตพลาสซึม?", options: ["ไมโทคอนเดรีย", "นิวเคลียส", "ไรโบโซม", "ผนังเซลล์"], ans: 0, exp: "กระบวนการหายใจในไมโทคอนเดรียช่วยควบคุมสมดุลเคมี" },
            { q: "การที่ผนังเซลล์พืชมีช่อง Plasmodesmata มีไว้เพื่ออะไร?", options: ["สื่อสารและส่งสารระหว่างเซลล์พืชข้างเคียง", "ให้แสงผ่าน", "เพิ่มความแข็งแรง", "ให้น้ำเข้าเท่านั้น"], ans: 0, exp: "เป็นช่องเชื่อมต่อไซโตพลาสซึมระหว่างเซลล์พืช" },
            { q: "สารใดต่อไปนี้เป็นส่วนประกอบหลักของเยื่อหุ้มเซลล์?", options: ["ฟอสโฟลิพิดและโปรตีน", "เซลลูโลสและแป้ง", "โปรตีนและไขมันสัตว์", "ไม่มีสารประกอบหลัก"], ans: 0, exp: "โครงสร้างเป็น Phospholipid bilayer" },
            { q: "ความแตกต่างระหว่างการแพร่ธรรมดากับออสโมซิส?", options: ["ออสโมซิสคือการเคลื่อนที่ของ 'น้ำ' ผ่านเยื่อเลือกผ่าน", "ออสโมซิสต้องใช้พลังงาน", "แพร่ธรรมดาต้องมีโปรตีน", "ไม่มีข้อแตกต่าง"], ans: 0, exp: "นิยามของการออสโมซิสเน้นที่ตัวทำละลายคือน้ำ" },
            { q: "ถ้าออร์แกเนลล์เปรียบเป็น 'ห้องสมุด' ออร์แกเนลล์นั้นคืออะไร?", options: ["นิวเคลียส", "ไมโทคอนเดรีย", "กอลจิคอมเพล็กซ์", "ไลโซโซม"], ans: 0, exp: "แหล่งเก็บฐานข้อมูลพันธุกรรม" }
        ];
        let idx = 0;
        function nav(d) {
            idx = Math.max(0, Math.min(29, idx + d));
            render();
        }

        function render() {
            document.getElementById('q-num').innerText = idx + 1;
            document.getElementById('question').innerText = QUESTIONS[idx].q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            QUESTIONS[idx].options.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = "w-full text-left p-3 border rounded hover:bg-green-50 transition-all";
                b.innerText = o;
                b.onclick = () => {
                    const isCorrect = i === QUESTIONS[idx].ans;
                    b.className += isCorrect ? " correct-ans" : " wrong-ans";
                    document.getElementById('feedback').classList.remove('hidden');
                    document.getElementById('feedback').innerText = "เฉลย: " + QUESTIONS[idx].exp;
                    // Disable all buttons after selection
                    Array.from(optDiv.children).forEach(btn => btn.disabled = true);
                };
                optDiv.appendChild(b);
            });
        }

        // Initialize Whiteboard
        const canvas = document.getElementById('wb');
        const ctx = canvas.getContext('2d');
        let painting = false;
        canvas.onmousedown = () => painting = true;
        canvas.onmouseup = () => painting = false;
        canvas.onmousemove = (e) => {
            if(!painting) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        };

        window.onload = render;
    </script>
</body>
</html>
