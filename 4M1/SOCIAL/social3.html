<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบข้อสอบออนไลน์ - พระจอมเกล้าติวเตอร์</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-container { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; }
        .exam-frame { width: 70%; background: white; padding: 20px; overflow-y: auto; border-right: 2px solid #ddd; }
        .whiteboard-frame { width: 30%; background: #fffbe6; display: flex; flex-direction: column; position: relative; }
        .wb-header { background: #ffe58f; padding: 10px; font-weight: bold; text-align: center; border-bottom: 1px solid #ffd666; }

        .wb-tools { padding: 10px; display: flex; gap: 5px; justify-content: center; background: #fffbe6; border-top: 1px solid #ffd666; }

        .question-card { background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .options label { display: block; padding: 8px 10px; margin: 5px 0; background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #f1f1f1; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .clue { font-size: 0.9em; color: #e67e22; margin-top: 8px; font-style: italic; }
        .explanation { font-size: 0.9em; color: #27ae60; margin-top: 5px; font-weight: bold; display: none; }
        #summary-screen { display: none; padding: 30px; text-align: center; overflow-y: auto; height: 100%; width: 100%; background: white; position: absolute; top: 0; left: 0; z-index: 10; }
    </style>
</head>
<body>
    <header>
        <h2>พระจอมเกล้าติวเตอร์ - ข้อสอบวิชาภูมิศาสตร์ทวีปออสเตรเลียและโอเชียเนีย</h2>
        <div>
            <button onclick="toggleLanguage()">TH / EN</button>
            <button onclick="resetExam()" style="background: #e74c3c;">Reset</button>
        </div>
    </header>
    <div class="main-container">
        <div class="exam-frame" id="examFrame">
            <div id="questionContainer"></div>
            <button onclick="submitExam()" style="width: 100%; padding: 12px; background: #27ae60; font-size: 1.1em; margin-top: 20px;">ส่งคำตอบและวิเคราะห์ผล</button>
        </div>
        <div class="whiteboard-frame">
            <div class="wb-header">กระดานทดข้อสอบ (Whiteboard)</div>
            <canvas id="canvas"></canvas>
            <div class="wb-tools">
                <button onclick="clearCanvas()" style="background: #e74c3c;">ล้างกระดาน</button>
            </div>
        </div>
    </div>
    <div id="summary-screen">
        <h2>ผลการประเมินการทดสอบ</h2>
        <div id="scoreDisplay" style="font-size: 1.5em; margin: 20px 0;"></div>
        <div id="analysisResult" style="text-align: left; max-width: 800px; margin: 0 auto; line-height: 1.6;"></div>
        <button onclick="resetExam()" style="margin-top: 20px;">ทำข้อสอบอีกครั้ง</button>
    </div>

    let userAnswers = {};

    function renderQuestions() {
        const container = document.getElementById('questionContainer');
        let html = '';
        questions.forEach((item, index) => {
            html += `<div class="question-card" id="qcard_${index}">
                <p style="font-weight: bold; margin-bottom: 8px;">${item.q}</p>
                <div class="options">`;
            item.options.forEach((opt, optIndex) => {
                html += `<label onclick="selectOption(${index}, ${optIndex})">
                    <input type="radio" name="q_${index}" value="${optIndex}"> ${opt}
                </label>`;
            });
            html += `</div>
                <div class="clue">${item.clue}</div>
                <div class="explanation" id="exp_${index}">${item.exp}</div>
            </div>`;
        });
        container.innerHTML = html;
        loadFromLocalStorage();
    }

    function selectOption(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        saveToLocalStorage();
        
        const card = document.getElementById(`qcard_${qIndex}`);
        const labels = card.querySelectorAll('label');
        labels.forEach((lbl, idx) => {
            lbl.classList.remove('correct', 'incorrect');
            if(idx === questions[qIndex].answer) {
                lbl.classList.add('correct');
            } else if(idx === optIndex) {
                lbl.classList.add('incorrect');
            }
        });
        document.getElementById(`exp_${qIndex}`).style.display = 'block';
    }

    function saveToLocalStorage() {
        localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
        localStorage.setItem('currentLang', currentLang);
    }

    function loadFromLocalStorage() {
        const savedAns = localStorage.getItem('userAnswers');
        if(savedAns) {
            userAnswers = JSON.parse(savedAns);
            for(let qIndex in userAnswers) {
                let optIndex = userAnswers[qIndex];
                const card = document.getElementById(`qcard_${qIndex}`);
                if(card) {
                    const radio = card.querySelectorAll('input')[optIndex];
                    if(radio) radio.checked = true;
                    selectOption(parseInt(qIndex), optIndex);
                }
            }
        }
    }

    function resetExam() {
        localStorage.removeItem('userAnswers');
        userAnswers = {};
        document.getElementById('summary-screen').style.display = 'none';
        renderQuestions();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'TH' ? 'EN' : 'TH';
        alert("สลับสถานะภาษาเรียบร้อย (Current: " + currentLang + ")");
    }

    function submitExam() {
        let score = 0;
        let total = questions.length;
        for(let i=0; i<total; i++) {
            if(userAnswers[i] === questions[i].answer) {
                score++;
            }
        }

        const summaryScreen = document.getElementById('summary-screen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const analysisResult = document.getElementById('analysisResult');

        scoreDisplay.innerHTML = `คุณทำคะแนนได้ <b>${score}</b> จาก <b>${total}</b> คะแนน`;

        let analysisHTML = `<h3>บทวิเคราะห์ผลการทดสอบโดยติวเตอร์</h3>`;
        if(score >= 25) {
            analysisHTML += `<p style="color: green; margin-top: 10px;"><b>จุดเด่น:</b> ผู้เรียนมีความเข้าใจเนื้อหาภูมิประเทศ ภูมิอากาศ และลักษณะทางกายภาพของทวีปออสเตรเลียและโอเชียเนียเป็นอย่างดีเยี่ยม สามารถวิเคราะห์ความสัมพันธ์ระหว่างเทือกเขาเกรตดิไวดิงและเขตเงาฝนได้อย่างแม่นยำ</p>`;
        } else {
            analysisHTML += `<p style="color: orange; margin-top: 10px;"><b>จุดเด่น:</b> มีความเข้าใจในโครงสร้างพื้นฐานของทวีปและกลุ่มเกาะหลักในระดับปานกลาง</p>`;
        }

        analysisHTML += `<p style="color: #c0392b; margin-top: 10px;"><b>จุดด้อย / ข้อควรปรับปรุง:</b> ควรกลับไปทบทวนเนื้อหาในส่วนของรายละเอียดเกาะแก่งในมหาสมุทรแปซิฟิก (ไมโครนีเซีย เมลานีเซีย โพลีนีเซีย) รวมถึงลักษณะภูมิประเทศแบบฟยอร์ดและตำแหน่งที่ตั้งเมืองหลวงของประเทศในแถบโอเชียเนียเพิ่มเติมเพื่อความแม่นยำสูงสุด</p>`;

        analysisResult.innerHTML = analysisHTML;
        summaryScreen.style.display = 'block';
    }

    // Whiteboard Scripting
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight - 80;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', (e) => {
        let touch = e.touches[0];
        let mouseEvent = new MouseEvent('mousedown', {
            clientX: touch.clientX,
            clientY: touch.clientY
        });
        canvas.dispatchEvent(mouseEvent);
    }, {passive: true});

    canvas.addEventListener('touchend', () => {
        let mouseEvent = new MouseEvent('mouseup', {});
        canvas.dispatchEvent(mouseEvent);
    }, {passive: true});

    canvas.addEventListener('touchmove', (e) => {
        let touch = e.touches[0];
        let mouseEvent = new MouseEvent('mousemove', {
            clientX: touch.clientX,
            clientY: touch.clientY
        });
        canvas.dispatchEvent(mouseEvent);
    }, {passive: true});

    function startPosition(e) {
        painting = true;
        draw(e);
    }

    function finishedPosition() {
        painting = false;
        ctx.beginPath();
    }

    function draw(e) {
        if(!painting) return;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#e74c3c';

        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.onload = function() {
        renderQuestions();
    }
</script>
