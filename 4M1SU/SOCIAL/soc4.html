                answer: 0,
                clue: "กัลยาณมิตรคือเพื่อนแท้ที่พาไปสู่ความดี",

        let currentQuestionIndex = 0;
        let userAnswers = {};
        let score = 0;
        let examSubmitted = false;
        let isEnglish = false;

        function toggleLanguage() {
            isEnglish = !isEnglish;
            alert(isEnglish ? "Switched to English Interface Mode (Questions remain in Thai as requested)." : "เปลี่ยนกลับสู่ภาษาไทยเรียบร้อยแล้ว");
        }

        // Render Question Function
        function renderQuestion() {
            const qData = examQuestions[currentQuestionIndex];
            const container = document.getElementById('examContainer');
            
            document.getElementById('questionCounter').innerText = `ข้อที่ ${currentQuestionIndex + 1} / ${examQuestions.length}`;

            let html = `
                <div class="flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <h2 class="text-lg font-semibold text-slate-800">โจทย์ข้อที่ ${currentQuestionIndex + 1}: ${qData.q}</h2>
                        <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">ระดับยาก</span>
                    </div>
                    <div class="text-xs text-slate-500 italic bg-amber-50 p-2 rounded border border-amber-200">
                        💡 คำใบ้/เทคนิค: ${qData.clue}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5 mt-2">
            `;

            qData.options.forEach((opt, idx) => {
                let isSelected = userAnswers[currentQuestionIndex] === idx;
                let btnClass = "border border-slate-200 hover:bg-indigo-50 p-3 rounded-lg text-left transition flex items-center gap-3 font-medium text-sm ";
                
                if (userAnswers[currentQuestionIndex] !== undefined) {
                    if (idx === qData.answer) {
                        btnClass += "bg-emerald-100 border-emerald-400 text-emerald-800 ";
                    } else if (isSelected && idx !== qData.answer) {
                        btnClass += "bg-rose-100 border-rose-400 text-rose-800 ";
                    } else {
                        btnClass += "bg-white text-slate-700 opacity-60 ";
                    }
                } else {
                    btnClass += "bg-white text-slate-700 ";
                }

                html += `
                    <button onclick="selectAnswer(${idx})" class="${btnClass}">
                        <span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-600">${String.fromCharCode(65 + idx)}</span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;

            if (userAnswers[currentQuestionIndex] !== undefined) {
                html += `
                    <div class="mt-4 p-4 bg-indigo-50 border border-indigo-200 rounded-lg text-sm text-indigo-900">
                        <p class="font-bold mb-1">🔍 เฉลยละเอียดและวิธีคิดลัด:</p>
                        <p>${qData.explanation}</p>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').innerText = currentQuestionIndex === examQuestions.length - 1 ? "ส่งข้อสอบ" : "ข้อถัดไป ➡️";
        }

        function selectAnswer(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== undefined) return;
            userAnswers[currentQuestionIndex] = selectedIndex;

            if (selectedIndex === examQuestions[currentQuestionIndex].answer) {
                score++;
            }

            updateScoreBoard();
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < examQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                submitExam();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function updateScoreBoard() {
            document.getElementById('totalScore').innerText = score;
            const answeredCount = Object.keys(userAnswers).length;
            if (answeredCount === examQuestions.length) {
                document.getElementById('examStatus').innerText = "ทำข้อสอบครบแล้ว";
                document.getElementById('examStatus').className = "font-medium text-emerald-600";
            } else {
                document.getElementById('examStatus').innerText = `กำลังทำ (${answeredCount}/${examQuestions.length})`;
                document.getElementById('examStatus').className = "font-medium text-amber-600";
            }
        }

        function submitExam() {
            examSubmitted = true;
            const percentage = ((score / examQuestions.length) * 100).toFixed(1);
            
            const analysisBox = document.getElementById('analysisBox');
            analysisBox.classList.remove('hidden');
            analysisBox.innerHTML = `
                <p class="font-bold text-indigo-700 mb-1">ผลการประเมินเชิงลึก:</p>
                <p>คะแนนรวม: <b>${score} / ${examQuestions.length}</b> (${percentage}%)</p>
                <p class="mt-1"><b>จุดเด่น (Strengths):</b> มีความเข้าใจพุทธประวัติและหลักธรรมเบื้องต้นดีเยี่ยม</p>
                <p class="mt-1"><b>จุดที่ต้องพัฒนา (Areas for Improvement):</b> ควรทบทวนรายละเอียดคัมภีร์ศาสนาอื่นและหลักปฏิบัติทางสังคม</p>
            `;
            alert(`ส่งข้อสอบเรียบร้อยแล้ว! คะแนนของคุณ: ${score} / ${examQuestions.length} (${percentage}%)`);
        }

        function resetExam() {
            userAnswers = {};
            score = 0;
            currentQuestionIndex = 0;
            examSubmitted = false;
            // Apply Fisher-Yates Shuffle on Reset
            shuffleArray(examQuestions);

            updateScoreBoard();
            renderQuestion();
            document.getElementById('analysisBox').classList.add('hidden');
        }

        // Whiteboard Drawing Logic
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4f46e5';

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);

        function clearWhiteboard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Initial load
        window.onload = function() {
            canvas.width = canvas.parentElement.clientWidth - 32;
            canvas.height = 250;
            renderQuestion();
        }
    </script>
