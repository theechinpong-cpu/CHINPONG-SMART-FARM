        .option-label.disabled { cursor: not-allowed; opacity: 0.8; }

        .clue-box { background: #fef9c3; padding: 8px; border-radius: 6px; font-size: 0.85rem; margin-top: 6px; display: none; border-left: 3px solid #eab308; }

        .correct { color: var(--success); }
        .incorrect { color: var(--danger); }

        .wb-controls { display: flex; gap: 10px; margin-top: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }

            q: "หากแก้สมการแล้วได้ผลลัพธ์เป็น 0 = 5 จะสรุปได้ว่าอย่างไรเกี่ยวกับคำตอบของสมการ",
            options: ["สมการไม่มีคำตอบ", "สมการมีคำตอบอนันต์", "คำตอบคือ x = 0", "คำตอบคือ x = 5"],
            answer: 0,
            clue: "กรณีที่ตัวแปรตัดกันหมดแล้วเหลือเท็จ แสดงว่าสมการนั้นเป็นไปไม่ได้",
            explanation: "เมื่อแก้สมการแล้วเกิดข้อขัดแย้งที่เป็นเท็จ (เช่น 0 = 5) แสดงว่าไม่มีจำนวนใดมาแทนแล้วเป็นจริง สรุปได้ว่าสมการไม่มีคำตอบ"
        },
        {
            q: "ข้อใดคือรูปแบบมาตรฐานของสมการเชิงเส้นตัวแปรเดียว",
            options: ["ax + b = 0 เมื่อ a ไม่เท่ากับ 0", "ax^2 + bx + c = 0", "ax + by = c", "y = ax^2 + b"],
            answer: 0,
            clue: "นึกถึงเงื่อนไขดีกรีสูงสุดของตัวแปรคือ 1 และมีตัวแปรเดียว",
            explanation: "รูปแบบมาตรฐานคือ ax + b = 0 โดยที่ a และ b เป็นค่าคงตัว และ a ไม่เท่ากับ 0"
        }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    let userAnswers = {};
    let answeredStatus = {};

    function renderExam() {
        const box = document.getElementById('questions-box');
        box.innerHTML = '';
        
        questionsData.forEach((qObj, index) => {
            let optionsWithIndex = qObj.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            
            if (!qObj.shuffledOptions) {
                qObj.shuffledOptions = shuffleArray([...optionsWithIndex]);
            }

            let html = `<div class="question-card" data-qid="${index}">
                <div class="question-title">ข้อที่ ${index + 1}: ${qObj.q}</div>
                <div class="options-list" id="options-list-${index}">`;
            
            qObj.shuffledOptions.forEach((opt, optIdx) => {
                let isChecked = userAnswers[index] === opt.originalIndex ? 'checked' : '';
                let isDisabled = answeredStatus[index] ? 'disabled' : '';
                let disabledClass = answeredStatus[index] ? 'disabled' : '';
                
                html += `<label class="option-label ${disabledClass}">
                    <input type="radio" name="q${index}" value="${opt.originalIndex}" ${isChecked} ${isDisabled} onclick="handleAnswer(${index}, ${opt.originalIndex})">
                    <span>${opt.text}</span>
                </label>`;
            });

            html += `</div>
                <button class="clue-btn" onclick="toggleClue(${index})">🔍 ดูคำใบ้ / แนวคิด</button>
                <div class="clue-box" id="clue-${index}"><strong>คำใบ้:</strong> ${qObj.clue}</div>
                <div class="feedback" id="feedback-${index}"></div>
            </div>`;
            box.innerHTML += html;

            // หากเคยตอบไปแล้ว ให้แสดงผลลัพธ์ค้างไว้
            if (answeredStatus[index]) {
                showFeedback(index, userAnswers[index]);
            }
        });
    }

    function handleAnswer(qIndex, optIndex) {
        if (answeredStatus[qIndex]) return; // ป้องกันการเปลี่ยนคำตอบหากตอบไปแล้ว

        userAnswers[qIndex] = optIndex;
        answeredStatus[qIndex] = true;
        localStorage.setItem('userAnswers', JSON.stringify(userAnswers));
        localStorage.setItem('answeredStatus', JSON.stringify(answeredStatus));

        // ล็อกการคลิกตัวเลือกทั้งหมดในข้อนี้
        const optionsList = document.getElementById(`options-list-${qIndex}`);
        const inputs = optionsList.querySelectorAll('input');
        const labels = optionsList.querySelectorAll('.option-label');
        
        inputs.forEach(input => input.disabled = true);
        labels.forEach(label => label.classList.add('disabled'));

        showFeedback(qIndex, optIndex);
    }

    function showFeedback(qIndex, optIndex) {
        let qObj = questionsData[qIndex];
        let feedback = document.getElementById(`feedback-${qIndex}`);

        if (optIndex === qObj.answer) {
            feedback.innerHTML = `<span class="correct">✔ ถูกต้อง! ${qObj.explanation}</span>`;
        } else {
            feedback.innerHTML = `<span class="incorrect">✖ ผิดครับ เฉลยที่ถูกต้อง: ${qObj.options[qObj.answer]} (${qObj.explanation})</span>`;
        }
    }

    function toggleClue(index) {
        let box = document.getElementById(`clue-${index}`);
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function submitExam() {
        let score = 0;
        let incorrectTopics = [];

        questionsData.forEach((qObj, index) => {
            let userAnswer = userAnswers[index];
            if (userAnswer === qObj.answer) {
                score++;
            } else {
                incorrectTopics.push(`ข้อ ${index + 1}`);
            }
        });

        let resultsSection = document.getElementById('results-section');
        let scoreText = document.getElementById('score-text');
        let analysisText = document.getElementById('analysis-text');

        resultsSection.style.display = 'block';
        scoreText.innerHTML = `<strong>คะแนนรวมของคุณ:</strong> ${score} / ${questionsData.length} (${((score/questionsData.length)*100).toFixed(2)}%)`;

        if (incorrectTopics.length === 0) {
            analysisText.innerHTML = `<strong>วิเคราะห์ผล:</strong> ยอดเยี่ยมมาก! คุณมีความเข้าใจในเรื่องสมการเชิงเส้นตัวแปรเดียวอย่างสมบูรณ์แบบ ได้คะแนนเต็มทุกข้อ`;
        } else {
            analysisText.innerHTML = `<strong>จุดที่ต้องพัฒนา:</strong> คุณยังมีความเข้าใจคลาดเคลื่อนในข้อดังต่อไปนี้: ${incorrectTopics.join(', ')} ควรกลับไปทบทวนเนื้อหาในหัวข้อการแก้สมการและการแปลงโจทย์ปัญหาใหม่อีกรอบ`;
        }

        resultsSection.scrollIntoView({ behavior: 'smooth' });
    }

    function resetExam() {
        if (confirm('คุณต้องการรีเซ็ตคำตอบทั้งหมดและสลับตัวเลือกใหม่ใช่หรือไม่?')) {
            localStorage.removeItem('userAnswers');
            localStorage.removeItem('answeredStatus');
            userAnswers = {};
            answeredStatus = {};
            questionsData.forEach(q => q.shuffledOptions = null);
            document.getElementById('results-section').style.display = 'none';
            renderExam();
        }
    }

    // Whiteboard Script
    const canvas = document.getElementById('wb-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let isErasing = false;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 40;
        canvas.height = 350;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    function startDraw(e) {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
    }

    function draw(e) {
        if (!isDrawing) return;
        ctx.lineWidth = isErasing ? 20 : 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = isErasing ? '#ffffff' : '#1e293b';
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
    }

    function stopDraw() {
        isDrawing = false;
    }

    function clearWhiteboard() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function toggleEraser() {
        isErasing = !isErasing;
        let btn = document.getElementById('eraser-btn');
        btn.style.background = isErasing ? '#dc2626' : '#64748b';
        btn.innerText = isErasing ? 'กำลังใช้ยางลบ' : 'ยางลบ';
    }

    window.onload = function() {
        let savedAnswers = localStorage.getItem('userAnswers');
        let savedStatus = localStorage.getItem('answeredStatus');
        if (savedAnswers) {
            userAnswers = JSON.parse(savedAnswers);
        }
        if (savedStatus) {
            answeredStatus = JSON.parse(savedStatus);
        }
        renderExam();
    };
</script>
