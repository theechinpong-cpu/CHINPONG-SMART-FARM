                "การคัดลอกผลงานของจิตรกรชื่อดังให้เหมือนเป๊ะทุกประการ",
                "การวาดภาพให้เสร็จภายในเวลาที่กำหนดโดยไม่ต้องแก้ไข"
            ],
            ans: 0,
            clue: "ศิลปะเกิดจากความคิดและฝีมือการฝึกฝน",
            exp: "ถูกต้อง! ศิลปะต้องอาศัยจินตนาการ ความคิดสร้างสรรค์ และการหมั่นฝึกฝนทักษะปฏิบัติอยู่เป็นประจำ"
        }
    ];

    // ฟังก์ชันสลับตัวเลือกแบบ Fisher-Yates Shuffle
    function shuffleOptions() {
        questions.forEach(q => {
            let correctText = q.options[q.ans];
            for (let i = q.options.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
            }
            q.ans = q.options.indexOf(correctText);
        });
    }

    let userAnswers = {};

    function renderExam() {
        shuffleOptions();
        const container = document.getElementById('exam-container');
        let html = '';
        questions.forEach((q, idx) => {
            html += `
                <div class="question-card" id="q-card-${idx}">
                    <strong>ข้อที่ ${q.n}: ${q.q}</strong>
                    <div class="options" style="margin-top: 10px;">
            `;
            q.options.forEach((opt, optIdx) => {
                let checked = (userAnswers[idx] === optIdx) ? 'checked' : '';
                html += `
                    <label onclick="checkAnswer(${idx}, ${optIdx})">
                        <input type="radio" name="question_${idx}" value="${optIdx}" ${checked}> ${String.fromCharCode(65 + optIdx)}. ${opt}
                    </label>
                `;
            });
            html += `
                    </div>
                    <button class="btn" style="margin-top: 10px; background: #95a5a6; font-size: 0.85em;" onclick="toggleClue(${idx})">💡 เปิด/ปิด คำใบ้</button>
                    <div class="clue-box" id="clue-${idx}">คำใบ้: ${q.clue}</div>
                    <div class="explanation" id="exp-${idx}"></div>
                </div>
            `;
        });
        container.innerHTML = html;

        // แสดงผลลัพธ์ค้างไว้หากเคยตอบแล้ว
        Object.keys(userAnswers).forEach(idx => {
            showAnswerState(parseInt(idx), userAnswers[idx]);
        });
    }

    function toggleClue(idx) {
        const clueEl = document.getElementById(`clue-${idx}`);
        clueEl.style.display = clueEl.style.display === 'block' ? 'none' : 'block';
    }

    function checkAnswer(qIdx, selectedOpt) {
        userAnswers[qIdx] = selectedOpt;
        showAnswerState(qIdx, selectedOpt);
        saveState();
    }

    function showAnswerState(qIdx, selectedOpt) {
        const q = questions[qIdx];
        const expDiv = document.getElementById(`exp-${qIdx}`);
        expDiv.style.display = 'block';

        if (selectedOpt === q.ans) {
            expDiv.className = 'explanation correct-exp';
            expDiv.innerHTML = `✅ ${q.exp}`;
        } else {
            expDiv.className = 'explanation incorrect-exp';
            expDiv.innerHTML = `❌ ยังไม่ถูกต้อง! ข้อที่ถูกคือตัวเลือก ${String.fromCharCode(65 + q.ans)}<br>${q.exp}`;
        }
    }

    function saveState() {
        localStorage.setItem('art_exam_p6_30', JSON.stringify(userAnswers));
    }

    function resetExam() {
        if (confirm("คุณต้องการรีเซ็ตคำตอบทั้งหมดและสลับข้อสอบใหม่ใช่หรือไม่?")) {
            localStorage.removeItem('art_exam_p6_30');
            userAnswers = {};
            renderExam();
        }
    }

    function submitExam() {
        let score = 0;
        let total = questions.length;
        let unanswered = 0;

        questions.forEach((q, idx) => {
            if (userAnswers[idx] === undefined) {
                unanswered++;
            } else if (userAnswers[idx] === q.ans) {
                score++;
            }
        });

        if (unanswered > 0) {
            alert(`คุณยังทำข้อสอบไม่ครบ เหลืออีก ${unanswered} ข้อ กรุณาทำให้ครบก่อนส่งครับ`);
            return;
        }

        let percent = (score / total) * 100;
        let analysis = "";
        if (percent >= 80) {
            analysis = "ยอดเยี่ยม! คุณมีความเข้าใจในเนื้อหาวิชาศิลปะ ป.6 เป็นอย่างดีเยี่ยม ทั้งเรื่องความสมดุล สีคู่ตรงข้าม และแสงเงา";
        } else if (percent >= 50) {
            analysis = "อยู่ในเกณฑ์ดี แต่ควรทบทวนเพิ่มเติมในเรื่องทฤษฎีสีคู่ตรงข้ามและการน้ำหนักแสงเงาของรูปทรง 3 มิติ";
        } else {
            analysis = "ควรกลับไปทบทวนเนื้อหาในบทเรียนหน่วยการเรียนรู้ที่ 1-3 ใหม่ทั้งหมด เพื่อเสริมสร้างความเข้าใจพื้นฐานทางทัศนศิลป์";
        }

        alert(`🎯 สรุปผลการประเมิน\nคะแนนที่คุณทำได้: ${score} / ${total} (${percent.toFixed(2)}%)\n\n📊 วิเคราะห์ผลการเรียนรู้:\n${analysis}`);
    }

    // Whiteboard Script
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth - 30;
        canvas.height = 300;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    canvas.addEventListener('mousedown', () => { painting = true; });
    canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
        if (!painting) return;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#2c3e50';

        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // โหลดข้อสอบตอนเปิดหน้าเว็บ
    window.onload = function() {
        let saved = localStorage.getItem('art_exam_p6_30');
        if (saved) {
            userAnswers = JSON.parse(saved);
        }
        renderExam();
    };
</script>

</body>
</html>
