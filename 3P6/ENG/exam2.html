<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบเข้า ม.1 วิชาภาษาอังกฤษ (Grammar 50% & Vocab 50%) - พระจอมเกล้าติวเตอร์</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header & Summary Section */
        .summary-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--primary);
        }

        .summary-card h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-lang {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-reset {
            background-color: #ef4444;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .summary-content {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 20px;
        }

        .summary-content h3 {
            color: var(--primary-dark);
            margin: 14px 0 6px 0;
        }

        .trick-box {
            background-color: #fffbeb;
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
        }

        .trick-box h4 {
            color: #b45309;
            margin-bottom: 8px;
        }

        /* Main Workspace Layout (70% : 30%) */
        .workspace {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .quiz-panel {
            flex: 7;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .whiteboard-panel {
            flex: 3;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 15px;
            height: fit-content;
        }

        /* Quiz UI Elements */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .q-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .q-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .q-clue {
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 15px;
            display: inline-block;
        }

        .q-clue span {
            font-weight: bold;
            color: var(--primary);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            text-align: left;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .opt-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: var(--primary);
        }

        .opt-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: 600;
        }

        .opt-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d;
        }

        .opt-btn:disabled {
            cursor: default;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #f8fafc;
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .tutor-tip {
            margin-top: 6px;
            font-weight: 600;
            color: #b45309;
        }

        /* Whiteboard */
        .wb-header {
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wb-canvas {
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            cursor: crosshair;
            width: 100%;
            height: 380px;
            touch-action: none;
        }

        .wb-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .wb-btn {
            padding: 4px 10px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        /* Result Section */
        .result-panel {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .result-panel h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-box {
            display: inline-block;
            background: #eff6ff;
            border: 2px solid var(--primary);
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .analysis-card {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .analysis-card.strength {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .analysis-card.weakness {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .analysis-card h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .strength h3 { color: #15803d; }
        .weakness h3 { color: #b91c1c; }

        .footer-tag {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 992px) {
            .workspace {
                flex-direction: column;
            }
            .whiteboard-panel {
                width: 100%;
                position: static;
            }
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Section 1: สรุปเนื้อหา + เทคนิคกระบวนการคิด (500+ คำ) -->
    <div class="summary-card">
        <h1>
            <span id="txt-title">คลังข้อสอบเข้มข้น ม.1 วิชาภาษาอังกฤษ (Grammar 50% & Vocab 50%) - มาตรฐาน รร.เบ็ญจมราชูทิศ</span>
            <div class="header-controls">
                <button class="btn btn-lang" onclick="toggleLanguage()" id="btn-lang-toggle">EN / TH</button>
                <button class="btn btn-reset" onclick="resetAllState()" id="txt-btn-reset">รีเซ็ตข้อสอบ</button>
            </div>
        </h1>

        <div class="summary-content" id="summary-text-block">
            <!-- Content rendered dynamically -->
        </div>

        <div class="trick-box" id="trick-box-block">
            <!-- Tricks rendered dynamically -->
        </div>
    </div>

    <!-- Section 2: พื้นที่สอบ 2 ฝั่ง (ข้อสอบ 70% + ไวท์บอร์ด 30%) -->
    <div class="workspace">
        <div class="quiz-panel">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="quiz-container">
                <!-- 30 Items Rendered Here -->
            </div>
            <button class="btn btn-lang" id="btn-submit-all" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 15px; display: none;" onclick="showFinalResult()">ดูผลคะแนนและบทวิเคราะห์</button>
        </div>

        <div class="whiteboard-panel">
            <div class="wb-header">
                <span id="txt-wb-title">กระดานทดข้อสอบ (Whiteboard)</span>
            </div>
            <canvas id="wb-canvas" class="wb-canvas"></canvas>
            <div class="wb-controls">
                <button class="wb-btn" onclick="setWbColor('#000000')">ดำ</button>
                <button class="wb-btn" onclick="setWbColor('#dc2626')">แดง</button>
                <button class="wb-btn" onclick="setWbColor('#1e3a8a')">น้ำเงิน</button>
                <button class="wb-btn" onclick="clearWhiteboard()" id="txt-wb-clear">ล้างกระดาน</button>
            </div>
        </div>
    </div>

    <!-- Section 3: สรุปผลและการวิเคราะห์จุดเด่น/จุดด้อย -->
    <div class="result-panel" id="result-panel">
        <h2 id="txt-res-title">ผลการประเมินและการวิเคราะห์สมรรถนะ</h2>
        <div class="score-box" id="score-display">0 / 30 คะแนน</div>
        
        <div class="analysis-grid">
            <div class="analysis-card strength">
                <h3 id="txt-str-title">จุดเด่นที่ทำได้ยอดเยี่ยม (Strengths)</h3>
                <ul id="strength-list" style="padding-left: 20px;"></ul>
            </div>
            <div class="analysis-card weakness">
                <h3 id="txt-weak-title">จุดที่ควรทบทวนและพัฒนา (Areas for Improvement)</h3>
                <ul id="weakness-list" style="padding-left: 20px;"></ul>
            </div>
        </div>
    </div>

    <div class="footer-tag" id="footer-text">
        เขียนโดย พระจอมเกล้าติวเตอร์
    </div>
</div>

<script>
// --- Database คลังข้อสอบวิชาภาษาอังกฤษ 30 ข้อ (Grammar & Structure 50% + Vocabulary & Idioms 50%) ---
const rawQuizData = [
    // === PART 1: GRAMMAR & STRUCTURE (ข้อ 1 - 15) ===
    {
        id: 1, category: "Grammar & Structure",
        q_th: "The team of dedicated researchers, together with their laboratory assistants, ______ working tirelessly to develop an effective vaccine.",
        q_en: "The team of dedicated researchers, together with their laboratory assistants, ______ working tirelessly to develop an effective vaccine.",
        clue_th: "ประธานหลักถูกคั่นด้วยวลี 'together with...' ให้ตัดส่วนขยายออก แล้วผันกริยาตามประธานตัวหน้าสุด 'The team' (เอกพจน์)",
        clue_en: "Parenthetical phrases like 'together with' do not change the number of the head subject ('The team').",

        exp_th: "ประธานแท้ของประโยคคือ 'The team' (Collective Noun ทำหน้าที่เป็นเอกพจน์หนึ่งหน่วย) วลี 'together with their laboratory assistants' เป็นเพียงส่วนขยายที่คั่นอยู่ ดังนั้นกริยาช่วยจึงต้องเป็นเอกพจน์ 'is'",
        exp_en: "The head subject is 'The team' (singular). Parenthetical additions ('together with...') do not affect subject-verb agreement.",
        tip: "สูตรลับพระจอมเกล้า: เจอกลุ่ม 'together with, along with, as well as, including' ให้ตัดทิ้ง แล้วผันกริยาตามตัวหน้าสุดเสมอ!"
    },
    {
        id: 2, category: "Grammar & Structure",
        q_th: "Hardly had the chemistry experiment begun ______ an unexpected pungent odor filled the entire laboratory room.",
        q_en: "Hardly had the chemistry experiment begun ______ an unexpected pungent odor filled the entire laboratory room.",
        clue_th: "Correlative Inversion: 'Hardly had + S + V.3 ... when + S + V.2' (ทันทีที่...ก็...)",
        clue_en: "Fixed Correlative Pair: 'Hardly' strictly pairs with 'when' (not 'than' or 'then').",

        exp_en: "'Hardly had + S + V.3' strictly pairs with 'when' to introduce the subsequent past event.",
        tip: "จำคู่ห้ามหลุด: 'Hardly คู่ When' | 'No sooner คู่ Than'"
    },
    {
        id: 3, category: "Grammar & Structure",
        q_th: "The principal strongly recommended that each student ______ a scientific calculator for the national examination.",
        q_en: "The principal strongly recommended that each student ______ a scientific calculator for the national examination.",
        clue_th: "Subjunctive Mood: กริยาแสดงการแนะนำ (recommend that + S) ต้องตามด้วย Bare Infinitive (V.0 ไม่ผัน) เสมอ",
        clue_en: "Mandative Subjunctive: 'recommend that + S' requires a base form verb (V.0) without tense or agreement inflections.",
        options_th: ["bring", "brings", "brought", "is bringing"],

        exp_th: "Subjunctive Mood: เมื่อพบกริยา recommend, suggest, insist, demand, request ตามด้วย that-clause กริยาในประโยคย่อยต้องเป็น V.infinitive (V.0) เสมอ แม้ประธานจะเป็น 'each student' (เอกพจน์) ก็ห้ามเติม s",
        exp_en: "Subjunctive mandative clause requires bare infinitive ('bring') irrespective of the singular subject.",

    {
        id: 4, category: "Grammar & Structure",

        clue_en: "Mixed Conditional: Past unreal condition affecting present reality ('today').",

// --- Fisher-Yates Shuffle Algorithm ---
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

    if (savedLang) currentLang = savedLang;

    renderSummarySection();

    if (savedState) {
        try {
            const parsed = JSON.parse(savedState);
            randomizedQuestions = parsed.questions;
            userAnswers = parsed.answers || {};
        } catch (e) {
            setupFreshQuiz();
        }
    } else {

    checkIfAllAnswered();
    initWhiteboard();
}

function setupFreshQuiz() {
    let shuffledQ = shuffleArray(rawQuizData);
    randomizedQuestions = shuffledQ.map(q => {
        let indices = [0, 1, 2, 3];

        return {
            ...q,
            shuffledIndices: shuffledIndices
        };
    });
    userAnswers = {};
    saveState();
}

function renderQuizCards() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    randomizedQuestions.forEach((item, qIdx) => {
        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        qCard.id = `question-card-${qIdx}`;

        const isAnswered = userAnswers.hasOwnProperty(qIdx);
        const selectedOptIdx = isAnswered ? userAnswers[qIdx] : null;

        const qTitle = currentLang === 'th' ? item.q_th : item.q_en;
        const qClue = currentLang === 'th' ? item.clue_th : item.clue_en;
        const clueLabel = currentLang === 'th' ? '💡 คำใบ้ (Clue): ' : '💡 Clue: ';
        const catLabel = item.category;

        let optionsHtml = '';
        item.shuffledIndices.forEach((origIdx, posIdx) => {
            const optText = currentLang === 'th' ? item.options_th[origIdx] : item.options_en[origIdx];
            let optClass = 'opt-btn';
            
            if (isAnswered) {
                if (origIdx === item.correct) {
                    optClass += ' correct';
                } else if (origIdx === selectedOptIdx) {
                    optClass += ' incorrect';
                }
            }

            optionsHtml += `
                <button class="${optClass}" 
                        onclick="handleSelectOption(${qIdx}, ${origIdx})" 
                        ${isAnswered ? 'disabled' : ''}>
                    ${String.fromCharCode(65 + posIdx)}. ${optText}
                </button>
            `;
        });

        const expText = currentLang === 'th' ? item.exp_th : item.exp_en;
        const tutorNote = currentLang === 'th' ? '✨ เทคนิคลัดพระจอมเกล้าติวเตอร์: ' : '✨ Tutor Secret Technique: ';

        qCard.innerHTML = `
            <div class="q-header">
                <span>ข้อที่ ${qIdx + 1} / 30</span>
                <span>สาระ: ${catLabel}</span>
            </div>
            <div class="q-title">${qIdx + 1}. ${qTitle}</div>
            <div class="q-clue"><span>${clueLabel}</span>${qClue}</div>
            <div class="options-list">${optionsHtml}</div>
            <div class="explanation" id="exp-${qIdx}" style="display: ${isAnswered ? 'block' : 'none'};">
                <div><b>${currentLang === 'th' ? 'คำอธิบายเชิงลึก:' : 'Detailed Explanation:'}</b><br>${expText.replace(/\n/g, '<br>')}</div>
                <div class="tutor-tip">${tutorNote}${item.tip}</div>
            </div>
        `;

        container.appendChild(qCard);
    });
}

function handleSelectOption(qIdx, selectedOrigIdx) {
    if (userAnswers.hasOwnProperty(qIdx)) return;

    userAnswers[qIdx] = selectedOrigIdx;
    saveState();

    const item = randomizedQuestions[qIdx];
    const qCard = document.getElementById(`question-card-${qIdx}`);
    const buttons = qCard.querySelectorAll('.opt-btn');

    item.shuffledIndices.forEach((origIdx, posIdx) => {
        const btn = buttons[posIdx];
        btn.disabled = true;
        if (origIdx === item.correct) {
            btn.classList.add('correct');
        } else if (origIdx === selectedOrigIdx) {
            btn.classList.add('incorrect');
        }
    });

    const expBox = document.getElementById(`exp-${qIdx}`);
    expBox.style.display = 'block';

    updateProgress();
    checkIfAllAnswered();
}

function updateProgress() {
    const answeredCount = Object.keys(userAnswers).length;
    const pct = (answeredCount / randomizedQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${pct}%`;
}

    const answered = Object.keys(userAnswers).length;
    const submitBtn = document.getElementById('btn-submit-all');
    if (answered === total && total > 0) {
        submitBtn.style.display = 'block';
    } else {
        submitBtn.style.display = 'none';
    }
}

function toggleLanguage() {
    currentLang = currentLang === 'th' ? 'en' : 'th';
    localStorage.setItem('tutor_eng_gv_m1_lang', currentLang);
    renderSummarySection();
    renderQuizCards();
    if (Object.keys(userAnswers).length === randomizedQuestions.length) {
        showFinalResult();
    }
}

// --- Assessment & Diagnostic System ---
function showFinalResult() {
    const resultPanel = document.getElementById('result-panel');
    resultPanel.style.display = 'block';

    let totalScore = 0;
    let categoryStats = {
        "Grammar & Structure": { total: 0, correct: 0 },
        "Vocabulary & Idioms": { total: 0, correct: 0 }
    };

    randomizedQuestions.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const cat = q.category;
        if (categoryStats[cat]) {
            categoryStats[cat].total += 1;
            if (userChoice === q.correct) {
                categoryStats[cat].correct += 1;
                totalScore += 1;
            }
        }
    });

    document.getElementById('score-display').innerText = `${totalScore} / ${randomizedQuestions.length} คะแนน (${Math.round((totalScore / randomizedQuestions.length) * 100)}%)`;

    const strengthList = document.getElementById('strength-list');
    const weaknessList = document.getElementById('weakness-list');
    strengthList.innerHTML = '';
    weaknessList.innerHTML = '';

    for (const [catName, stat] of Object.entries(categoryStats)) {
        const percentage = (stat.correct / stat.total) * 100;
        const li = document.createElement('li');
        li.style.marginBottom = '8px';

        if (percentage >= 70) {
            li.innerHTML = `<b>${catName}:</b> ทำได้ ${stat.correct}/${stat.total} ข้อ (${Math.round(percentage)}%) - มีทักษะและความแม่นยำในระดับดีเยี่ยม พร้อมสำหรับข้อสอบระดับยาก`;
            strengthList.appendChild(li);
        } else {
            let advice = "";
            if (catName === "Grammar & Structure") {
                advice = "ควรเน้นทบทวน Subject-Verb Agreement (The number of / Together with), Subjunctive Mood, Negative Inversion, Reduced Participles และ Mixed Conditionals";
            } else if (catName === "Vocabulary & Idioms") {
                advice = "ควรฝึกวิเคราะห์ Context Clues, ท่องจำรากศัพท์ Prefix/Suffix (un-, in-, ir-), กลุ่มศัพท์ Synonyms/Antonyms และสำนวนเปรียบเทียบ (Idioms)";
            }

            li.innerHTML = `<b>${catName}:</b> ได้คะแนน ${stat.correct}/${stat.total} ข้อ (${Math.round(percentage)}%) - <i>คำแนะนำเพิ่มเติม:</i> ${advice}`;
            weaknessList.appendChild(li);
        }
    }

    if (strengthList.children.length === 0) {
        strengthList.innerHTML = "<li>ควรเพิ่มการฝึกฝนและทำความเข้าใจไวยากรณ์และศัพท์พื้นฐานเพิ่มเติม เพื่อเตรียมความพร้อมสำหรับสนามสอบแข่งขัน</li>";
    }
    if (weaknessList.children.length === 0) {
        weaknessList.innerHTML = "<li>ยอดเยี่ยมมาก! คุณมีพื้นฐานโครงสร้างไวยากรณ์และคลังคำศัพท์ที่แข็งแกร่ง ปราศจากจุดอ่อน พร้อมสอบติดโรงเรียนเบ็ญจมราชูทิศแน่นอน</li>";
    }

    resultPanel.scrollIntoView({ behavior: 'smooth' });
}

// --- Professional Whiteboard Implementation ---
let wbCanvas, wbCtx;
let isDrawing = false;
let wbColor = '#000000';

function initWhiteboard() {
    wbCanvas = document.getElementById('wb-canvas');
    wbCtx = wbCanvas.getContext('2d');

    function resizeCanvas() {
        const rect = wbCanvas.getBoundingClientRect();
        wbCanvas.width = rect.width;
        wbCanvas.height = rect.height;
        wbCtx.lineCap = 'round';
        wbCtx.lineJoin = 'round';
        wbCtx.lineWidth = 2.5;
        wbCtx.strokeStyle = wbColor;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Mouse Events
    wbCanvas.addEventListener('mousedown', startDrawing);
    wbCanvas.addEventListener('mousemove', draw);
    wbCanvas.addEventListener('mouseup', stopDrawing);
    wbCanvas.addEventListener('mouseout', stopDrawing);

    // Touch Events for Mobile / Tablet
    wbCanvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = wbCanvas.getBoundingClientRect();
        isDrawing = true;
        wbCtx.beginPath();
        wbCtx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    });

    wbCanvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isDrawing) return;
        const touch = e.touches[0];
        const rect = wbCanvas.getBoundingClientRect();
        wbCtx.strokeStyle = wbColor;
        wbCtx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        wbCtx.stroke();
    });

    wbCanvas.addEventListener('touchend', stopDrawing);
}

function startDrawing(e) {
    isDrawing = true;
    wbCtx.beginPath();
    wbCtx.moveTo(e.offsetX, e.offsetY);
}

function draw(e) {
    if (!isDrawing) return;
    wbCtx.strokeStyle = wbColor;
    wbCtx.lineTo(e.offsetX, e.offsetY);
    wbCtx.stroke();
}

function stopDrawing() {
    if (isDrawing) {
        wbCtx.closePath();
        isDrawing = false;
    }
}

function setWbColor(color) {
    wbColor = color;
}

function clearWhiteboard() {
    if (wbCtx && wbCanvas) {
        wbCtx.clearRect(0, 0, 0, wbCanvas.width, wbCanvas.height);
    }
}

// Start app
window.addEventListener('DOMContentLoaded', initQuiz);
