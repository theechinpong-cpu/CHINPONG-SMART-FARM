<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบเข้า ม.1 วิชาสังคมศึกษา - พระจอมเกล้าติวเตอร์</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header & Summary Section */
        .summary-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-top: 5px solid var(--primary);
        }

        .summary-card h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-lang {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-reset {
            background-color: #ef4444;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .summary-content {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 20px;
        }

        .summary-content h3 {
            color: var(--primary-dark);
            margin: 12px 0 6px 0;
        }

        .trick-box {
            background-color: #fffbeb;
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
        }

        .trick-box h4 {
            color: #b45309;
            margin-bottom: 8px;
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .quiz-panel {
            flex: 7;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .whiteboard-panel {
            flex: 3;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 15px;
            height: fit-content;
        }

        /* Quiz UI Elements */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .q-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .q-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        .q-clue {
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 15px;
            display: inline-block;
        }

        .q-clue span {
            font-weight: bold;
            color: var(--primary);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            text-align: left;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .opt-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: var(--primary);
        }

        .opt-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: 600;
        }

        .opt-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d;
        }

        .opt-btn:disabled {
            cursor: default;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #f8fafc;
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .tutor-tip {
            margin-top: 6px;
            font-weight: 600;
            color: #b45309;
        }

        /* Whiteboard */
        .wb-header {
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wb-canvas {
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            cursor: crosshair;
            width: 100%;
            height: 380px;
            touch-action: none;
        }

        .wb-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .wb-btn {
            padding: 4px 10px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        /* Result Section */
        .result-panel {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .result-panel h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-box {
            display: inline-block;
            background: #eff6ff;
            border: 2px solid var(--primary);
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .analysis-card {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .analysis-card.strength {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .analysis-card.weakness {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .analysis-card h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .strength h3 { color: #15803d; }
        .weakness h3 { color: #b91c1c; }

        .footer-tag {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-weight: 700;
            color: var(--primary);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 992px) {
            .workspace {
                flex-direction: column;
            }
            .whiteboard-panel {
                width: 100%;
                position: static;
            }
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Section 1: สรุปเนื้อหา + เทคนิคกระบวนการคิด -->
    <div class="summary-card">
        <h1>
            <span id="txt-title">คลังข้อสอบเข้มข้น ม.1 วิชาสังคมศึกษา (มาตรฐาน รร.เบ็ญจมราชูทิศ)</span>
            <div class="header-controls">
                <button class="btn btn-lang" onclick="toggleLanguage()" id="btn-lang-toggle">EN / TH</button>
                <button class="btn btn-reset" onclick="resetAllState()" id="txt-btn-reset">รีเซ็ตข้อสอบ</button>
            </div>
        </h1>

        <div class="summary-content" id="summary-text-block">
            <!-- Content will be rendered dynamically by language -->
        </div>

        <div class="trick-box" id="trick-box-block">
            <!-- Trick Box will be rendered dynamically -->
        </div>
    </div>

    <!-- Section 2: พื้นที่สอบ 2 ฝั่ง (ข้อสอบ 70% + ไวท์บอร์ด 30%) -->
    <div class="workspace">
        <div class="quiz-panel">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="quiz-container">
                <!-- 50 Items Rendered Here -->
            </div>
            <button class="btn btn-lang" id="btn-submit-all" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 15px; display: none;" onclick="showFinalResult()">ดูผลคะแนนและบทวิเคราะห์</button>
        </div>

        <div class="whiteboard-panel">
            <div class="wb-header">
                <span id="txt-wb-title">กระดานทดข้อสอบ (Whiteboard)</span>
            </div>
            <canvas id="wb-canvas" class="wb-canvas"></canvas>
            <div class="wb-controls">
                <button class="wb-btn" onclick="setWbColor('#000000')">ดำ</button>
                <button class="wb-btn" onclick="setWbColor('#dc2626')">แดง</button>
                <button class="wb-btn" onclick="setWbColor('#1e3a8a')">น้ำเงิน</button>
                <button class="wb-btn" onclick="clearWhiteboard()" id="txt-wb-clear">ล้างกระดาน</button>
            </div>
        </div>
    </div>

    <!-- Section 3: สรุปผลและการวิเคราะห์จุดเด่น/จุดด้อย -->
    <div class="result-panel" id="result-panel">
        <h2 id="txt-res-title">ผลการประเมินและการวิเคราะห์สมรรถนะ</h2>
        <div class="score-box" id="score-display">0 / 50 คะแนน</div>
        
        <div class="analysis-grid">
            <div class="analysis-card strength">
                <h3 id="txt-str-title">จุดเด่นที่ทำได้ยอดเยี่ยม (Strengths)</h3>
                <ul id="strength-list" style="padding-left: 20px;"></ul>
            </div>
            <div class="analysis-card weakness">
                <h3 id="txt-weak-title">จุดที่ควรทบทวนและพัฒนา (Areas for Improvement)</h3>
                <ul id="weakness-list" style="padding-left: 20px;"></ul>
            </div>
        </div>
    </div>

    <div class="footer-tag" id="footer-text">
        เขียนโดย พระจอมเกล้าติวเตอร์
    </div>
</div>

            <p>ต้นตอของปัญหาเศรษฐศาสตร์คือ <b>ความขาดแคลน (Scarcity)</b> ทรัพยากรมีจำกัดแต่ความต้องการมนุษย์มีไม่จำกัด จึงต้องตอบคำถาม <i>ผลิตอะไร (What) ผลิตอย่างไร (How) ผลิตเพื่อใคร (For whom)</i> จนเกิด <b>ต้นทุนค่าเสียโอกาส (Opportunity Cost)</b> กลไกราคา: กฎอุปสงค์ (ราคาผกผันกับปริมาณซื้อ) กฎอุปทาน (ราคาแปรผันตรงกับปริมาณขาย) ดุลยภาพตลาดเกิดขึ้นเมื่อ อุปสงค์ = อุปทาน การแก้วิกฤตเงินเฟ้อ (ขึ้นดอกเบี้ย/ดูดเงินกลับ) เงินฝืด (ลดดอกเบี้ย/ฉีดสภาพคล่อง) เกษตรทฤษฎีใหม่จัดสรรที่ดิน 30:30:30:10 และการรวมกลุ่มสหกรณ์ที่ยึดหลัก 1 คน 1 เสียง</p>

            <h3>4. สาระประวัติศาสตร์ (History)</h3>
            <p>เกณฑ์แบ่งยุคก่อนประวัติศาสตร์กับยุคประวัติศาสตร์คือ <b>การประดิษฐ์ตัวอักษร</b> หลักฐานชั้นต้น (ร่วมสมัย) กับชั้นรอง (วิเคราะห์ย้อนหลัง) ประวัติศาสตร์อยุธยา: สมเด็จพระบรมไตรโลกนาถปฏิรูปการปกครองแยกทหาร (สมุหกลาโหม) และพลเรือน (สมุหนายก) พร้อมตราศักดินา ยุครัตนโกสินทร์: รัชกาลที่ 1 สงครามเก้าทัพ, รัชกาลที่ 4 สนธิสัญญาเบาว์ริง (การค้าเสรี ข้าวเป็นสินค้าออก ภาษี 3% เสียสิทธิสภาพนอกอาณาเขต), รัชกาลที่ 5 เลิกทาสและปฏิรูประบบราชการมณฑลเทศาภิบาลอย่างสันติ, การปฏิวัติ 24 มิถุนายน 2475 สู่ระบอบประชาธิปไตย</p>

            <h3>5. สาระภูมิศาสตร์ (Geography)</h3>
            <p>พิกัดภูมิศาสตร์: ละติจูด (แนวนอน บอกเขตอากาศ ร้อน-อบอุ่น-หนาว), ลองจิจูด (แนวตั้ง บอกเวลา ห่างกัน 15° = 1 ชม. โดยไทยใช้ 105°E = UTC+7) การคำนวณมาตราส่วนแผนที่ (ระยะจริง = ระยะในแผนที่ × ตัวส่วนมาตราส่วน) ลมมรสุมตะวันตกเฉียงใต้ (ฤดูฝน) ลมมรสุมตะวันออกเฉียงเหนือ (ฤดูหนาวแห้งแล้ง) ปรากฏการณ์เอลนีโญ (แล้ง) ลานีญา (น้ำมากฝนหนัก) ธรณีสัณฐานแบบคาสต์ในหินปูน และเทคโนโลยีภูมิสารสนเทศ (GPS ระบุพิกัด, Remote Sensing ถ่ายภาพดาวเทียม, GIS ซ้อนชั้นข้อมูลวิเคราะห์)</p>
        `,
        trick: `
            <h4>💡 สูตรลัดกระบวนการคิดจาก พระจอมเกล้าติวเตอร์:</h4>
            <ul>
                <li><b>ศาสนา:</b> จำคู่ 'มาฆะ=หัวใจพุทธ/3' | 'วิสาขะ=สากลโลก/6' | 'อาสาฬหะ=พระสงฆ์องค์แรก/8'</li>
                <li><b>หน้าที่พลเมือง:</b> กฎหมายแม่บท = รัฐธรรมนูญ | ฝ่ายบริหารออกเอง = พ.ร.ฎีกา/กฎกระทรวง | ท้องถิ่นพิเศษมีแค่ 2 ที่ = กทม.+พัทยา</li>
                <li><b>เศรษฐศาสตร์:</b> 'อุปสงค์ คนซื้อ ดีมานด์ผกผัน' vs 'อุปทาน คนขาย ซัพพลายแปรตาม' | 'เฟ้อดอกขึ้น ฝืดดอกลง'</li>
                <li><b>ประวัติศาสตร์:</b> ยุคประวัติศาสตร์เริ่มเมื่อ 'มีตัวหนังสือ' | สนธิสัญญาเบาว์ริง = 'ร้อยชักสาม + ค้าเสรี + ศาลกงสุล'</li>
                <li><b>ภูมิศาสตร์:</b> ลองจิจูด 15 องศา = 1 ชั่วโมง | ตัดศูนย์ 5 ตัว แปลง ซม. เป็น กิโลเมตร | เอล(แล้ง) - ลา(ล้น)</li>

// --- Fisher-Yates Shuffle Algorithm ---
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// --- Initialization & LocalStorage Management ---
function initQuiz() {
    const savedState = localStorage.getItem('tutor_m1_quiz_state_50');
    const savedLang = localStorage.getItem('tutor_m1_quiz_lang');
    if (savedLang) currentLang = savedLang;

    renderSummarySection();

    if (savedState) {
        try {
            const parsed = JSON.parse(savedState);
            randomizedQuestions = parsed.questions;
            userAnswers = parsed.answers || {};
        } catch (e) {
            setupFreshQuiz();
        }
    } else {
        setupFreshQuiz();
    }

    renderQuizCards();
    updateProgress();
    checkIfAllAnswered();
    initWhiteboard();
}

function setupFreshQuiz() {
    // Randomize questions
    let shuffledQ = shuffleArray(rawQuizData);
    // For each question, randomize its options as well
    randomizedQuestions = shuffledQ.map(q => {
        let indices = [0, 1, 2, 3];
        let shuffledIndices = shuffleArray(indices);
        return {
            ...q,
            shuffledIndices: shuffledIndices // mapping of new position to original option index
        };
    });
    userAnswers = {};
    saveState();
}

function saveState() {
    const stateObj = {
        questions: randomizedQuestions,
        answers: userAnswers
    };
    localStorage.setItem('tutor_m1_quiz_state_50', JSON.stringify(stateObj));
    localStorage.setItem('tutor_m1_quiz_lang', currentLang);
}

function resetAllState() {
    if (confirm(currentLang === 'th' ? "คุณต้องการรีเซ็ตข้อสอบและทำใหม่ทั้งหมดใช่หรือไม่?" : "Do you want to reset all progress and retake the exam?")) {
        localStorage.removeItem('tutor_m1_quiz_state_50');
        document.getElementById('result-panel').style.display = 'none';
        document.getElementById('btn-submit-all').style.display = 'none';
        setupFreshQuiz();

}

function renderQuizCards() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    randomizedQuestions.forEach((item, qIdx) => {
        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        qCard.id = `question-card-${qIdx}`;

        const isAnswered = userAnswers.hasOwnProperty(qIdx);
        const selectedOptIdx = isAnswered ? userAnswers[qIdx] : null;

        const qTitle = currentLang === 'th' ? item.q_th : item.q_en;
        const qClue = currentLang === 'th' ? item.clue_th : item.clue_en;
        const clueLabel = currentLang === 'th' ? '💡 คำใบ้ (Clue): ' : '💡 Clue: ';
        const catLabel = item.category;

        let optionsHtml = '';
        item.shuffledIndices.forEach((origIdx, posIdx) => {
            const optText = currentLang === 'th' ? item.options_th[origIdx] : item.options_en[origIdx];
            let optClass = 'opt-btn';
            
            if (isAnswered) {
                if (origIdx === item.correct) {
                    optClass += ' correct';
                } else if (origIdx === selectedOptIdx) {
                    optClass += ' incorrect';
                }
            }

            optionsHtml += `
                <button class="${optClass}" 
                        onclick="handleSelectOption(${qIdx}, ${origIdx})" 
                        ${isAnswered ? 'disabled' : ''}>
                    ${String.fromCharCode(65 + posIdx)}. ${optText}
                </button>
            `;
        });

        const expText = currentLang === 'th' ? item.exp_th : item.exp_en;
        const tutorNote = currentLang === 'th' ? '✨ เทคนิคลัดพระจอมเกล้าติวเตอร์: ' : '✨ Tutor Secret Technique: ';

        qCard.innerHTML = `
            <div class="q-header">
                <span>ข้อที่ ${qIdx + 1} / 50</span>
                <span>สาระ: ${catLabel}</span>
            </div>
            <div class="q-title">${qIdx + 1}. ${qTitle}</div>
            <div class="q-clue"><span>${clueLabel}</span>${qClue}</div>
            <div class="options-list">${optionsHtml}</div>
            <div class="explanation" id="exp-${qIdx}" style="display: ${isAnswered ? 'block' : 'none'};">
                <div><b>${currentLang === 'th' ? 'คำอธิบายเชิงลึก:' : 'Detailed Explanation:'}</b> ${expText}</div>
                <div class="tutor-tip">${tutorNote}${item.tip}</div>
            </div>
        `;

        container.appendChild(qCard);
    });
}

function handleSelectOption(qIdx, selectedOrigIdx) {
    if (userAnswers.hasOwnProperty(qIdx)) return;

    userAnswers[qIdx] = selectedOrigIdx;
    saveState();

    // Re-render specific question for instantaneous visual feedback
    const item = randomizedQuestions[qIdx];
    const qCard = document.getElementById(`question-card-${qIdx}`);
    const buttons = qCard.querySelectorAll('.opt-btn');

    item.shuffledIndices.forEach((origIdx, posIdx) => {
        const btn = buttons[posIdx];
        btn.disabled = true;
        if (origIdx === item.correct) {
            btn.classList.add('correct');
        } else if (origIdx === selectedOrigIdx) {
            btn.classList.add('incorrect');
        }
    });

    const expBox = document.getElementById(`exp-${qIdx}`);
    expBox.style.display = 'block';

    updateProgress();
    checkIfAllAnswered();
}

function updateProgress() {
    const answeredCount = Object.keys(userAnswers).length;
    const pct = (answeredCount / randomizedQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${pct}%`;
}

function checkIfAllAnswered() {
    const total = randomizedQuestions.length;
    const answered = Object.keys(userAnswers).length;
    const submitBtn = document.getElementById('btn-submit-all');
    if (answered === total && total > 0) {
        submitBtn.style.display = 'block';
    } else {
        submitBtn.style.display = 'none';
    }
}

function toggleLanguage() {
    currentLang = currentLang === 'th' ? 'en' : 'th';
    localStorage.setItem('tutor_m1_quiz_lang', currentLang);
    renderSummarySection();
    renderQuizCards();
    if (Object.keys(userAnswers).length === randomizedQuestions.length) {

    }
}

// --- Assessment & Analytics Logic ---
function showFinalResult() {
    const resultPanel = document.getElementById('result-panel');
    resultPanel.style.display = 'block';

    let totalScore = 0;
    let categoryStats = {
        "ศาสนา": { total: 0, correct: 0 },
        "หน้าที่พลเมือง": { total: 0, correct: 0 },
        "เศรษฐศาสตร์": { total: 0, correct: 0 },
        "ประวัติศาสตร์": { total: 0, correct: 0 },
        "ภูมิศาสตร์": { total: 0, correct: 0 }
    };

    randomizedQuestions.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const cat = q.category;
        if (categoryStats[cat]) {
            categoryStats[cat].total += 1;
            if (userChoice === q.correct) {
                categoryStats[cat].correct += 1;
                totalScore += 1;
            }
        }
    });

    document.getElementById('score-display').innerText = `${totalScore} / ${randomizedQuestions.length} คะแนน (${Math.round((totalScore / randomizedQuestions.length) * 100)}%)`;

    const strengthList = document.getElementById('strength-list');
    const weaknessList = document.getElementById('weakness-list');
    strengthList.innerHTML = '';
    weaknessList.innerHTML = '';

    for (const [catName, stat] of Object.entries(categoryStats)) {
        const percentage = (stat.correct / stat.total) * 100;
        const li = document.createElement('li');
        li.style.marginBottom = '8px';

        if (percentage >= 70) {
            li.innerHTML = `<b>${catName}:</b> ทำได้ ${stat.correct}/${stat.total} ข้อ (${Math.round(percentage)}%) - มีความเข้าใจระดับยอดเยี่ยม สามารถคิดวิเคราะห์เชื่อมโยงได้แม่นยำ`;
            strengthList.appendChild(li);
        } else {
            let advice = "";
            if (catName === "ศาสนา") advice = "ควรทบทวนพุทธประวัติ วันสำคัญทางศาสนา และการเปรียบเทียบหลักธรรม";
            else if (catName === "หน้าที่พลเมือง") advice = "ควรเน้นลำดับศักดิ์กฎหมาย สิทธิเด็ก และโครงสร้างองค์กรตามรัฐธรรมนูญ";
            else if (catName === "เศรษฐศาสตร์") advice = "ควรทำความเข้าใจกราฟกลไกราคา นโยบายการเงินแก้เงินเฟ้อ/ฝืด และสัดส่วนเกษตรทฤษฎีใหม่";
            else if (catName === "ประวัติศาสตร์") advice = "ควรฝึกเรียงลำดับเวลา การปฏิรูป ร.5 และผลกระทบของสนธิสัญญาเบาว์ริง";
            else if (catName === "ภูมิศาสตร์") advice = "ควรทบทวนการคำนวณเวลาลองจิจูด มาตราส่วนแผนที่ และระบบสารสนเทศภูมิศาสตร์ GIS";

            li.innerHTML = `<b>${catName}:</b> ได้คะแนน ${stat.correct}/${stat.total} ข้อ (${Math.round(percentage)}%) - <i>คำแนะนำ:</i> ${advice}`;
            weaknessList.appendChild(li);
        }
    }

    if (strengthList.children.length === 0) {
        strengthList.innerHTML = "<li>ควรเพิ่มความรอบคอบและฝึกทำข้อสอบซ้ำอีกรอบเพื่อสร้างความมั่นใจ</li>";
    }
    if (weaknessList.children.length === 0) {
        weaknessList.innerHTML = "<li>ยินดีด้วย! คุณมีพื้นฐานความรู้สังคมศึกษายอดเยี่ยมครบทุกสาระ พร้อมสำหรับสนามสอบแข่งขันแล้ว</li>";
    }

    resultPanel.scrollIntoView({ behavior: 'smooth' });
}

// --- Professional Whiteboard Implementation ---
let wbCanvas, wbCtx;
let isDrawing = false;
let wbColor = '#000000';

function initWhiteboard() {
    wbCanvas = document.getElementById('wb-canvas');
    wbCtx = wbCanvas.getContext('2d');

    // Resize canvas based on client display
    function resizeCanvas() {
        const rect = wbCanvas.getBoundingClientRect();
        wbCanvas.width = rect.width;
        wbCanvas.height = rect.height;
        wbCtx.lineCap = 'round';
        wbCtx.lineJoin = 'round';
        wbCtx.lineWidth = 2.5;
        wbCtx.strokeStyle = wbColor;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Mouse Events
    wbCanvas.addEventListener('mousedown', startDrawing);
    wbCanvas.addEventListener('mousemove', draw);
    wbCanvas.addEventListener('mouseup', stopDrawing);
    wbCanvas.addEventListener('mouseout', stopDrawing);

    // Touch Events for Tablets/Mobiles
    wbCanvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = wbCanvas.getBoundingClientRect();
        isDrawing = true;
        wbCtx.beginPath();
        wbCtx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    });

    wbCanvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isDrawing) return;
        const touch = e.touches[0];
        const rect = wbCanvas.getBoundingClientRect();
        wbCtx.strokeStyle = wbColor;
        wbCtx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        wbCtx.stroke();
    });

    wbCanvas.addEventListener('touchend', stopDrawing);
}

function startDrawing(e) {
    isDrawing = true;
    wbCtx.beginPath();
    wbCtx.moveTo(e.offsetX, e.offsetY);
}

function draw(e) {
    if (!isDrawing) return;
    wbCtx.strokeStyle = wbColor;
    wbCtx.lineTo(e.offsetX, e.offsetY);
    wbCtx.stroke();
}

function stopDrawing() {
    if (isDrawing) {
        wbCtx.closePath();
        isDrawing = false;
    }
}

function setWbColor(color) {
    wbColor = color;
}

function clearWhiteboard() {
    if (wbCtx && wbCanvas) {
        wbCtx.clearRect(0, 0, 0, wbCanvas.width, wbCanvas.height);
    }
}
