<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสอบออนไลน์ - วิชาประวัติศาสตร์ ป.6 (เตรียมสอบเข้า ม.1)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #16a085;
            --accent: #e74c3c;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdde1;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        header h1 {
            font-size: 1.2rem;
        }
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }
        .btn-primary:hover {
            background-color: #138d75;
        }
        .btn-danger {
            background-color: var(--accent);
            color: white;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                height: auto;
                overflow: auto;
            }
        }
        .left-frame {
            flex: 0 0 70%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 20px;
        }
        @media (max-width: 768px) {
            .left-frame {
                flex: 1;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
        .right-frame {
            flex: 0 0 30%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        @media (max-width: 768px) {
            .right-frame {
                height: 400px;
            }
        }
        .whiteboard-header {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #whiteboard {
            flex: 1;
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            cursor: crosshair;
            touch-action: none;
        }
        .question-card {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fafbfc;
        }
        .question-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .clue {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 10px;
            background: #ecf0f1;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            background: white;
            transition: background 0.1s;
        }
        .option-item:hover {
            background: #f1f2f6;
        }
        .explanation {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            display: none;
        }
        .explanation.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .explanation.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        #result-section {
            display: none;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .analysis-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">แบบทดสอบปลายภาค ป.6 วิชาประวัติศาสตร์ (ระดับสอบเข้า ม.1)</h1>
        <div class="header-controls">
            <button class="btn-primary" id="lang-btn" onclick="toggleLanguage()">EN / TH</button>
            <button class="btn-danger" onclick="resetExam()">Reset</button>
            <button class="btn-primary" onclick="submitExam()">ส่งข้อสอบ</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Left Frame: Questions (70%) -->
        <div class="left-frame" id="left-frame-content">
            <div id="quiz-container"></div>
            <div id="result-section">
                <h2>ผลการทดสอบของคุณ</h2>
                <p id="score-display" style="font-size: 1.2rem; font-weight: bold; margin: 10px 0;"></p>
                <div class="analysis-box" id="analysis-content"></div>
            </div>
        </div>

        <!-- Right Frame: Whiteboard (30%) -->
        <div class="right-frame">
            <div class="whiteboard-header">
                <span>กระดานทด (Whiteboard)</span>
                <button class="btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="clearWhiteboard()">ล้างกระดาน</button>
            </div>
            <canvas id="whiteboard"></canvas>
        </div>
    </div>

    <script>
        // ข้อมูลข้อสอบ 30 ข้อ ประวัติศาสตร์ ป.6 (ระดับสอบเข้า ม.1)
        const rawQuestions = [
            {
                id: 1,
                th: {
                    q: "หากนักประวัติศาสตร์ต้องการตรวจสอบความน่าเชื่อถือของเนื้อหาภายในหลักฐาน (Internal Criticism) สิ่งใดที่ต้องนำมาพิจารณาเป็นอันดับแรก",
                    clue: "พิจารณาเจตนาและสภาพแวดล้อมของผู้บันทึก",
                    options: [
                        "อายุของกระดาษและชนิดของหมึกพิมพ์ที่ใช้บันทึก",
                        "ความมุ่งหมาย อคติ หรือสภาพแวดล้อมขณะที่ผู้บันทึกเหตุการณ์นั้นๆ",
                        "ความเก่าแก่ของสถานที่จัดเก็บโบราณวัตถุ",
                        "ประเภทของตัวอักษรและภาษาต่างประเทศที่ปรากฏบนหลักฐาน"
                    ],
                    answer: 1,
                    exp: "การวิพากษ์ภายในเป็นการตรวจสอบเนื้อหา เจตนา อคติ และความถูกต้องน่าเชื่อถือของข้อมูลที่บันทึกไว้ ต่างจากการวิพากษ์ภายนอกที่ดูสภาพกายภาพ"
                },
                en: {
                    q: "If a historian wants to perform internal criticism on historical evidence, what should be considered first?",
                    clue: "Consider the author's intention and recording environment.",
                    options: [
                        "The age of the paper and ink used in recording",
                        "The purpose, bias, or environment of the person recording the event",
                        "The antiquity of the location where the artifact is stored",
                        "The type of script and foreign language appearing on the evidence"
                    ],
                    answer: 1,
                    exp: "Internal criticism examines the content, intention, bias, and reliability of the recorded data, distinct from external physical checks."
                }
            },
            {
                id: 2,
                th: {
                    q: "ข้อใดเป็นการประเมินคุณค่าหลักฐานทางประวัติศาสตร์ด้วย 'การวิพากษ์ภายนอก' (External Criticism)",
                    clue: "ตรวจสอบรูปร่างลักษณะภายนอกและความเป็นของแท้",
                    options: [
                        "การตรวจสอบว่าผู้บันทึกมีอคติทางการเมืองหรือไม่",
                        "การตรวจสอบว่ากระดาษและหมึกที่ใช้ในจดหมายเหตุเป็นวัสดุในสมัยอยุธยาจริงหรือไม่",
                        "การวิเคราะห์ความสมเหตุสมผลของเรื่องเล่าในพงศาวดาร",
                        "การเปรียบเทียบคำให้การของพยานหลายๆ ปากเพื่อให้ได้ข้อเท็จจริง"
                    ],
                    answer: 1,
                    exp: "การวิพากษ์ภายนอกคือการตรวจสอบสภาพทางกายภาพ เช่น เนื้อวัสดุ อายุหมึก ตัวอักษร ว่าเป็นของแท้ดั้งเดิมหรือของปลอมแปลง"
                },
                en: {
                    q: "Which of the following is an example of evaluating evidence through 'External Criticism'?",
                    clue: "Checking physical characteristics and authenticity.",
                    options: [
                        "Checking whether the recorder had political biases",
                        "Checking if the paper and ink used in the archive were genuinely from the Ayutthaya period",
                        "Analyzing the plausibility of stories in chronicles",
                        "Comparing testimonies of multiple witnesses to find facts"
                    ],
                    answer: 1,
                    exp: "External criticism is the physical inspection of materials, ink age, or script to verify if an item is authentic or forged."
                }
            },
            {
                id: 3,
                th: {
                    q: "ขั้นตอนใดของวิธีการทางประวัติศาสตร์ที่มีความสำคัญสูงสุดในการป้องกันไม่ให้นักศึกษาประวัติศาสตร์หลงเชื่อข้อมูลเท็จ",
                    clue: "กระบวนการตรวจสอบความถูกต้องและคุณค่า",
                    options: [
                        "การกำหนดเป้าหมายและตั้งคำถาม",
                        "การรวบรวมหลักฐานจากอินเทอร์เน็ต",
                        "การประเมินคุณค่าของหลักฐาน (การวิพากษ์วิธีทางประวัติศาสตร์)",
                        "การเรียบเรียงและนำเสนอรายงานเป็นรูปเล่ม"
                    ],
                    answer: 2,
                    exp: "การประเมินคุณค่าหลักฐาน (วิพากษ์ภายนอกและภายใน) เป็นหัวใจสำคัญในการคัดกรองข้อมูลเท็จหรือหลักฐานปลอมก่อนนำไปวิเคราะห์"
                },
                en: {
                    q: "Which step of the historical method is most critical in preventing historians from believing false information?",

                    options: [
                        "Setting goals and formulating questions",
                        "Gathering evidence from the internet",
                        "Evaluating the value of evidence (historical criticism)",
                        "Compiling and presenting the report as a book"
                    ],
                    answer: 2,
                    exp: "Evaluating evidence (external and internal criticism) is crucial for filtering out false information or forged evidence before analysis."
                }
            },
            {
                id: 4,
                th: {
                    q: "หากนักเรียนต้องการศึกษาเรื่องราวในสมัยอยุธยาโดยใช้ 'หลักฐานชั้นต้น' และเป็น 'ลายลักษณ์อักษร' ข้อใดมีความเหมาะสมที่สุด",
                    clue: "บันทึกหรือกฎหมายที่สร้างขึ้นในสมัยอยุธยา",
                    options: [
                        "หนังสือเรียนประวัติศาสตร์อยุธยาพิมพ์ครั้งล่าสุด",
                        "กฎหมายลักษณะอาญาหลวงที่ประกาศใช้ในสมัยอยุธยา",
                        "บทความวิเคราะห์เศรษฐกิจอยุธยาโดยนักวิชาการปัจจุบัน",
                        "พงศาวดารกรุงศรีอยุธยาฉบับพระราชหัตถเลขาที่ชำระในรัตนโกสินทร์"
                    ],
                    answer: 1,
                    exp: "กฎหมายลักษณะอาญาหลวงที่ประกาศใช้ในสมัยอยุธยาถือเป็นหลักฐานชั้นต้นที่เป็นลายลักษณ์อักษร เพราะสร้างขึ้นในยุคอยุธยาโดยตรง"
                },
                en: {
                    q: "If a student wants to study the Ayutthaya period using a 'primary source' and 'written evidence', which is most appropriate?",
                    clue: "Laws or records created during the Ayutthaya era.",
                    options: [
                        "The latest printed Ayutthaya history textbook",
                        "The royal criminal law promulgated during the Ayutthaya period",
                        "An analytical article on Ayutthaya's economy by a modern scholar",
                        "The Royal Autograph Edition of the Ayutthaya Chronicle compiled in Rattanakosin"
                    ],
                    answer: 1,
                    exp: "Royal criminal laws enacted during Ayutthaya are primary written sources because they were created directly during that era."
                }
            },
            {
                id: 5,
                th: {
                    q: "ข้อใดเรียงลำดับขั้นตอนของวิธีการทางประวัติศาสตร์ตามหลักวิชาการได้อย่างถูกต้องครบถ้วน",
                    clue: "ตั้ง-รวบ-ประเมิน-วิเคราะห์-เรียบเรียง",
                    options: [
                        "รวบรวมหลักฐาน -> ตั้งคำถาม -> วิเคราะห์ -> ประเมินค่า -> นำเสนอ",
                        "ตั้งคำถาม -> รวบรวมหลักฐาน -> ประเมินคุณค่าหลักฐาน -> วิเคราะห์สังเคราะห์ -> เรียบเรียงและนำเสนอ",
                        "วิเคราะห์ข้อมูล -> ตรวจสอบหลักฐาน -> ตั้งเป้าหมาย -> สรุปผล",
                        "ประเมินคุณค่า -> ตั้งคำถาม -> รวบรวมข้อมูล -> วิเคราะห์ -> เรียบเรียง"
                    ],
                    answer: 1,
                    exp: "ลำดับที่ถูกต้องคือ 1. กำหนดเป้าหมาย 2. รวบรวมหลักฐาน 3. ประเมินคุณค่า 4. วิเคราะห์สังเคราะห์ข้อมูล 5. เรียบเรียงและนำเสนอ"
                },
                en: {
                    q: "Which sequence of the historical method is completely and correctly ordered according to academic principles?",
                    clue: "Set -> Gather -> Evaluate -> Analyze -> Compile.",
                    options: [
                        "Gather -> Question -> Analyze -> Evaluate -> Present",
                        "Question -> Gather -> Evaluate Evidence -> Analyze & Synthesize -> Compile and Present",
                        "Analyze -> Verify Evidence -> Set Goal -> Conclude",
                        "Evaluate -> Question -> Gather -> Analyze -> Compile"
                    ],
                    answer: 1,
                    exp: "The correct sequence is: 1. Set goal 2. Gather evidence 3. Evaluate value 4. Analyze & synthesize data 5. Compile and present."
                }
            },
            {
                id: 6,
                th: {
                    q: "พงศาวดารกรุงรัตนโกสินทร์ รัชกาลที่ 1 ที่เรียบเรียงขึ้นในสมัยหลังเหตุการณ์ จัดเป็นหลักฐานประเภทใด เพราะเหตุใด",
                    clue: "เรียบเรียงขึ้นภายหลังโดยไม่ได้ร่วมสมัย",
                    options: [
                        "หลักฐานชั้นต้น เพราะเป็นเรื่องราวเกี่ยวกับพระมหากษัตริย์โดยตรง",
                        "หลักฐานชั้นรอง เพราะผู้เรียบเรียงไม่ได้อยู่ในเหตุการณ์ร่วมสมัยกับรัชกาลที่ 1 ทั้งหมด",
                        "หลักฐานไม่เป็นลายลักษณ์อักษร เพราะมีการปรับแก้เนื้อหาในภายหลัง",
                        "ไม่ใช่หลักฐานทางประวัติศาสตร์ เนื่องจากมีความลำเอียงสูง"
                    ],
                    answer: 1,
                    exp: "พงศาวดารที่ชำระขึ้นในยุคหลังจัดเป็นหลักฐานชั้นรอง เพราะผู้เรียบเรียงไม่ได้ร่วมสมัยกับเหตุการณ์ แต่ใช้หลักฐานชั้นต้นอื่นๆ มาประมวลเรียบเรียง"
                },
                en: {
                    q: "The Rattanakosin Chronicle of Rama I's reign compiled after the event is what type of evidence and why?",
                    clue: "Compiled later without direct contemporaneity.",
                    options: [
                        "Primary source because it directly concerns the king",

            {

                        "หลักฐานมีความเก่าแก่เกินไปจนไม่สามารถเปิดอ่านได้",
                        "ข้อมูลอาจมีความคลาดเคลื่อนหรือเปลี่ยนแปลงไปตามกาลเวลาและการถ่ายทอดผ่านผู้เล่า",
                        "ไม่มีกฎหมายรองรับความถูกต้องของข้อมูล",
                        "ไม่สามารถนำไปเทียบเคียงกับหลักฐานลายลักษณ์อักษรได้เลย"

                    answer: 1,
                    exp: "มุขปาฐะ (เรื่องเล่าปากเปล่า) มีจุดอ่อนสำคัญคือความคลาดเคลื่อนของการจดจำและการแต่งเติมเสริมแต่งของผู้เล่ารุ่นสู่รุ่น จึงต้องตรวจสอบร่วมกับหลักฐานอื่น"
                },
                en: {

                    options: [

        let currentLang = 'th';
        let userAnswers = {};
        let shuffledQuestions = [];

        // Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Initialize exam with shuffled questions and shuffled options
        function initExam() {
            const savedAnswers = localStorage.getItem('hist_p6_exam_answers');
            const savedLang = localStorage.getItem('hist_p6_exam_lang');
            if (savedLang) currentLang = savedLang;
            if (savedAnswers) {
                try { userAnswers = JSON.parse(savedAnswers); } catch(e) { userAnswers = {}; }
            }

            shuffledQuestions = JSON.parse(JSON.stringify(rawQuestions));
            shuffleArray(shuffledQuestions);

            shuffledQuestions.forEach(item => {
                let qData = item[currentLang];
                let optionsWithIndex = qData.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                shuffleArray(optionsWithIndex);
                qData.shuffledOptions = optionsWithIndex;
            });

            renderQuiz();
            updateHeaderTexts();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            localStorage.setItem('hist_p6_exam_lang', currentLang);
            
            shuffledQuestions.forEach(item => {
                let qData = item[currentLang];
                let optionsWithIndex = qData.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                shuffleArray(optionsWithIndex);
                qData.shuffledOptions = optionsWithIndex;
            });

            renderQuiz();
            updateHeaderTexts();
        }

        function updateHeaderTexts() {
            const titleEl = document.getElementById('header-title');
            if (currentLang === 'th') {
                titleEl.innerText = "แบบทดสอบปลายภาค ป.6 วิชาประวัติศาสตร์ (ระดับสอบเข้า ม.1)";
            } else {
                titleEl.innerText = "Grade 6 History Final Exam (Grade 7 Entrance Level)";
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            document.getElementById('result-section').style.display = 'none';

            shuffledQuestions.forEach((item, index) => {
                const qData = item[currentLang];
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${item.id}`;

                let optionsHTML = '';
                qData.shuffledOptions.forEach((optObj, optIndex) => {
                    const isChecked = userAnswers[item.id] !== undefined && userAnswers[item.id].selectedShuffledIndex === optIndex;
                    optionsHTML += `
                        <label class="option-item" style="${isChecked ? 'background: #e8f8f5; border-color: var(--secondary);' : ''}">
                            <input type="radio" name="question_${item.id}" value="${optIndex}" ${isChecked ? 'checked' : ''} onclick="selectAnswer(${item.id}, ${optIndex}, ${optObj.originalIndex})">
                            <span>${optObj.text}</span>
                        </label>
                    `;
                });

                let explanationClass = 'explanation';
                let explanationText = '';
                if (userAnswers[item.id] !== undefined) {
                    if (userAnswers[item.id].isCorrect) {
                        explanationClass = 'explanation correct';
                        explanationText = currentLang === 'th' ? `ถูกต้อง! เฉลย: ${qData.exp}` : `Correct! Explanation: ${qData.exp}`;
                    } else {
                        explanationClass = 'explanation incorrect';
                        explanationText = currentLang === 'th' ? `ยังไม่ถูกต้อง! เฉลย: ${qData.exp}` : `Incorrect! Explanation: ${qData.exp}`;
                    }
                }

                card.innerHTML = `
                    <div class="question-title">ข้อที่ ${index + 1}. ${qData.q}</div>
                    <div class="clue">💡 คำใบ้: ${qData.clue}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="${explanationClass}" id="exp_${item.id}">${explanationText}</div>
                `;
                container.appendChild(card);
            });
        }

        function selectAnswer(questionId, shuffledIndex, originalIndex) {
            const item = shuffledQuestions.find(q => q.id === questionId);
            const qData = item[currentLang];
            const isCorrect = originalIndex === qData.answer;

            userAnswers[questionId] = {
                selectedShuffledIndex: shuffledIndex,
                selectedOriginalIndex: originalIndex,
                isCorrect: isCorrect
            };

            localStorage.setItem('hist_p6_exam_answers', JSON.stringify(userAnswers));

            const expDiv = document.getElementById(`exp_${questionId}`);
            expDiv.className = isCorrect ? 'explanation correct' : 'explanation incorrect';
            expDiv.innerText = currentLang === 'th' ? 
                (isCorrect ? `ถูกต้อง! เฉลย: ${qData.exp}` : `ยังไม่ถูกต้อง! เฉลย: ${qData.exp}`) : 
                (isCorrect ? `Correct! Explanation: ${qData.exp}` : `Incorrect! Explanation: ${qData.exp}`);

            const card = document.getElementById(`q-card-${questionId}`);
            const labels = card.querySelectorAll('.option-item');
            labels.forEach((lbl, idx) => {
                if (idx === shuffledIndex) {
                    lbl.style.background = '#e8f8f5';
                    lbl.style.borderColor = 'var(--secondary)';
                } else {
                    lbl.style.background = 'white';
                    lbl.style.borderColor = 'var(--border-color)';
                }
            });
        }

        function submitExam() {
            let score = 0;
            let answeredCount = Object.keys(userAnswers).length;
            
            shuffledQuestions.forEach(item => {
                if (userAnswers[item.id] && userAnswers[item.id].isCorrect) {
                    score++;
                }
            });

            const resultSection = document.getElementById('result-section');
            const scoreDisplay = document.getElementById('score-display');
            const analysisContent = document.getElementById('analysis-content');

            resultSection.style.display = 'block';
            
            if (currentLang === 'th') {
                scoreDisplay.innerText = `คุณทำคะแนนได้ ${score} จาก ${shuffledQuestions.length} คะแนน (ตอบแล้ว ${answeredCount} ข้อ)`;
                
                let analysisHTML = `<h3>📊 บทวิเคราะห์ผลการทดสอบ (ระดับสอบเข้า ม.1)</h3><br>`;
                if (score >= 24) {
                    analysisHTML += `<b>จุดเด่น:</b> คุณมีความเข้าใจเนื้อหาประวัติศาสตร์ ป.6 และทักษะการคิดวิเคราะห์เชิงประวัติศาสตร์ (วิธีการทางประวัติศาสตร์ การวิพากษ์หลักฐาน และสมัยรัตนโกสินทร์) ในระดับดีเยี่ยม พร้อมสำหรับการสอบเข้าโรงเรียนแข่งขันสูง<br>`;
                    analysisHTML += `<b>ข้อเสนอแนะเพิ่มเติม:</b> รักษาระดับการฝึกฝนวิเคราะห์โจทย์ประยุกต์และทบทวนเหตุการณ์สำคัญอย่างต่อเนื่อง`;
                } else if (score >= 15) {
                    analysisHTML += `<b>จุดเด่น:</b> มีความรู้พื้นฐานในระดับปานกลาง สามารถแยกแยะประเภทหลักฐานเบื้องต้นและพัฒนาการสมัยรัตนโกสินทร์ได้ดีพอสมควร<br>`;
                    analysisHTML += `<b>จุดด้อย / ควรทบทวน:</b> ควรกลับไปทบทวนเนื้อหาในส่วนของกระบวนการวิพากษ์หลักฐาน (ภายนอก/ภายใน) และผลกระทบเชิงลึกของสนธิสัญญาและนโยบายปฏิรูปประเทศ`;
                } else {
                    analysisHTML += `<b>จุดเด่น:</b> ได้ฝึกฝนและทำความคุ้นเคยกับแนวข้อสอบระดับเข้มข้น<br>`;
                    analysisHTML += `<b>จุดด้อย / ควรทบทวน:</b> แนะนำให้อ่านสรุปเนื้อหาด้านบนใหม่อีกครั้ง โดยเน้นทำความเข้าใจกระบวนการคิดวิเคราะห์ทางประวัติศาสตร์และการจำแนกประเภทหลักฐานให้แม่นยำยิ่งขึ้น`;
                }
                analysisContent.innerHTML = analysisHTML;
            } else {
                scoreDisplay.innerText = `Your Score: ${score} / ${shuffledQuestions.length} (Answered ${answeredCount} items)`;
                let analysisHTML = `<h3>📊 Test Analysis Report (Grade 7 Entrance Level)</h3><br>`;
                if (score >= 24) {
                    analysisHTML += `<b>Strengths:</b> Excellent comprehension of Grade 6 history concepts, historical methods, source criticism, and Rattanakosin development.<br>`;
                    analysisHTML += `<b>Recommendations:</b> Fully prepared for competitive school entrance exams.`;
                } else {
                    analysisHTML += `<b>Strengths:</b> Good familiarity with challenging history exam structures.<br>`;
                    analysisHTML += `<b>Areas for Improvement:</b> Review source criticism steps (external/internal) and deep impacts of treaties and reforms.`;
                }
                analysisContent.innerHTML = analysisHTML;
            }

            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetExam() {
            localStorage.removeItem('hist_p6_exam_answers');
            userAnswers = {};
            initExam();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Whiteboard Drawing Implementation
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            resizeCanvas();
            initExam();
        });

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
        canvas.addEventListener('touchend', stopDraw);

        function startDraw(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        function clearWhiteboard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
