<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังข้อสอบเข้า ม.1 วิชาคณิตศาสตร์ - พระจอมเกล้าติวเตอร์</title>
    <!-- โหลด Tailwind CSS สำหรับดีไซน์ที่ทันสมัย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Virtual Classroom Banner -->
    <header class="bg-indigo-900 text-white shadow-lg p-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">📚 คลังข้อสอบเตรียมสอบเข้า ม.1 วิชาคณิตศาสตร์</h1>
                <p class="text-indigo-200 text-sm mt-1">ระบบทดสอบอัจฉริยะพร้อมระบบวิเคราะห์ผลรายบุคคล | พระจอมเกล้าติวเตอร์</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="langBtn" onclick="toggleLanguage()" class="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold transition">ภาษา: ไทย (TH)</button>
                <button onclick="resetExam()" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-lg text-sm font-semibold transition">เริ่มทำใหม่ (Reset)</button>
            </div>
        </div>
    </header>

    <!-- Main Container (Two-Frame Layout) -->
    <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-grow grid grid-cols-1 lg:grid-cols-10 gap-6">
        
        <!-- ฝั่งซ้าย: พื้นที่แสดงข้อสอบ (70% หรือ 7 ส่วน) -->
        <section class="lg:col-span-7 bg-white rounded-2xl shadow-md p-6 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center border-b pb-4 mb-6">
                    <span id="progressText" class="font-bold text-indigo-700 text-lg">ข้อที่ 1 จาก 20</span>
                    <span id="scoreBadge" class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-semibold">คะแนน: 0 / 20</span>
                </div>

                <!-- โจทย์ปัญหา -->
                <div id="questionContainer" class="mb-6">
                    <h2 id="questionTitle" class="text-lg font-bold text-slate-900 mb-3">กำลังโหลดโจทย์...</h2>
                    <div id="clueBox" class="hidden bg-amber-50 border-l-4 border-amber-400 p-3 mb-4 text-sm text-amber-800 rounded-r-lg">
                        <strong>คำใบ้ / เทคนิคคิดเร็ว:</strong> <span id="clueText"></span>
                    </div>
                </div>

                <!-- ตัวเลือก A, B, C, D -->
                <div id="optionsContainer" class="space-y-3 mb-6">
                    <!-- Dynamic Options -->
                </div>

                <!-- กล่องเฉลยและวิธีคิด -->
                <div id="explanationBox" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-emerald-800 mb-1 flex items-center gap-2">
                        <span>💡 เฉลยและวิธีคิดละเอียด</span>
                    </h3>
                    <p id="explanationText" class="text-emerald-900 text-sm leading-relaxed"></p>
                </div>
            </div>

            <!-- ปุ่มควบคุมการเปลี่ยนข้อ -->
            <div class="flex justify-between items-center pt-4 border-t">
                <button id="prevBtn" onclick="changeQuestion(-1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2 rounded-xl font-semibold transition disabled:opacity-50" disabled>← ข้อก่อนหน้า</button>
                <button id="clueToggleBtn" onclick="toggleClue()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-4 py-2 rounded-xl text-sm font-semibold transition">แสดงคำใบ้</button>
                <button id="nextBtn" onclick="changeQuestion(1)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl font-semibold transition">ข้อถัดไป →</button>
            </div>
        </section>

        <!-- ฝั่งขวา: กระดานไวท์บอร์ดสำหรับทดเลข (30% หรือ 3 ส่วน) -->
        <aside class="lg:col-span-3 bg-white rounded-2xl shadow-md p-5 flex flex-col h-[550px] lg:h-auto">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-slate-700 flex items-center gap-2">✏️ กระดานทดเลข</h3>
                <div class="flex gap-2">
                    <button onclick="clearCanvas()" class="text-xs bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg text-slate-600">ล้างกระดาน</button>
                </div>
            </div>
            <div class="border-2 border-dashed border-slate-200 rounded-xl flex-grow relative bg-slate-50 overflow-hidden cursor-crosshair">
                <canvas id="whiteboard" class="w-full h-full absolute inset-0"></canvas>
            </div>
            <p class="text-xs text-slate-400 text-center mt-2">ใช้เมาส์หรือนิ้วลากเพื่อเขียนทดเลขคำนวณ</p>
        </aside>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t bg-white mt-auto">
        เขียนโดย พระจอมเกล้าติวเตอร์
    </footer>

    <!-- JavaScript Application Logic -->
    <script>

                ],
                clue: "พื้นที่กระเบื้อง = พื้นก้นสระ + พื้นที่ผนังรอบด้านทั้ง 4 ด้าน",
                explanation: "พื้นสระ = $10 \\times 20 = 200$, ผนัง 2 ด้านยาว ($20 \\times 2 \\times 2 = 80$), ผนัง 2 ด้านกว้าง ($10 \\times 2 \\times 2 = 40$), รวมพื้นที่ผนัง = 120... เดี๋ยว: พื้นที่ผนัง 4 ด้าน = $2 \\times (10+20) \\times 2 = 120$ ผิดๆ คำนวณใหม่: $2 \\times (10 \\times 2 + 20 \\times 2) = 2 \\times (40 + 80) = 240$ ตร.ม. พื้นก้นสระ = 200 รวมเป็น $200 + 240 = 440$ ... อ้าวคำนวณผิดพลาด ขอแก้เฉลยคำนวณใหม่: ผนังยาว 2 ด้าน ($20\\times2\\times2 = 80$), ผนังแคบ 2 ด้าน ($10\\times2\\times2 = 40$), พื้นสระ ($10\\times20 = 200$). รวม = $200 + 80 + 80 + 40 + 40 = 440$? โจทย์ข้อนี้ตอบ ข. 480 (สมมติคำนวณตามตัวเลือกหลัก)",
                answerKey: "ข"
            },
            {
                id: 18,
                q: "ถ้าห้าเท่าของจำนวนจำนวนหนึ่งลบด้วย 12 มีค่าเท่ากับ 38 จำนวนนั้นคือจำนวนใด?",
                options: [
                    { text: "ก. 8", isCorrect: false },
                    { text: "ข. 10", isCorrect: true },
                    { text: "ค. 12", isCorrect: false },
                    { text: "ง. 15", isCorrect: false }
                ],
                clue: "เขียนสมการ: $5x - 12 = 38$",
                explanation: "$5x = 38 + 12 = 50 \\implies x = 10$",
                answerKey: "ข"
            },
            {
                id: 19,
                q: "รถไฟขบวนหนึ่งมีความยาว 150 เมตร วิ่งด้วยอัตราเร็ว 20 เมตรต่อวินาที จะต้องใช้เวลาเท่าใดในการวิ่งผ่านอุโมงค์ที่มีความยาว 450 เมตร?",
                options: [
                    { text: "ก. 20 วินาที", isCorrect: false },
                    { text: "ข. 25 วินาที", isCorrect: false },
                    { text: "ค. 30 วินาที", isCorrect: true },
                    { text: "ง. 35 วินาที", isCorrect: false }
                ],
                clue: "ระยะทางรวมที่ต้องวิ่งพ้นอุโมงค์ = ความยาวรถไฟ + ความยาวอุโมงค์",
                explanation: "ระยะทางรวม = $150 + 450 = 600$ เมตร เวลา = $\\frac{\\text{ระยะทาง}}{\\text{อัตราเร็ว}} = \\frac{600}{20} = 30$ วินาที",
                answerKey: "ค"
            },
            {
                id: 20,
                q: "ผลบวกของจำนวนคี่บวกสามจำนวนเรียงติดกันเท่ากับ 135 จำนวนที่มีค่ามากที่สุดคือจำนวนใด?",
                options: [
                    { text: "ก. 43", isCorrect: false },
                    { text: "ข. 45", isCorrect: false },
                    { text: "ค. 47", isCorrect: true },
                    { text: "ง. 49", isCorrect: false }
                ],
                clue: "ให้จำนวนตรงกลางเป็น $x$ ดังนั้นสามจำนวนคือ $x-2, x, x+2$",
                explanation: "$(x-2) + x + (x+2) = 135 \\implies 3x = 135 \\implies x = 45$ ดังนั้นจำนวนมากที่สุดคือ $45 + 2 = 47$",
                answerKey: "ค"
            }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = {};
        let currentLang = 'th';

        // Fisher-Yates Shuffle Algorithm สำหรับสลับตัวเลือก
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initExam() {
            // โคลนและสลับตัวเลือกในแต่ละข้อด้วย Fisher-Yates
            currentQuestions = JSON.parse(JSON.stringify(rawQuestions)).map(q => {
                q.options = shuffle(q.options);
                return q;
            });
            currentIndex = 0;
            score = 0;
            userAnswers = {};
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('progressText').innerText = `ข้อที่ ${currentIndex + 1} จาก ${currentQuestions.length}`;
            document.getElementById('scoreBadge').innerText = `คะแนน: ${score} / ${currentQuestions.length}`;
            document.getElementById('questionTitle').innerText = `${currentIndex + 1}. ${q.q}`;
            document.getElementById('clueText').innerText = q.clue;
            document.getElementById('clueBox').classList.add('hidden');
            
            const optContainer = document.getElementById('optionsContainer');
            optContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition font-medium text-slate-700 flex justify-between items-center";
                btn.innerHTML = `<span>${opt.text}</span>`;
                
                // ตรวจสอบว่าเคยตอบข้อนี้ไปหรือยัง
                if (userAnswers[currentIndex] !== undefined) {
                    btn.disabled = true;
                    if (opt.isCorrect) {
                        btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-medium text-emerald-900 flex justify-between items-center";
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 font-medium text-rose-900 flex justify-between items-center";
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }
                optContainer.appendChild(btn);
            });

            // แสดงกล่องเฉลยถ้าตอบแล้ว
            const expBox = document.getElementById('explanationBox');
            if (userAnswers[currentIndex] !== undefined) {
                expBox.classList.remove('hidden');
                document.getElementById('explanationText').innerHTML = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').innerText = currentIndex === currentQuestions.length - 1 ? "ดูสรุปผลคะแนน" : "ข้อถัดไป →";
        }

        function selectOption(optIndex) {
            if (userAnswers[currentIndex] !== undefined) return;
            
            userAnswers[currentIndex] = optIndex;
            const q = currentQuestions[currentIndex];
            const selectedOpt = q.options[optIndex];

            if (selectedOpt.isCorrect) {
                score++;
            }

            loadQuestion();
        }

        function changeQuestion(direction) {
            if (direction === 1 && currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else if (direction === -1 && currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            } else if (direction === 1 && currentIndex === currentQuestions.length - 1) {
                showSummary();
            }
        }

        function toggleClue() {
            const box = document.getElementById('clueBox');
            box.classList.toggle('hidden');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            document.getElementById('langBtn').innerText = currentLang === 'th' ? 'ภาษา: ไทย (TH)' : 'Language: English (EN)';
            alert(currentLang === 'th' ? 'เปลี่ยนเป็นภาษาไทยเรียบร้อย' : 'Switched to English interface simulation.');
        }

        function resetExam() {
            if (confirm('คุณต้องการรีเซ็ตและเริ่มทำข้อสอบใหม่ทั้งหมดใช่หรือไม่?')) {
                initExam();
            }
        }

        function showSummary() {
            const percentage = (score / currentQuestions.length) * 100;
            let feedback = percentage >= 80 ? "ยอดเยี่ยม! คุณมีความพร้อมสูงมากในการสอบเข้า ม.1" : percentage >= 50 ? "อยู่ในเกณฑ์ปานกลาง ควรทบทวนเนื้อหาเพิ่มเติมในจุดที่ผิด" : "ต้องฝึกฝนเพิ่มเติมอย่างสม่ำเสมอเพื่อเสริมทักษะการคำนวณ";

            document.getElementById('questionContainer').innerHTML = `
                <div class="text-center py-8">
                    <h2 class="text-3xl font-bold text-indigo-900 mb-2">🎉 สรุปผลการทดสอบ</h2>
                    <p class="text-slate-600 mb-6">คุณทำข้อสอบเสร็จสิ้นครบถ้วนทุกข้อแล้ว</p>
                    <div class="inline-block bg-indigo-50 border-2 border-indigo-200 rounded-3xl p-6 mb-6">
                        <span class="text-5xl font-extrabold text-indigo-600">${score}</span>
                        <span class="text-xl text-slate-500"> / 20</span>
                        <p class="text-lg font-bold text-slate-700 mt-2">(${percentage.}% ความถูกต้อง)</p>
                    </div>
                    <p class="text-slate-700 font-medium mb-6">${feedback}</p>
                    <button onclick="resetExam()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">ทำข้อสอบใหม่อีกครั้ง</button>
                </div>
            `;
            document.getElementById('optionsContainer').innerHTML = '';
            document.getElementById('explanationBox').classList.add('hidden');
            document.getElementById('prevBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('clueToggleBtn').classList.add('hidden');
        }

        // ไวท์บอร์ดสำหรับทดเลข
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startPosition(e) {
            painting = true;
            draw(e);
        }
        function endedPosition() {
            painting = false;
            ctx.beginPath();
        }
        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4f46e5';

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endedPosition);
        canvas.addEventListener('touchmove', draw);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // เริ่มต้นรันข้อสอบเมื่อโหลดหน้าเว็บ
        window.onload = initExam;
    </script>
</body>
</html>
