<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสอบออนไลน์ วิชาภาษาไทย ม.1 - พระจอมเกล้าติวเตอร์</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-color); color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--primary-color); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
        .left-frame { flex: 7; padding: 20px; overflow-y: auto; background: white; border-right: 1px solid #ddd; }
        .right-frame { flex: 3; display: flex; flex-direction: column; background: #fff; padding: 15px; }
        .whiteboard-container { flex: 1; border: 2px dashed #ccc; border-radius: 8px; position: relative; margin-bottom: 10px; background: #fff; cursor: crosshair; }
        canvas { width: 100%; height: 100%; display: block; }
        .wb-tools { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn { padding: 8px 12px; background: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger-color); }
        .btn-success { background: var(--success-color); }
        .question-card { margin-bottom: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
        .options label { display: block; padding: 8px 12px; margin: 5px 0; background: #f1f2f6; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .options label.disabled { cursor: not-allowed; opacity: 0.8; }
        .explanation { display: none; margin-top: 10px; padding: 10px; background: #e8f8f5; border-left: 4px solid var(--success-color); font-size: 14px; }
        .clue-box { display: none; margin-top: 5px; padding: 8px; background: #fef9e7; border-left: 4px solid #f39c12; font-size: 13px; }
        .footer-sig { text-align: center; padding: 10px; font-size: 12px; color: #7f8c8d; background: #f1f2f6; }
        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .right-frame { height: 300px; }
        }
    </style>
</head>
<body>

<header>
    <h2>ระบบทดสอบและประเมินผล วิชาภาษาไทย ม.1</h2>
    <div>
        <button class="btn" onclick="toggleLanguage()">เปลี่ยนภาษา (TH/EN)</button>
        <button class="btn btn-danger" onclick="resetExam()">Reset ข้อสอบ</button>
    </div>
</header>

<div class="container">
    <div class="left-frame" id="exam-container">
        <!-- เรนเดอร์ข้อสอบด้วย JavaScript -->
    </div>
    
    <div class="right-frame">
        <h3>กระดานทดเลข / วาดภาพ</h3>
        <div class="wb-tools">
            <button class="btn" onclick="setPenColor('#000')">ดำ</button>
            <button class="btn" onclick="setPenColor('#e74c3c')">แดง</button>
            <button class="btn" onclick="clearCanvas()">ล้างกระดาน</button>
        </div>
        <div class="whiteboard-container" id="wb-container">
            <canvas id="whiteboard"></canvas>
        </div>
        <button class="btn btn-success" onclick="submitExam()">ส่งข้อสอบและสรุปผล</button>
    </div>
</div>

<div class="footer-sig">
    เขียนโดย พระจอมเกล้าติวเตอร์
</div>

<script>
    let currentLang = 'TH';
    let questions = [
        {
            id: 1,
            question: "ข้อใดเป็นการระบุใจความสำคัญจากการอ่านบทความรักษ์โลกได้ถูกต้องที่สุด?",
            options: [
                "การแยกขยะเปียกและขยะแห้งช่วยลดภาวะโลกร้อนได้อย่างยั่งยืน",
                "พลาสติกย่อยสลายยากเพราะมีสารเคมีสังเคราะห์ผสมอยู่",
                "ทุกคนควรตระหนักถึงภัยธรรมชาติที่กำลังจะเกิดขึ้นในอนาคต",
                "ขยะในชุมชนเมืองมีปริมาณเพิ่มสูงขึ้นทุกปีอย่างน่าตกใจ"
            ],
            answer: 0,
            clue: "มองหาประโยคใจความหลักที่ครอบคลุมเนื้อหาการแก้ปัญหามากที่สุด",
            explanation: "เฉลยข้อที่ถูกต้องคือ: การแยกขยะเปียกและขยะแห้งช่วยลดภาวะโลกร้อนได้อย่างยั่งยืน เพราะเป็นใจความสำคัญที่ครอบคลุมที่สุด"
        },
        {
            id: 2,
            question: "ข้อความใดจัดเป็น 'ข้อเท็จจริง' ตามหลักการอ่านวิเคราะห์สาร?",
            options: [
                "น้ำท่วมปีนี้สร้างความเสียหายมากกว่าปีที่ผ่านมาอย่างแน่นอน",
                "จังหวัดเชียงใหม่มีอุณหภูมิต่ำสุด 15 องศาเซลเซียสเมื่อวานนี้",
                "การออกกำลังกายด้วยการวิ่งน่าจะเป็นวิธีลดความอ้วนที่ดีที่สุด",
                "อาหารร้านนี้มีรสชาติอร่อยถูกปากลูกค้าทุกคนอย่างแน่นอน"
            ],
            answer: 1,
            clue: "ข้อเท็จจริงต้องพิสูจน์ยืนยันด้วยตัวเลขหรือหลักฐานเชิงประจักษ์ได้",
            explanation: "เฉลยข้อที่ถูกต้องคือ: จังหวัดเชียงใหม่มีอุณหภูมิต่ำสุด 15 องศาเซลเซียสเมื่อวานนี้ เพราะสามารถตรวจสอบยืนยันด้วยข้อมูลจริงได้"
        }
    ];

    // Fisher-Yates Shuffle Algorithm
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderExam() {
        const container = document.getElementById('exam-container');
        container.innerHTML = '';
        
        questions.forEach((q, index) => {
            // คัดลอกและสลับตัวเลือกพร้อมจำ องศา index เดิม
            let optionPairs = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            shuffle(optionPairs);

            let html = `
                <div class="question-card" id="q-card-${index}">
                    <p><b>ข้อที่ ${index + 1}:</b> ${q.question}</p>
                    <div class="options" id="opt-container-${index}">
            `;
            
            optionPairs.forEach((pair) => {
                html += `<label><input type="radio" name="q${index}" value="${pair.originalIndex}" onchange="lockAndCheck(${index}, ${pair.originalIndex})"> ${pair.text}</label>`;
            });

            html += `
                    </div>
                    <button class="btn" style="margin-top:8px; font-size:12px;" onclick="toggleClue(${index})">เปิด/ปิด คำใบ้</button>
                    <div class="clue-box" id="clue-${index}">${q.clue}</div>
                    <div class="explanation" id="exp-${index}">${q.explanation}</div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function lockAndCheck(qIndex, selected) {
        const qCard = document.getElementById(`q-card-${qIndex}`);
        const inputs = qCard.querySelectorAll('input');
        const labels = qCard.querySelectorAll('label');
        
        // ล็อคไม่ให้เปลี่ยนคำตอบ
        inputs.forEach(input => input.disabled = true);
        labels.forEach(label => label.classList.add('disabled'));

        const correct = questions[qIndex].answer;
        const exp = document.getElementById(`exp-${qIndex}`);
        exp.style.display = 'block';

        if(selected === correct) {
            exp.style.borderLeftColor = 'var(--success-color)';
            exp.innerHTML = '<b>ถูกต้อง!</b> ' + questions[qIndex].explanation;
        } else {
            exp.style.borderLeftColor = 'var(--danger-color)';
            exp.innerHTML = '<b>ยังไม่ถูกต้อง!</b> ' + questions[qIndex].explanation;
        }
    }

    function toggleClue(index) {
        const clue = document.getElementById(`clue-${index}`);
        clue.style.display = clue.style.display === 'block' ? 'none' : 'block';
    }

    function toggleLanguage() {
        currentLang = currentLang === 'TH' ? 'EN' : 'TH';
        alert('เปลี่ยนภาษาเป็น: ' + currentLang);
    }

    function resetExam() {
        localStorage.clear();
        renderExam();
        alert('รีเซ็ตข้อสอบและสลับตำแหน่งตัวเลือกใหม่เรียบร้อยแล้ว');
    }

    function submitExam() {
        alert('ส่งข้อสอบเรียบร้อย! ระบบบันทึกผลและประเมินคะแนนให้ท่านแล้ว');
    }

    // Whiteboard Script
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function resizeCanvas() {
        const container = document.getElementById('wb-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
        resizeCanvas();
        renderExam();
    });

    canvas.addEventListener('mousedown', () => painting = true);
    canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = window.selectedColor || '#000';

        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function setPenColor(color) { window.selectedColor = color; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
</script>

</body>
</html>
