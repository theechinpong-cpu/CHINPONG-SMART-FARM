<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนสนุกคำควบกล้ำสุดหรรษา - อนุบาล 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Sarabun', 'Fredoka One', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 30px;
            text-align: center;
            border: 6px dashed #ff9a9e;
        }
        h1 {
            font-family: 'Fredoka One', cursive, 'Sarabun', sans-serif;
            color: #ff6b6b;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #ffe66d;
        }
        p.subtitle {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }
        
        /* หน้าจอเลือกป้ายวงกลม */
        .circle-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .circle-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #ff9a9e, #fad0c4);
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(145deg, #ff6b6b, #ff9a9e);
        }
        .circle-btn.done {
            background: #a8e6cf;
            color: #3b7a57;
            cursor: not-allowed;
            transform: none;
        }

        /* ส่วนคำถาม */
        .question-box {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .q-header {
            background: #ffe66d;
            color: #d97706;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .q-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .choice-btn {
            background: #f0f4f8;
            border: 3px solid #cbd5e1;
            padding: 15px;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            padding-left: 20px;
            font-weight: bold;
            color: #334155;
        }
        .choice-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }
        .choice-btn.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }
        .choice-btn.incorrect {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        
        .feedback {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 30px;
        }
        .next-btn {
            background: #6EE7B7;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #065f46;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .next-btn:hover {
            background: #34D399;
        }

        /* หน้าสรุปผล */
        .result-box {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .score-display {
            font-size: 32px;
            color: #ff6b6b;
            font-weight: bold;
            margin: 20px 0;
        }
        .restart-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }
        .restart-btn:hover {
            background: #ee5253;
        }

        @media(max-width: 500px) {
            .circle-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎢 สวนสนุกคำควบกล้ำสุดหรรษา 🎡</h1>
    <p class="subtitle">เลือกป้ายวงกลมหมายเลข 1 ถึง 15 เพื่อผจญภัยกับคำควบกล้ำกันเลย!</p>

    <!-- หน้าเลือกป้ายวงกลม -->
    <div id="selection-screen">
        <div class="circle-grid" id="circleGrid"></div>
        <div id="progress-info" style="font-weight: bold; color: #666; font-size: 18px;">ทำไปแล้ว: 0 / 15 ข้อ</div>
    </div>

    <!-- หน้าทำข้อสอบ -->
    <div class="question-box" id="questionBox">
        <div class="q-header" id="qHeader">ข้อที่ 1</div>
        <div class="q-text" id="qText">คำถาม...</div>
        <div class="choices-container" id="choicesContainer"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" onclick="backToSelection()">กลับไปเลือกป้าย</button>
    </div>

    <!-- หน้าสรุปผลคะแนน -->
    <div class="result-box" id="resultBox">
        <h2>🎉 เก่งมากๆ เลยเด็กๆ! 🎉</h2>
        <div class="score-display" id="scoreDisplay">คะแนนที่คุณได้รับ: 0 / 15</div>
        <p style="font-size: 18px; color: #555; margin-bottom: 20px;">หนูเป็นคนเก่งเรื่องคำควบกล้ำมากๆ เลยปรบมือให้ตัวเองหน่อยจ้า 👏👏</p>
        <button class="restart-btn" onclick="restartQuiz()">เล่นใหม่อีกครั้ง 🔄</button>
    </div>
</div>

<script>
    // คลังข้อสอบ 15 ข้อ (ควบแท้ และ ควบไม่แท้ สำหรับอนุบาล 3)
    const allQuestions = [
        {
            q: "คำว่า **'กล้วย'** เป็นคำควบกล้ำประเภทใด?",
            choices: ["ควบกล้ำแท้", "ควบกล้ำไม่แท้", "ไม่ใช่คำควบกล้ำ"],
            answer: 0,
            explain: "ถูกต้องจ้า! 'กล้วย' มี ก และ ล ควบกัน ออกเสียงพร้อมกันเป็น ควบกล้ำแท้ 🍌"
        },
        {
            q: "คำว่า **'จริง'** (อ่านว่า จิง) เป็นคำควบกล้ำประเภทใด?",
            choices: ["ควบกล้ำแท้", "ควบกล้ำไม่แท้", "คำที่มี ห นำ"],
            answer: 1,
            explain: "เก่งมาก! 'จริง' เขียนด้วย จร แต่อ่านออกเสียงแค่ตัว จ ตัวเดียว จึงเป็นควบกล้ำไม่แท้จ้า 🤫"
        },
        {
            q: "คำว่า **'พระ'** มีพยัญชนะต้นควบกล้ำตัวใด?",
            choices: ["พ - ล", "พ - ร", "พ - ว"],
            answer: 1,
            explain: "ถูกต้องแล้ว! คำว่า พระ ควบด้วย พ และ ร ⛪"
        },
        {
            q: "คำว่า **'สร้าง'** เป็นคำควบกล้ำประเภทใด?",
            choices: ["ควบกล้ำแท้", "ควบกล้ำไม่แท้", "คำประสม"],
            answer: 1,
            explain: "ยอดเยี่ยม! 'สร้าง' ออกเสียงแค่ 'ส่าง' ไม่ออกเสียง ร จึงเป็นควบกล้ำไม่แท้ 🛠️"
        },
        {
            q: "คำในข้อใดเป็น **'คำควบกล้ำแท้'**?",
            choices: ["ทราย", "เศร้า", "กราบ"],
            answer: 2,
            explain: "เก่งจัง! 'กราบ' คือ ก ควบกับ ร ออกเสียงพร้อมกัน เป็นควบกล้ำแท้ 🚢"
        },
        {
            q: "คำว่า **'ครู'** ออกเสียงพยัญชนะควบกล้ำข้อใด?",
            choices: ["ค - ร", "ค - ล", "ค - ว"],
            answer: 0,
            explain: "ถูกต้อง! ค ควบกับ ร ออกเสียง คู...ครู 🧑‍🏫"
        },
        {
            q: "คำว่า **'เศร้า'** (อ่านว่า เส้า) จัดเป็นคำควบกล้ำแบบไหน?",
            choices: ["ควบกล้ำแท้", "ควบกล้ำไม่แท้", "อักษรนำ"],
            answer: 1,
            explain: "ถูก 100%! 'เศร้า' ออกเสียง ศ เป็น ซ (ส) และไม่ออกเสียง ร เป็นควบกล้ำไม่แท้ 🌧️"
        },
        {
            q: "คำว่า **'กวาง'** มีพยัญชนะควบกล้ำตัวหลังคือตัวอะไร?",
            choices: ["ร", "ล", "ว"],
            answer: 2,
            explain: "เยี่ยมมาก! ก - ว - าง 'กวาง' ใช้พยัญชนะ ว ควบกล้ำจ้า 🦌"
        },
        {
            q: "ข้อใด **ไม่ใช่** คำควบกล้ำแท้?",
            choices: ["ปลูก", "10 (สิบ)", "ปรับ"],
            answer: 1,
            explain: "ถูกต้องที่สุด! คำว่า 'ศิษย์ ซทรักษ์ จริงไซร้ สระเศร้า...' 'สิบ' ไมใช่คำควบกล้ำ เป็นคำปกติจ้า 🌟"
        },
        {
            q: "คำว่า **'10 (สิบ)'** เมื่อสะกดต่างจากคำว่า **'ทราย'** อย่างไร?",
            choices: ["สิบเป็นควบแท้ ทรายไม่แท้", "สิบไม่ใช่ควบกล้ำ ทรายเป็นควบไม่แท้", "ทั้งสองคำเหมือนกัน"],
            answer: 1,
            explain: "เก่งมาก! 'สิบ' ไม่ใช่คำควบกล้ำ ส่วน 'ทราย' เป็นคำควบกล้ำไม่แท้ (อ่านว่า ซาย) 🏖️"
